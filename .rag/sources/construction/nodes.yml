          | 普通约会阶段 | 建立拒绝安全感 | 楚辞至少一次明确拒绝留下或拒绝推进，晏林正常接受 | 拒绝不撤回关系、工作入口或保护 | 楚辞人物线 |
          | 自由私人关系兑现前 | 完成非排他必要告知 | 晏林说明其他稳定关系、非唯一位置与共同生活边界 | 不泄露其他伴侣隐私，不要求多人授权 | `PL-M-016` |
