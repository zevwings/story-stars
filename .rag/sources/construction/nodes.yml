          - 不制造“被管理局抓捕”“公开带走”或对黑市外围可见的保护性转移。
          - 白玥停止响应原匿名订单入口，但管理局不通过该入口放料、钓鱼或回线调查。
          - 裴家只能看到订单失败与执行端失联，不能确认白玥主动入案、管理局介入、保护地点或晏林立场。
      - heading: 对应正式节点
        value: |-
          - [PL-S-151｜匿名线上订单记录入案](../../plotlines/副线/人物/白玥/匿名线上订单记录入案.md)、[PL-S-152｜私域实体记录方向入案](../../plotlines/副线/人物/白玥/私域实体记录方向入案.md)
          - [PL-S-153｜利益冲突披露与程序隔离](../../plotlines/副线/人物/白玥/利益冲突披露与程序隔离.md)、[PL-S-154｜个人担保被否决并由管理局承担风险](../../plotlines/副线/人物/白玥/个人担保被否决并由管理局承担风险.md)、[PL-S-155｜白玥选择有限监管印](../../plotlines/副线/人物/白玥/白玥选择有限监管印.md)
          - [PL-S-113｜能力执行端失效与新型药剂替代](../../plotlines/副线/组织/裴家/能力执行端失效与新型药剂替代.md)
      - heading: 执行顺序
        value: >-
          | 顺序 | 场景功能 | 必须发生 | 执行边界 |

          | --- | --- | --- | --- |

          | 1 | 完成真实程序 | 白玥完成初步陈述、保护接入、程序隔离与有限监管印选择 | 不公开案件，不完成上游定位或责任认定 |

          | 2 | 转入低暴露保护 | 管理局以普通社会无法识别的方式安排安全住所、通信与必要生活接口 |
          不在黑市观察范围内公开带离，不制造抓捕现场 |

          | 3 | 原入口停止响应 | 白玥停止登录、接单和联系原匿名订单链 | 不回线钓鱼，不发送误导信息，不让白玥承担调查风险 |

          | 4 | 裴家错误归因 | 裴家只将订单失败和执行端失联理解为能力执行端不稳定、个人退出或风险失控 |
          不得确认管理局介入、晏林身份或秘密调查存在 |

          | 5 | 药剂替代 | 裴家因执行端不稳定转向普通外围和客户可使用的新型违禁精神药剂 | 替代不依赖抓捕假象，不补具体制造或投放流程 |
      - heading: 不得写偏
        value: |-
          - 不让任何黑市外围人员看见白玥被管理局控制或带走。
          - 不让管理局主动向裴家释放真假消息。
          - 不让白玥回到旧入口取证、联系上游或充当诱饵。
          - 不用保护换取证言、亲密、种印同意或从宽。
