          - 本页只服务 `PL-S-145、PL-S-146` 与
          `PL-S-148、PL-S-150、PL-S-149、PL-S-147`。私人身体关系、正式陈述、保护接入和种印不得提前塞入本单元。

          - 多节点共享事件只执行一次；具体日期、项目名、包厢动作和对白由章纲绑定。
      - heading: PL-S-145、PL-S-146｜白玥多笔订单与行为责任形成
        value: |-
          - **正式节点**：[PL-S-145｜多笔不同性质订单累积](../../plotlines/副线/人物/白玥/多笔不同性质订单累积.md)、[PL-S-146｜白玥认识到既有欲望不能替代同意](../../plotlines/副线/人物/白玥/白玥认识到既有欲望不能替代同意.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 |
          | --- | --- | --- | --- |
          | 安若曦订单后 | 让白玥的行为不能被单一事件概括 | 白玥继续承接性质不同的成人订单，其中既有明确授权，也有灰色诱导与明确拒绝后仍要求改变选择的订单 | 正常成人委托不洗白安若曦事件；越界订单也不能反推所有订单都是强迫 |
          | 多笔订单累积 | 击穿统一自我解释 | 白玥逐步看见“欲望本来存在”不能替代有效同意，也知道部分目标已经明确拒绝 | 她的认知变化不自动带来退出、悔悟或免责 |
          | 私域订单前 | 保留既往责任 | 白玥已能区分部分边界，却仍因收入、恐惧、受制与侥幸继续接单 | 后续完整逆流和一周内主动入案都不能改写这段既往事实 |
      - heading: PL-S-148、PL-S-150、PL-S-149、PL-S-147｜私域拒绝陪侍与完整逆流
        value: |-
          - **正式节点**：[PL-S-147｜杨柳明确拒绝陪侍](../../plotlines/副线/人物/白玥/杨柳明确拒绝陪侍.md)、[PL-S-148｜白玥在看见拒绝后仍主动施术](../../plotlines/副线/人物/白玥/白玥在看见拒绝后仍主动施术.md)、[PL-S-149｜晏林识别白玥并完成完整逆流](../../plotlines/副线/人物/白玥/晏林识别白玥并完成完整逆流.md)、[PL-S-150｜私域现场压事并留下经营责任](../../plotlines/副线/人物/白玥/私域现场压事并留下经营责任.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 |
          | --- | --- | --- | --- |
          | 三层晚会 | 完成顾清言第一次正式见面并建立公开场 | 顾清言在晚会中段与晏林第一次正式交谈；裴怀山、杨柳、白玥、私域店级负责人杨钰琪和杨柳经纪人均在当晚场域 | 顾清言已经被种印很久，但本场不发作；不提被动标记、能力或调查 |
          | 四层分流 | 固定明确拒绝与现实压力并存 | 杨柳完成公开活动后，在公共会客区与私人包厢之间明确拒绝继续陪侍裴怀山；经纪人仍以合同、项目、名誉或团队前景施压；白玥经匿名线上链收到处理后的任务 | 现实压力不构成同意；白玥不知道真实客户就是在场的裴怀山 |
          | 白玥越界施术 | 使主动行为责任成立 | 白玥看见杨柳已经拒绝，仍以“欲望原本存在”为理由建立连接并放大欲望 | 欲望、恐惧、资源需要或妥协冲动不能替代同意 |
          | 普通会员介入 | 保持晏林的民间身份 | 已通过私域审核并由本人缴纳会费的晏林以普通会员身份和私人欲望正常在场，发现异常后作为现场第三方止损 | 不使用管理局证件入场，不执行官方行动，不在现场讯问 |
          | 身份认出 | 接回安若曦事件 | 晏林从相同的权柄方向、连接方式和截断反馈，高置信认出白玥就是安若曦事件的匿名施术者 | 这是本人直接经验，不是足以单独定案的司法证据 |
          | 完整逆流 | 完成即时止损 | 晏林先让杨柳脱离持续输入，再沿白玥主动建立的连接返还尚未落地的作用 | 不读取客户、后台或白玥记忆；完整逆流不等于控制白玥 |
          | 裴怀山感知错位 | 保留反派观察但不暴露逆流 | 裴怀山感到白玥主动施术产生的外放精神波动，只看见她随后突然失衡 | 逆流沿已开通道内侧完成，不形成新的外放连接；裴怀山不读心、不识别晏林能力 |
          | 晏林追出 | 接入同日后续 | 白玥仍能停止、判断危险、拒绝并离开；晏林立即跟上，原本准备追问安若曦事件与当前订单 | 不等待杨柳交接；车内靠近与身体关系由 `CON-0030` 承接 |
          | 私域压事 | 保留杨柳后果与场所责任 | 店级负责人封闭区域、疏散普通来宾，裴怀山与经纪接口要求内部处置并压住外传；顾清言承担最终经营责任 | 不新增直接强制身体行为；杨柳当晚不进入正式保护，现场记录也不能被写成全部消失 |
      - heading: 知情边界
        value: |-
          - 杨柳知道自己拒绝后仍受到异常欲望影响、晏林短暂中止了当前危险；她不需要知道白玥完整订单史或晏林双子星结构，也没有在当晚取得正式程序说明。
          - 晏林可以高置信认出白玥与安若曦事件的同一性，但不能由逆流获得线上上游、真实客户或完整责任链。
          - 白玥知道晏林能够完整返还自己仍在传递的欲望作用，不因此知道双子星结构、两颗星的权柄分配或四项权柄。
          - 裴怀山只感到白玥外放施术的精神波动，不知道晏林实施逆流；顾清言及杨钰琪只按各自实际接触范围知道晚会与异常处置。
          - 私域留下对应晚会来宾、项目、房间、人员、车辆与异常处置记录；记录只能证明各自环节，压事不能使全部痕迹客观消失。
      - heading: 不得写偏
        value: |-
          - 不把杨柳事件移回普通酒店、商务酒局或云顶 KTV。
          - 不让晏林以管理局协查者身份取得私域准入、现场指挥或盘问权限。
          - 不让晏林留下处理杨柳、完成报警或正式交接；他在逆流后立即追白玥。
          - 不把私域压事写成杨柳追认陪侍、发生新的直接强制身体行为，或全部记录被无痕清除。
          - 不把完整逆流后的欲望压力写成白玥自动同意后续身体关系；选择门槛由下一施工单元单独承接。
          - 不让白玥因其后一周内主动进入管理局程序而免除多笔订单和杨柳事件的主动责任。
