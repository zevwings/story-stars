      - heading: PL-S-194、PL-S-195｜晏林机密能力调用与权限升级
        value: |-
          - **正式节点**：[PL-S-194｜机密能力正式调用](../../plotlines/副线/人物/晏林/机密能力正式调用.md)、[PL-S-195｜权限升级](../../plotlines/副线/人物/晏林/权限升级.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 成年女艺人订单 | 留下第一组可归档的清醒侧感知异常 | 个案记录保存清醒状态下五感结果被改写、且普通梦境任务摘要不足以单独解释的结果 | 单案只记录结果，不直接向普通经办人员公开绘影或完整双子星档案 | `PL-S-148、PL-S-150、PL-S-149、PL-S-147` |
          | 后续独立协查 | 以另一独立案件重复同类异常 | 至少一宗与成年女艺人订单相互独立的案件，再次留下可归档的清醒侧感知偏差结果 | 不预定案件主体、场所与具体过程；不以精神材料替代现实记录 | `PL-S-194、PL-S-195` |
          | 跨案汇总 | 完成机密权限上送 | 沈宁将多案结果整理为“普通任务摘要不足以解释现场结果”的权限问题，并转交有权负责人核验最高机密档案 | 安若曦酒吧事件不进入管理局材料；普通经办人员不得直接读取或复制完整档案 | `PL-S-007` |
      - heading: PL-S-007｜管理局受控合作与机密授权
        value: |-
          - **正式节点**：[PL-S-007｜管理局受控合作与机密授权](../../plotlines/副线/组织/管理局/受控合作与机密授权.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 机密档案核验 | 把跨案疑点收束为当次任务所需的已登记能力 | 有权负责人按本人申报、受控演示与专项复核的证据状态确认晏林大学登记时已完整报备双子星与四项权柄，并只向任务人员说明最低必要能力、已验证条件、风险与退出条件 | 不把本人申报写成设备扫描结论，不把完整档案复制给普通经办层；核验不等于公开全部战术细节或复制晏林的契约自知 | `PL-S-194、PL-S-195` |
          | 合作方案签责 | 落实既有协作的访问审计与机密能力逐案授权 | 沈宁衔接管理层方案；常规任务只调用织梦方向，需要绘影、断流或倒卷时另行取得本人同意并记录范围 | 沈宁不兼任全部经办、风险评估、授权与审计；一次授权不自动延续 | `PL-M-028、PL-M-029、PL-M-025、PL-M-026、PL-M-027` |
          | 访问审计与保护 | 让管理局的重视同时承担边界责任 | 档案访问、复制、转交和权限扩张留痕；晏林可提出异议，管理局落实健康评估、控制训练、异常支持、任务风险准备和泄密防范 | 不写成基础能力教学、机构所有权、强制实验、全天监控或无限出勤 | `PL-M-028、PL-M-029、PL-M-025、PL-M-026、PL-M-027` |
