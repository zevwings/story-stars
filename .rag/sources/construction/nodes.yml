      - heading: PL-I-038｜付费关系结束后的间断性私人回归
        value: |-
          - **正式节点**：[PL-I-038｜付费关系结束后的间断性私人回归](../../plotlines/亲密线/晏林/俞予安×宁悠悠×王诗悦-付费关系结束后的间断性私人回归.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 付费关系结束 | 明确切断原交易结构 | 小鱼儿、悠悠、悦悦均不再以商业服务身份联系晏林 | 旧付费经历不自动转化为私人权限 | `PL-I-030`、`PL-I-034`、`PL-I-036` |
          | 关停后三人组局 | 给云顶终局留下生活回声 | 小鱼儿、悠悠、悦悦私下聚在一起，吐槽停止亲自商业服务后确实少了一部分收入，同时承认现在不用再亲自陪侍 | 不把三人写成失去云顶工资的固定员工，也不怀念债务控制、排班或规训 | `PL-S-084` |
          | 小鱼儿主动邀约 | 从职业吐槽转入私人欲望 | 小鱼儿提议把晏林叫来，并由她主动发出邀约；悠悠、悦悦可以当场表示愿意见他，也保留不参加后续的权利 | 不把邀约说成重新接活，不用商业话术讨论这次见面 | `PL-I-038` |
          | 晏林自觉买单 | 保留普通组局的现实动作 | 晏林到场后自觉结清当次聚会消费 | 买单只覆盖聚会消费，不产生身体权限，也不把四人的关系重新变成付费服务 | `PL-I-038` |
          | 悠悠首次非付费加入 | 用一句话切断四人当次的旧交易关系 | 亲密戏开场前，小鱼儿大方地问晏林：“不收你钱，去不去。”悠悠与悦悦随后分别确认本人是否参加及参加范围 | 小鱼儿、悦悦与晏林此前已在 `PL-I-041` 建立非付费入口；本场是悠悠首次非付费加入，不追加成套解释，也不能由小鱼儿替另外两人授权 | `PL-I-041`、`PL-S-182、PL-S-183`、`PL-S-084`、`PL-I-038` |
