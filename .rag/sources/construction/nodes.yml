    source_file: story/construction/云顶KTV会所线/CON-0024-云顶关停与债务控制终止.md
    registry_file: story/construction/_status/active.md
    registry_line: 30
    registry_quote: "| CON-0024 | [CON-0024｜云顶关停与债务控制终止施工](../云顶KTV会所线/CON-0024-云顶关停与债务控制终止.md) | 副线 / 组织 / 云顶KTV | PL-S-111 | 阶段四 |  | 固定关停安排形成、阿九个人脱离、于静收监与云顶实体关停的先后顺序；悠悠裸贷另线清零。 |"
    sections:
      - heading: 使用边界
        value: |-
          - 本页不记录生命周期状态；当前状态只从 `story/construction/_status/` 读取。
          - 本页先形成关停决定及执行安排，但该状态尚不完成 `PL-S-111`；随后由 `CON-0028` 完成阿九的 `PL-S-179`，本页只继承其结果进入实际关停。
          - 阿九的有限陈述与正式保护由 `PL-S-177、PL-S-178` 先行完成；保护接入可以阻止继续受害，但不自动完成赌债和云顶控制解除。
          - 悠悠的非赌博型裸贷余额由 `PL-S-110` 和 `CON-0025` 独立清零；本页只继承结果，不重复执行。
          - 阿九与悠悠的债务来源、清零路径和后续余波彼此独立，任何一条都不是另一条的完成前提。
          - 于静只承接到店后的店级执行责任；顾清言与章绍衡的上层往来不得通过于静的全知陈述补齐。
      - heading: PL-S-111｜于静收监与云顶关停
        value: |-
          - **正式节点**：[PL-S-111｜于静收监与云顶实体关停](../../plotlines/副线/组织/云顶KTV/于静收监与云顶实体关停.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 关停决定及执行安排形成 | 建立阿九正式脱离的时间门槛 | 现实调查已经足以确定云顶将被关闭，具体执行进入排期，但于静尚未收监、实体场地尚未实际关闭 | 这是施工层过渡状态，不提前完成 `PL-S-111`，也不把内部安排公开成全案收网信号 | `PL-S-090`、`PL-S-130`、`PL-S-111` |
          | 阿九个人脱离 | 固定关停安排与人物解除的先后 | 关停安排形成后，由 `CON-0028` 完成阿九个人赌债、服务抵扣义务和云顶直接控制解除，阿九退出排班与服务投放 | 本页只继承 `PL-S-179` 结果，不重复执行；个人脱离不启动非付费关系 | `PL-S-177、PL-S-178、PL-S-179` |
          | 悠悠个人清零另线完成 | 防止把不同债务路径并回公共节点 | 悠悠另由 `PL-S-110` 完成裸贷余额清零 | 不把悠悠接入赌场线，也不把阿九纳入裸贷影像线 | `PL-S-110`、`PL-S-183` |
          | 关停执行过渡 | 保留个人脱离与实体关停的短暂时间差 | 阿九离开后，云顶只进入关停执行和人员分流，不再新增债务对象、排班或服务投放 | 不把执行过渡写成正常续营，不再用旧账继续控制任何人 | `PL-S-089`、`PL-S-179`、`PL-S-111` |
          | 店级责任落位 | 固定于静能做、能知和不能知的边界 | 于静负责接收、训练、排班与服务投放，并承担阿九脚本化服从训练的直接责任 | 于静不参与顾清言—章绍衡的联系、目标决定、结算或分利，不掌握两人往来的直接证据 | `PL-S-130` |
          | 收监与关停 | 结束固定场所及店级控制链 | 于静收监，云顶实体场地关停，旧接收、排班、规训和服务投放停止 | 只交代结果，不写具体事件；关停不替上层责任人免责 | `PL-M-036、PL-M-037、PL-M-038` |
          | 关停后分流 | 把场所终局交给各人物后果线 | 小鱼儿、悠悠、悦悦回到各自原有生活，不建立共同职业网络；与晏林的付费关系结束，私人关系另行确认。阿九主动完成告别共餐与一次非交易亲密后离开 | 三人的其他商业选择各自独立；阿九未来城市、职业、住处、关系与是否重逢保持开放 | `PL-I-038`、`PL-I-062`、`PL-I-063` |
      - heading: 章节落点建议
        value: |-
          - 关停决定及执行安排先形成，再把阿九个人脱离交给 `CON-0028`；收到 `PL-S-179` 完成结果后，本页才继续兑现于静收监与实体关停。
          - 悠悠裸贷清零另由 `CON-0025` 完成，不占用阿九脱离与场所关停之间的先后链。
          - 于静的终局只需一个可核验结果句；她的店级责任通过此前行动和材料回收，不依赖临场长篇供述。
          - 云顶关停后把悠悠债务与影像后果交给 `CON-0025`，小鱼儿、悠悠、悦悦的低频私人关系确认交给 `CON-0026`；阿九的告别共餐、一次非交易亲密与离开由 `CON-0028` 承接，不再设置尾声重逢施工。
      - heading: 不得写偏
        value: |-
          - 不把两条个人清零结果写成所有伤害、影像与规训后果一并消失。
          - 不让于静替顾清言完成上层认罪，也不让她成为替所有人吸责的唯一终点。
          - 不让阿九在关停安排形成前就完成正式债务和控制解除，也不把她留到实体实际关停后才脱离。
          - 不把阿九的告别亲密或其后任何未定生活写成案件安置、债务解除回报或晏林包办。
