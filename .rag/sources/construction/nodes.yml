    summary: 把两人的公共观星、分别结契、现实异常、公开救援接触和第一次最低必要揭密连成一条可演出的前史链，楔子结束于两人决定接受后续评估。
    headings:
      - 执行目标
      - 场景顺序
      - 最低必要揭密内容
      - 视角与信息边界
      - 固定终点
    content_indexed: true
    source_file: story/construction/晏林双子星与管理局线/CON-0046-锦云山结契与最低必要揭密楔子.md
    registry_file: story/construction/_status/active.md
    registry_line: 25
    registry_quote: "| CON-0046 | [CON-0046｜锦云山结契与最低必要揭密楔子施工](../晏林双子星与管理局线/CON-0046-锦云山结契与最低必要揭密楔子.md) | 副线 / 人物 / 晏林 | PL-S-303 | 楔子；未绑定具体章节 |  | 固定楔子止于第一次最低必要揭密与两人决定接受后续评估；不提前完成登记、能力复核、控制训练或星辰之桥。 |"
    sections:
      - heading: 执行目标
        value: 把两人的公共观星、分别结契、现实异常、公开救援接触和第一次最低必要揭密连成一条可演出的前史链，楔子结束于两人决定接受后续评估。
      - heading: 场景顺序
        value: |-
          1. 两人以已经成立的伴侣关系共同夜爬锦云山，现实生活和看日出安排先于异能显影。
          2. 黎明前仍可目视真实星空时，两人分别完成星辰回应；晏林的双子星两契同立，景雪瑶完成自己的回应。
          3. 两人已经能感知自身星辰、精神之海与当时成形的操作路径，并尝试依照本能可知的方法收束负荷；他们无法解释的是这些现象在人类社会中的名称、相对位置与后果。先以伴侣之间的观察与互相确认承接，不急于解释世界观。
          4. 晴夜轮值以景区救援、天文活动协作或公共安全身份处理保暖、休息、下山和普通风险排查。
          5. 轮值协作者在近距离观察到疑似契约者迹象后，建立后续异常评估联系；不在公共现场揭密或强制检测。
          6. 管理局在非公开环境进行第一次最低必要揭密，两人决定接受后续评估。
      - heading: 最低必要揭密内容
        value: |-
          - 说明他们经历的异常可能不是普通疾病或单纯幻觉；
          - 说明世界上存在需要保密的星辰契约现象；
          - 说明管理局可提供契约确认、精神海评级、能力申报与复核、异常健康评估、控制训练、风险演练、保密和申诉渠道；
          - 说明管理局不会替他们定义自身第一人称体验，也不会把已有操作自知包装成机构授予；
          - 说明完成登记会使星辰身份进入官方星表，并带来真实的信息代价；
          - 说明拒绝登记不自动构成犯罪，但现实伤害、外泄和非法控制仍按风险处置。
      - heading: 视角与信息边界
        value: |-
          - 场景按单一视角组织；两人的感受只能通过各自观察、表达和有限传念显现，不使用上帝视角解释星辰回应的客观意志。
          - 轮值人员只能依据现实症状、近距离同类模糊感和当次公开提示行动，不能得知晏林完整双子星结构、四项权柄或景雪瑶具体权柄。
          - 第一次揭密不展开管理局编制、完整星表、其他契约者名单、最高机密审批、精神检测全套流程或星辰之桥规则。
      - heading: 固定终点
        value: 楔子最后一个有效状态是：两人听完最低必要解释，决定接受后续评估与登记安排。正式登记、晏林完整机密报备、景雪瑶权柄登记、能力复核、控制训练和星辰之桥建立留到后续前史或回忆承接。
