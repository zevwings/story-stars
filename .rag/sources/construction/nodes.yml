    source_file: story/construction/工作室咨询线/01_魏琳首次咨询与复学收束.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 使用边界
        value: |-
          - 魏琳保持单元来访者定位，不因开场示范自动进入核心人物线。
          - 第一次咨询只完成问题方向定位与第一个现实选择，不完成家长告知、学校介入、试返校、正式复学或治愈。
          - 梦境辅助只在现实评估、本人同意、最低干预与醒后现实核验的边界内运行，不替代诊疗、证据或魏琳的选择。
          - 监护授权不能替代魏琳本人同意；晏林不代替她向家长讲述问题根因。
      - heading: 开场基线
        value: |-
          - 魏琳为 17 岁高二学生，经江州第一医院独立评估后转介至林语心理咨询工作室。
          - 她当前继续暂时休学，不进入复学或试返校安排。
          - 问题根因为：好友遭同伴排挤后，魏琳因恐惧选择沉默，继而把返校理解为对好友的背叛。
          - 开场时家长尚不知道问题根因；学校只知道办理休学所需的行政信息。
      - heading: 执行顺序
        value: >-
          | 顺序 | 场景功能 | 必须发生 | 执行边界 |

          | --- | --- | --- | --- |

          | 首次现实评估 | 建立咨询与授权边界 | 确认医院已完成独立评估与转介；晏林只在魏琳本人同意后使用梦境辅助 |
          不由工作室越权医学诊断，不让监护授权覆盖本人选择 |

          | 末班车梦境 | 让问题方向显影 | 魏琳在站台等待已经不会出现的好友；晏林只让车门多停几秒，是否上车仍由她决定 |
          不让晏林替她上车、留下或宣布问题已经解决 |

          | 醒后核验 | 把梦境放回现实 | 通过现实访谈核验她的感受、记忆与当下意愿 | 不把梦境象征当作事实、诊断或证据 |

          | 首次现实行动 | 给出可撤回的第一步 | 魏琳穿便服走到学校附近，并保留不进入校园的选择 |
          这只是休学期间的接触练习，不等于试返校、复学或治愈 |

          | 中间恢复 | 让变化经过时间而不抢占主线 | 恢复期约每周一至两次咨询，并接受后续复诊与复学评估 |
          中间场次只通过预约、工作室日常或简短反馈带过 |

          | 表达准备 | 使家长告知仍由魏琳主动完成 | 晏林帮助魏琳准备表达，由她决定时机与说法 | 晏林不代为披露完整梦境、好友身份或无关隐私
          |

          | 最后一次关键咨询 | 完成从沉默到可以表达的变化 | 魏琳不由晏林代述，用自己的话向家长说出内心想法和当时发生的事情 |
          这只证明她进入可以表达与沟通的阶段，不等于完全治愈 |

          | 复诊与复学评估 | 让现实专业系统承接结果 | 魏琳完成上述表达后，由后续复诊与复学评估确认已可以复学 |
          不由晏林单方决定复学，不用一次表达取代复诊评估 |

          | 学校侧承接 | 完成最低必要知情与复学安排 | 家长知情后，魏琳及家长再与学校做复学所需的最低必要沟通 |
          学校不取得完整梦境、好友身份与无关隐私 |
      - heading: 知情分层
        value: >-
          | 主体 | 开场知情 | 后续变化 | 不得自动获得 |

          | --- | --- | --- | --- |

          | 魏琳 | 自己的经历、感受与选择 | 逐步能够用自己的话表达内心想法和当时发生的事情 | 无；她仍可决定向谁披露到什么程度 |

          | 家长 | 休学、复诊、安全照护与安排所需信息，不知道问题根因 | 最后一次关键咨询中由魏琳主动讲述内心想法和当时发生的事情 |
          不因监护身份自动取得完整梦境、好友身份与无关隐私 |

          | 学校 | 办理休学所需的行政信息 | 完成复学评估后，获得安排复学和保护所需的最低信息 | 完整梦境、好友身份、咨询细节与无关隐私 |

          | 江州第一医院 | 独立评估、复诊与风险处置必需信息 | 在授权和处置必要范围内完成复诊与复学评估 |
          工作室的完整咨询记录、完整梦境与无关隐私 |

          | 工作室运营人员 | 预约、安全与岗位所需的最低信息 | 只通过排班、预约变化和普通反馈承接中间恢复 |
          梦境材料、问题根因、医疗细节与完整咨询记录 |
      - heading: 章纲可调参数
        value: |-
          - 第一章正面展开首次咨询；案例收束时再正面展开最后一次关键咨询。
          - 学校在复学时提供的具体保护措施，由命中章纲按当时场景需要确定。
          - 复学的具体日期、手续和是否需要短期渐进过渡，由命中章纲确定。
          - 上述参数不得改变“能够主动说出内心想法与当时发生的事情 → 复诊与复学评估确认 → 可以复学”的因果顺序。
      - heading: 不得写偏
        value: |-
          - 不把首次梦境辅助写成一次治愈，不用“上车”自动证明她已经放下过去。
          - 不把走到学校附近写成试返校或复学成功。
          - 不让家长、学校、医院或工作室运营人员因身份或合作关系自动打通完整信息。
          - 不把魏琳能够讲述经历写成完全治愈，也不跳过后续复诊与复学评估。
          - 不为这个单元个案新建正式副线节点；只有定稿后产生必须跨章继承的独立后果时，才重新评估是否升格。
