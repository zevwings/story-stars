          - 绑定章纲时可以补足日期、地点、记录字段、对白与动作，但不得改变对应正式节点已经确认的结果与边界。
          - 多节点共享事件只执行一次；下列分节用于保留各线路必须承接的职责，不代表重复发生同一场景。
      - heading: PL-S-067｜顾清言星辰之印排异发作与首次截断止损
        value: |-
          - **正式节点**：[PL-S-067｜顾清言星辰之印排异发作与首次截断止损](../../plotlines/副线/人物/顾清言/星辰之印排异发作与首次截断止损.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 会所首次偶遇 | 让顾清言的控制从行为异常变成晏林亲历的身体与精神危机 | 顾清言失稳，晏林先扶稳并确认有限接触 | 不写成能力级远程感知；晏林是偶然撞见 | `PL-S-043`、`PL-I-030` |
          | 最低止损 | 验证截断只能处理新增作用 | 疼痛停止继续加剧，清醒窗口延长 | 不拆印、不读记忆、不取得完整案情 | 顾清言契约边界 |
          | 守界离场 | 建立下一次验证动机 | 顾清言只承认受控，晏林不追问交换 | 一次帮助不形成信任、证据义务或私人权限 | `PL-S-068` |
      - heading: PL-S-068｜反复止损、姐弟关系与有限交底
        value: |-
          - **正式节点**：[PL-S-068｜反复止损、姐弟关系与有限交底](../../plotlines/副线/人物/顾清言/反复止损姐弟关系与有限交底.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 第一次止损后 | 建立可重复接触的现实掩护 | 晏林以正常消费和熟客身份继续出入会所 | 顾清言的经营安排不构成调查权限 | `PL-I-030` |
          | 第二次主动试用 | 把偶然有效推进为可验证方法 | 顾清言制造短暂独处，晏林再次截断并协助闭海 | 不读记忆，不以帮助换信息或身体 | `PL-S-067` |
          | 中段常态往来 | 建立姐弟式公开熟络、临界试探并交叉楚辞初遇 | 两人以姐弟相称，顾清言以可收回的言语与距离试探，晏林辨认但不索取；裴怀山临时缺席后，楚辞针对临时承接的晏林重新选择并完成当次交易 | 称呼与吸引不建立永久身体权限；顾清言受印期间不与晏林兑现；楚辞的未来身体授权另行判断，入梦只受明确拒绝门禁约束 | `PL-S-066`、`PL-I-032` |
          | 第三至第四次止损 | 验证守界与长期风险 | 累计三至四次有效止损，其他发作仍由顾清言承担 | 不形成长期屏障，不消除每月排异 | 顾清言契约边界 |
          | 较完整请求与浅层交底 | 让有限同盟具备案件方向但不越权 | 顾清言说明强种、退出受控与本人经手的浅层事实，并指出一名成年阶段性当事人的共同分利入口：万安私人项目、章绍衡债务状态与顾清言场所结算在同一时段发生交叉 | 不使用楚辞或既有主要人物兼任；不交完整名单、资金链或预制证据包；入口必须由门禁、排班、项目与资金材料补强 | `PL-S-051`、`PL-S-075` |
          | 邮轮前 | 把有限合作转成公开活动入口 | 顾清言以普通推荐权邀请晏林登船 | 野人不赞助，不产生高权限娱乐区或会议准入；邮轮期间顾清言不发作、不再次止损 | `PL-I-028`、`PL-M-013` |
      - heading: PL-S-008｜顾清言的隔离、解印与责任分层
        value: |-
          - **正式节点**：[PL-S-008｜顾清言的隔离、解印与责任分层](../../plotlines/副线/人物/顾清言/黑暗契约者-非法种印首案的隔离解印与责任分层.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 邮轮靠岸后 | 隔离持续控制条件 | 顾清言脱离会所监视、齐心接触和原有工作环境；管理局分别落实现实限制、保护与治疗授权 | 邮轮期间不发作、不止损、不提前暴露解印行动 | `PL-M-013`、`PL-S-068` |
          | 连接止损 | 争取清醒与授权窗口 | 晏林在授权后截断新增输入并协助闭海 | 晏林不负责核心剥离，精神窗口不替代现实证据 | 晏林契约边界 |
          | 外围处理 | 为核心暴露建立安全条件 | 林芷兰分次处理外围污染、残余入口和通道残留；顾清言以本人身份、经手事实和责任区分维持自我锚点 | 治疗、核心接触、解印、作证与材料调取分别授权 | 林芷兰契约边界 |
          | 核心暴露与剥离 | 完成条件式解印 | 顾清言区分客观事实、本人原有判断与印记固定解释；核心可辨认、可接触且持续授权后一次剥离 | 授权中断、核心重新包裹、承载失稳或结构不可辨认时立即中止 | `PL-M-004` |
          | 剥离后 | 承接损伤、陈述与责任分层 | 后续分次处理人格边界、精神连接与承载损伤，并分别进入陈述评估和司法程序 | 解印不等于痊愈、失忆、恢复职业资格或免责 | `PL-S-011`、`PL-M-004` |
          | 程序关系切开 | 保留未来自由复选条件 | 晏林退出对顾清言保护、证言、监管与责任认定的实质影响位置；双方承认既有吸引仍在，但不在本节点兑现 | 解印不等于可以立即亲密；拒绝关系不产生程序后果 | `PL-I-032` |
      - heading: PL-S-051 / PL-M-004｜云顶责任有限切割与终局交代
        value: |-
          - **正式节点**：[PL-S-051｜多场所黑产经营、共同分利与第一责任切割](../../plotlines/副线/人物/顾清言/会所黑产经营特殊目标入口与退出失控.md)
          - **终局节点**：[PL-M-004｜核心反派责任链清算](../../plotlines/主线/组织/反派/核心反派责任链清算.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 云顶责任分层 | 切开顾清言与于静的实际职责 | 顾清言可以说明云顶人员到店后的接收、训练、排班和服务投放由店级负责人于静执行，本人不掌握每次具体规训内容 | 这只能切开具体店务知情，不能切开顾清言与云顶的关联、整体经营、获利、放任及跨场所责任 | `PL-S-082` |
          | 终局前交代 | 补足顾清言无法继续否认的上层接口 | 顾清言在最终结局前主动交代她与章绍衡存在往来、云顶接收债务对象，并承认自己知道该链条性质且从整体经营中获利 | 不补具体联络方式、日期、账户或可供模仿的经营流程；供述不是责任链唯一证据 | `PL-S-075`、`PL-M-004` |
          | 于静终局 | 结束店级执行链 | 于静收监、云顶实体场地关停 | 不让于静提供她接触不到的顾清言—章绍衡直接证据，也不让她替顾清言吸收上层责任 | `PL-S-082` |
      - heading: PL-I-032｜长期临界暧昧与尾声自由兑现
        value: |-
          - **正式节点**：[PL-I-032｜长期临界暧昧与尾声自由兑现](../../plotlines/亲密线/晏林/顾清言-长期临界暧昧与尾声自由兑现.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
