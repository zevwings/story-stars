          - 阶段五不固定调用三人；尾声至多出现一次合并式回声，后续番外只保留可选接口，不预设已发生。
          - 小鱼儿、悦悦、悠悠互为好闺蜜，友谊独立于晏林及既往交易成立；三人可以共同邀约晏林并发生四人性关系。
          - 每次联系、进入、组合、女性互动、拍摄、保存、暂停与退出分别确认。
          - 非付费只改变交易性质；同一四人组合可以低频复现，但不产生固定排期、永久授权、排他承诺、共同生活或长期伴侣位置。
          - 小鱼儿、悦悦、悠悠均有稳定伴侣且家中不知道云顶经历；该信息只作静态背景，本单元不补伴侣身份，不制造道德审判、背德刺激或家庭冲突。
      - heading: PL-I-038｜付费关系结束后的低频共同私人关系确认
        value: |-
          - **正式节点**：[PL-I-038｜付费关系结束后的低频共同私人关系确认](../../plotlines/亲密线/晏林/俞予安×宁悠悠×王诗悦-付费关系结束后的低频共同私人关系确认.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 付费关系结束 | 明确切断原交易结构 | 小鱼儿、悠悠、悦悦与晏林之间原有的付费关系不再重启 | 只切断晏林侧交易关系，不统一决定三人的其他商业工作 | `PL-I-087、PL-I-088`、`PL-I-034`、`PL-I-036` |
          | 各自回到原生活 | 让云顶人物线真正翻篇 | 三人继续各自的学业、公开工作与私人生活，不建立共同职业网络 | 不补统一经营、统一收入变化或固定分工 | `PL-S-111` |
          | 三人闺蜜关系落位 | 固定聚会的自然来源 | 小鱼儿、悦悦、悠悠互为好闺蜜，能在没有晏林时独立聚会、聊天和维持友谊 | 不把友谊写成旧交易残余、职业搭伙或为晏林服务的组织 | `PL-I-038` |
          | 尾声一次组局 | 留下低频而非长期陪伴的生活回声 | 尾声至多一次三位闺蜜的普通私人聚会；三人可以共同决定邀请晏林，也可由一人发起、另外两人分别确认 | 阶段五不安排该组局，尾声不出现第二次复现 | `PL-I-038` |
          | 晏林自觉买单 | 保留普通组局的现实动作 | 晏林到场后自觉结清当次聚会消费 | 买单只覆盖聚会消费，不产生身体权限，也不把四人的关系重新变成付费服务 | `PL-I-038` |
          | 当次非付费确认 | 切断身体接触与旧交易关系 | 私人性接触开始前明确本次不收费、不交换资源或帮助；小鱼儿、悠悠、悦悦分别确认本人是否参加及参加范围 | `PL-I-041` 已建立小鱼儿、悦悦的非付费入口；本场不反写首次，也不能由任何一人替他人授权 | `PL-I-041`、`PL-S-110、PL-S-183`、`PL-I-038` |
          | 当次四人兑现 | 让共同关系明确成立 | 三位闺蜜可以一起与晏林玩并发生四人性关系；每人仍分别确认自己的进入与范围 | 有人只聚会或中途退出时，不否定其余参与者重新确认后的当次选择 |
          | 低频关系定位 | 固定关系类型而非调用清单 | 三人分别与晏林保留低频、私人、非承诺的炮友型关系；同一四人组合可在可选番外低频复现 | 不要求组合轮换，不设固定日期、次数或陪伴义务 |
          | 当次女性互动 | 保留多人场的独立授权 | 三人共同出现时，女性之间只有在当次分别同意后才可互动 | 好闺蜜不自动等于女女身体权限，也不形成独立女女恋爱 |
          | 各自回位 | 防止关系升级为陪伴结构 | 当次结束后各自恢复原有生活与职业，不产生情绪照料、危机参与、固定排期或下一次见面的义务 | 不进入核心内圈或长期伴侣共同秩序 |
      - heading: 调用规格
        value: |-
          - 本书只按“付费结束—三人闺蜜关系继续—尾声至多一次普通组局—共同邀约—普通账目与身体付款切开—逐人确认—可落四人亲密—各自离开”推进。
          - “不收你钱，去不去”如保留，只能完成当次关系切换；不反写成小鱼儿、悦悦与晏林第一次建立非付费关系，也不为下一次生成权限。
          - 后续番外可以再次调用同一四人组合，也可只调用其中一人或两人；先由届时大纲确认当次动机和频率，本施工单不把可选接口登记成已发生事实。
      - heading: 不得写偏
        value: |-
          - 不把停止商业服务写成三人必须免费补偿晏林。
          - 不统一规定三人停止商业服务，不用共同职业、收入降低或云顶旧人脉重新组织这次见面。
          - 不恢复线上撮合、群组派单、经纪网络或旧场所人脉；三人的联系只来自既有闺蜜关系与私人联络。
