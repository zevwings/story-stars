          | 第三日 | 建立高频关系与楚辞醋意 | 赵梦娜与晏林公开同行并继续逐次确认；楚辞开始辨认自己的欲望 | 不让十余次兑现同质重复 | 亲密专项 |
          | 第四日 | 把楚辞带入平等公开相处 | 赵梦娜向顾清言借楚辞两日，只取得公开同行安排 | 顾清言不能替楚辞授权私人场景 | `PL-S-066` |
          | 第五日 | 完成知情观看、有限加入与范围停止 | 楚辞知道可以离开后自愿留下，逐项确认有限加入；已有会所前史不替代多人场授权 | 不形成女女关系、稳定三人关系或未来权限 | `PL-I-081、PL-I-080` |
