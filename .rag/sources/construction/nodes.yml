    registry_file: story/construction/_status/active.md
    sections:
      - heading: 使用边界
        value: |-
          - 本页不记录生命周期状态；当前状态只从 `story/construction/_status/` 读取。
          - 绑定章纲时可以补足日期、地点、记录字段、对白与动作，但不得改变对应正式节点已经确认的结果与边界。
          - 多节点共享事件只执行一次；下列分节用于保留各线路必须承接的职责，不代表重复发生同一场景。
      - heading: PL-S-067｜顾清言星辰之印排异发作与首次协助稳定精神之海
        value: |-
          - **正式节点**：[PL-S-067｜顾清言星辰之印排异发作与首次协助稳定精神之海](../../plotlines/副线/人物/顾清言/星辰之印排异发作与首次协助稳定精神之海.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 普通经营外出 | 给长期受印状态一个自然暴露窗口 | 顾清言因主持普通活动、接待重要会员、送客或处理日常经营事务，临时离开七层并准备返回 | 她早已被种印很久；本次外出不为见晏林，不由杨柳事件触发 | `PL-S-148、PL-S-150、PL-S-149、PL-S-147`、`PL-S-151、PL-S-152` |
          | 返回途中偶发 | 让长期排异从既有状态变成晏林亲历的身体与精神危机 | 顾清言在一层、地下落客区或专用电梯前室突然失稳；正常到场或离场的晏林恰好经过，先扶稳并从明显异常中感应当前失稳 | 不能直接判断原因或看见印记；不进入七层 | `PL-S-151、PL-S-152`、`PL-I-030` |
          | 无连接缓解 | 先恢复顾清言作出选择的能力 | 晏林主动显露精神之锚的稳定节律，在不建立精神连接的情况下缓解表层紊乱、疼痛与意识断续 | 不进入精神之海、不显示内景、不读取内容；顾清言闭海或明确拒绝时停止 | 顾清言契约边界 |
          | 有限探查 | 验证当前失稳直接纠缠的局部内容 | 顾清言恢复选择能力后，当次允许有限连接并开放受影响区域；晏林只接触已暴露的碎片、错位与外来约束痕迹 | 不扩张到未受影响的记忆和人格；不识别齐心、印记核心、完整控制结构或案件事实 | 顾清言契约边界 |
          | 深层稳定 | 验证内部排异不依赖新增输入也能有限止损 | 顾清言另行授权深层连接；晏林使精神之锚同时触及失稳结构与她仍然存在的原有稳定锚点，使结构停止继续恶化并延长清醒窗口 | 本次不使用截断、逆流、压印或闭海；不拆印、不取得完整案情；有限探查授权不自动包含深层稳定 | 顾清言契约边界 |
          | 守界离场 | 建立下一次验证动机 | 顾清言只承认受控，晏林不追问交换 | 一次帮助不形成信任、证据义务或私人权限 | `PL-S-135` |
      - heading: PL-S-135—PL-S-137｜第二次验证、有限协作回路与姐弟式关系
        value: |-
          - **正式节点**：[PL-S-135｜第二次止损验证方法有效](../../plotlines/副线/人物/顾清言/第二次止损验证方法有效.md)、[PL-S-136｜三至四次止损建立有限协作回路](../../plotlines/副线/人物/顾清言/三至四次止损建立有限协作回路.md)、[PL-S-137｜姐弟式关系成立](../../plotlines/副线/人物/顾清言/姐弟式关系成立.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 第一次止损后 | 建立可重复接触的现实掩护 | 晏林以正常消费和熟客身份继续出入会所 | 顾清言的经营安排不构成调查权限 | `PL-I-030` |
          | 第二次主动试用 | 把偶然有效推进为可验证方法 | 顾清言制造短暂独处；晏林可以先无连接缓解，顾清言再分别决定是否开放有限探查或授权深层稳定；若齐心同时追加作用，才另行截断新增输入并按需协助闭海 | 上一次权限不延续；不读未开放记忆，不以帮助换信息或身体；内部排异不写成必有新增输入 | `PL-S-067` |
          | 撤回验证 | 让守界产生真实代价 | 顾清言至少一次缩小或撤回授权，使晏林失去继续探查的线索窗口；晏林立即停止且事后不追问 | 不用“为她好”继续深入，不把失去线索转化为责备或交换 | 顾清言契约边界 |
          | 中段常态往来 | 建立姐弟式公开熟络 | 两人以姐弟相称，顾清言以可收回的言语与距离试探，晏林辨认但不借止损索取 | 称呼与吸引不自动建立身体权限；身体关系由 `PL-I-046/047` 独立承接 | `PL-S-121`、`PL-I-046`、`PL-I-047` |
          | 第三至第四次止损 | 验证守界与长期风险 | 累计三至四次精神之锚止损；每次分别确认缓解、探查与深层稳定边界，至少一次在明确出现新增作用时才配合截断，其他发作仍由顾清言承担 | 不形成长期屏障，不消除每月排异，不继承既往权限，不用截断或逆流替代精神之锚稳定 | 顾清言契约边界 |
      - heading: PL-S-123｜浅层交底与单一异常核验入口
        value: |-
          - **正式节点**：[PL-S-123｜浅层交底与单一异常核验入口](../../plotlines/副线/人物/顾清言/浅层交底与单一异常核验入口.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 较完整请求 | 先重申能力边界 | 顾清言提出希望更长时间减轻或屏蔽印记作用；晏林说明无连接缓解、有限探查、深层稳定与截断各自能做什么，均不能形成长期屏障或拆印 | 不因关系稳定夸大能力，不把拒绝整体屏蔽理解成撤回帮助 | `PL-S-136`、`PL-S-137` |
          | 浅层交底 | 让有限同盟取得最低案件协作面 | 顾清言说明强种、退出受控与本人经手的浅层事实，并指出一条本人记忆中的共同分利事件 | 不交完整名单、资金链或预制证据包；不把受控写成免责 | `PL-S-130`、`PL-S-132`、`PL-S-133`、`PL-S-134`、`PL-S-090` |
          | 独立补强 | 把私人陈述转为现实核验方向 | 管理局经办链从门禁、排班、项目、车辆、通讯、资金或其他现实记录中完成至少两类材料交叉 | 晏林不取证、不背书；任何单项都不能直接证明完整责任链 | `PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
      - heading: PL-S-125｜秘密断链、带印脱控与伪装受控
        value: |-
          - **正式节点**：[PL-S-125｜秘密断链、带印脱控与伪装受控](../../plotlines/副线/人物/顾清言/完整行动信任断链脱控与带印取证潜伏.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 稳定旧体系 | 排除突然异常触发 | 顾清言二十七至二十八岁受印，到三十三岁时旧控制与观察体系稳定运行五至六年；她掌握观察者日常规律，断链前没有异常或人员更换 | 不用临时换人、行程暴露或系统异常逼出加固 | `PL-S-136`、`PL-S-137`、`PL-S-123` |
          | 有限断链授权 | 建立一次高风险协作资格 | 浅层交底后，顾清言只向晏林开放既有主动控制链的近距离处理权限 | 不等于完全精神开放、永久连接、身体权限或免责承诺 | `PL-S-123`、`PL-I-047` |
          | 近距离秘密断链 | 完成脱控且不触动印核 | 晏林在近距离接触中秘密截断既有主动控制链，现场不产生普通观察者可识别的异常 | 不等待齐心主动加固；不拆印核，不公开断链与逆流 | 晏林契约边界、星辰之印边界 |
          | 未察觉与重控风险 | 固定潜伏风险 | 齐心没有察觉断链；旧印核不能远程控制或重连，只有再次近距离接触并重新施加才能重控 | 顾清言继续伪装受控并避免被安排近距离接触 | `PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
          | 带核取证潜伏 | 获得最终现实实证 | 顾清言继续伪装受控、利用熟悉的旧观察体系追踪线索；管理局及司法经办人员收集和交叉核验现实证据 | 晏林不负责调查取证；不在潜伏期暴露、接触或剥离印核 | `PL-M-036、PL-M-038、PL-M-039、PL-M-037`、`PL-S-138` |
      - heading: PL-S-138—PL-S-144｜隔离、解印、责任、监管与永久后果
        value: |-
          - **正式节点**：[PL-S-138｜程序隔离与独立判断条件成立](../../plotlines/副线/人物/顾清言/程序隔离与独立判断条件成立.md)、[PL-S-139｜顾清言有效授权印核剥离](../../plotlines/副线/人物/顾清言/顾清言有效授权印核剥离.md)、[PL-S-140｜非法印记核心完成剥离](../../plotlines/副线/人物/顾清言/非法印记核心完成剥离.md)、[PL-S-141｜长期修复仍未恢复原状态](../../plotlines/副线/人物/顾清言/长期修复仍未恢复原状态.md)、[PL-S-142｜主动犯罪与受控行为完成责任分层](../../plotlines/副线/人物/顾清言/主动犯罪与受控行为完成责任分层.md)、[PL-S-143｜顾清言依法进入疗养监管服刑](../../plotlines/副线/人物/顾清言/顾清言依法进入疗养监管服刑.md)、[PL-S-144｜服刑期间精神结构崩溃并永久失能](../../plotlines/副线/人物/顾清言/服刑期间精神结构崩溃并永久失能.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 阶段五带核取证 | 维持齐心仍然控制有效的外观，同时取得终局实证 | 顾清言的外部控制链已经永久断开，她完全脱控但保留固化印核并伪装仍受控；管理局及司法经办人员从独立现实记录闭合责任链 | 阶段五不暴露、不接触、不剥离印核；晏林不承担调查取证 | `PL-S-125`、`PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
          | 终局硬门槛 | 关闭提前拆核造成的现实反制风险 | 齐心失去联系观察者、灭口和组织现实反制的能力；会所观察与传令链被切断 | 任一门槛未成立，顾清言继续带核潜伏，不进入核心暴露 | `PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
          | 终局隔离与授权 | 建立安全的印核剥离环境 | 顾清言脱离会所监视和原有工作环境；管理局分别落实现实限制、保护、治疗授权、独立风险评估、现场见证与停止监督 | 外部链已断，不重复执行断链；治疗、核心接触、解印、作证与材料调取分别授权 | 晏林契约边界 |
          | 残余结构处理 | 为核心暴露建立安全条件 | 安若曦只以本案一次性授权作为临时处置协作者，先以自身精神之锚维持处置稳定，再以净化、修复权柄分次处理残余控制入口、通道残留、外来解释结构、信息关联阻断与既成损伤 | 单案资格不来自私人关系，也不延伸为永久解印资格；条件不足时由现场监督停止 | 安若曦精神之锚、净化与修复边界 |
          | 核心暴露与剥离 | 完成条件式解印 | 顾清言区分客观事实、本人原有判断与印记固定解释；核心可辨认、可接触且持续授权后，由安若曦以净化权柄完成一次核心剥离 | 授权中断、核心重新包裹、承载失稳或结构不可辨认时立即中止 | `PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
          | 剥离后 | 承接长期失衡、陈述与责任分层 | 安若曦以修复权柄分次处理人格边界、精神连接与承载损伤；顾清言分别进入陈述评估和司法程序，长期失衡继续治疗，并在服刑期间最终发生精神之海结构性崩溃、永久失去回响权柄的调用能力 | 断链已恢复有效选择；剥离不等于痊愈、失忆、恢复职业资格或免责；永久失能不表示核心剥离失败，也不直接导致死亡 | `PL-S-011`、`PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
          | 关系确认 | 让强关联成立而不改写责任 | 双方在顾清言能够理解和选择的状态下承认此前的吸引、身体关系、信任与彼此的重要性真实存在 | 正式程序启动后不再续接身体关系；不确认恋爱、长期身体权限或等待承诺；拒绝关系不产生程序后果 | `PL-I-048`、`PL-I-049` |
          | 疗养监管与探视 | 完成责任与关系的共同收束 | 顾清言接受正式刑事判决并进入集团疗养院依法监管区；晏林可以经审批受控探视。私域留在晏林手中，是顾清言知道终局后的最后慰藉 | 不是普通牢房、私人住所或自由疗养；不用探视恢复身体关系、共同生活、长期伴侣或私域权限 | `PL-S-011`、`PL-S-143`、`PL-I-049`、`PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
      - heading: PL-S-129—PL-S-134 /
          PL-M-036、PL-M-038、PL-M-039、PL-M-037｜经营前史、云顶责任有限切割与终局交代
        value: |-
          - **正式节点**：[PL-S-129｜多场所人员来源结构显影](../../plotlines/副线/人物/顾清言/多场所人员来源结构显影.md)、[PL-S-130｜云顶与私域经营及共同分利成立](../../plotlines/副线/人物/顾清言/云顶与私域经营及共同分利成立.md)、[PL-S-131｜异常响应与经营记录形成](../../plotlines/副线/人物/顾清言/异常响应与经营记录形成.md)、[PL-S-132｜第一责任切割显影与自保留证](../../plotlines/副线/人物/顾清言/第一责任切割显影与自保留证.md)、[PL-S-133｜顾清言尝试退出但失败](../../plotlines/副线/人物/顾清言/顾清言尝试退出但失败.md)、[PL-S-134｜顾清言遭强行种印并失去正常退出能力](../../plotlines/副线/人物/顾清言/顾清言遭强行种印并失去正常退出能力.md)
          - **终局节点**：[PL-M-036｜证据窗口与保全](../../plotlines/主线/组织/反派/证据窗口与保全.md)、[PL-M-037｜各反派主体责任分别闭合](../../plotlines/主线/组织/反派/各反派主体责任分别闭合.md)、[PL-M-038｜个人裁判结果](../../plotlines/主线/组织/反派/个人裁判结果.md)、[PL-M-039｜合法产业接管与剩余受害后果承接](../../plotlines/主线/组织/反派/合法产业接管与剩余受害后果承接.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 云顶责任分层 | 切开顾清言与于静的实际职责 | 顾清言可以说明云顶人员到店后的接收、训练、排班和服务投放由店级负责人于静执行，本人不掌握每次具体规训内容 | 这只能切开具体店务知情，不能切开顾清言与云顶的关联、整体经营、获利、放任及跨场所责任 | `PL-S-111` |
          | 最终交代 | 补足顾清言无法继续否认的上层接口 | 顾清言在齐心尚未失去全部现实反制能力前主动交代她与章绍衡存在往来、云顶接收债务对象，并承认自己知道该链条性质且从整体经营中获利 | 不补具体联络方式、日期、账户或可供模仿的经营流程；供述不是责任链唯一证据 | `PL-S-089`、`PL-S-090`、`PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
          | 资金来源污点 | 保留顾清言主动经营者与不完整悔罪的灰度 | 顾清言没有完整交出本人黑产收益，仍保留一笔已经具备表面正常使用条件、但来源不干净的资金；该笔钱不承载上游定罪所需的不可替代证据 | 不把藏款写成合法私产或无害后路；不提前编排具体账号、金额、流转方式或托付手续；不展开资金清洗、转移、隐匿和规避追查过程；不能让藏款破坏其他证据已经闭合的责任链 | `PL-S-132`、`PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
          | 于静终局 | 结束店级执行链 | 于静收监、云顶实体场地关停 | 不让于静提供她接触不到的顾清言—章绍衡直接证据，也不让她替顾清言吸收上层责任 | `PL-S-111` |
      - heading: PL-I-046—PL-I-049｜阶段性身体关系、程序止步与关系告别
        value: |-
          - **正式节点**：[PL-I-046｜顾清言独立清醒窗口中的第一次身体关系](../../plotlines/亲密线/晏林/顾清言-独立清醒窗口中的第一次身体关系.md)、[PL-I-047｜顾清言阶段性重复身体回路建立](../../plotlines/亲密线/晏林/顾清言-阶段性重复身体回路建立.md)、[PL-I-048｜正式程序启动后停止身体回路](../../plotlines/亲密线/晏林/顾清言-正式程序启动后停止身体回路.md)、[PL-I-049｜顾清言收监前完成明确关系告别](../../plotlines/亲密线/晏林/顾清言-收监前完成明确关系告别.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 阶段四受印期间 | 让姐弟关系与阶段性身体回路分别成立 | 姐弟称呼出现私下双关；完成三至四次守界止损后，在独立清醒窗口建立首次与重复身体关系，分别调用酒店类空间与私域七层 | 不情色化排异、止损与即时恢复；身体关系不与交底、保护或利益交换合并；每次逐次确认，不建立恋爱或长期权限 | `PL-S-136`、`PL-S-137`、`PL-I-046`、`PL-I-047` |
          | 阶段五正式程序启动后 | 证明秘密协作不等于继续兑现 | 顾清言已经在阶段四断链脱控；正式程序启动后停止继续建立身体关系 | 不重启身体关系，不把断链资格扩大成身体、精神或司法权限 | `PL-S-125`、`PL-S-138` |
          | 私域托付 | 让顾清言留下现实余痕而不保留关系席位 | 顾清言以一笔来源不干净的黑产收益托付晏林盘下私域；她知道自己的终局，私域留在晏林手中成为最后慰藉 | 晏林知道资金不可能完全干净但不参与此前清洗；不替她保留房间、七层权限、收益、经营权或自动进入资格 | `PL-S-132`、`PL-M-036、PL-M-038、PL-M-039、PL-M-037`、`clues/planted/顾清言私域托付与资金来源污点.md` |
          | 疗养监管与有限探视 | 让关系以承担和有限余温完成 | 顾清言承担正式刑事判决，在集团疗养院依法监管区服刑；晏林可以经审批和现场监管探视 | 不新增身体，不用探视、释放后复选或重逢继续兑现；不建立共同生活或长期伴侣 | `PL-S-011`、`PL-S-143`、`PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
          | 私域后续 | 保存场所而不保存顾清言的关系位置 | 晏林盘下私域，终止旧黑产经营、旧人员控制、旧权限与旧结算接口，以新的长期私人会员制会所继续运营 | 只洗白后续经营秩序，不洗白钱的来源；经营干净不等于取得资金干净；顾清言不回归、不参与管理，也不以旧负责人身份保留任何专属位置 | `PL-I-049` |
