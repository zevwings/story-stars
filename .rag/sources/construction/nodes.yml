      - heading: 不得写偏
        value: |-
          - 不把两条个人清零结果写成所有伤害、影像与规训后果一并消失。
          - 不让于静替顾清言完成上层认罪，也不让她成为替所有人吸责的唯一终点。
          - 不让阿九在关停安排形成前就完成正式债务和控制解除，也不把她留到实体实际关停后才脱离。
          - 不把阿九的告别亲密或其后任何未定生活写成案件安置、债务解除回报或晏林包办。
