    summary: 本场把原定的“小鱼儿深色御姐、悠悠浅色甜欲”收束为一组成年学院风双子造型。两人使用相同的白色短衬衣、深色蝴蝶结和黑色鞋履，先建立一眼可见的组合关系，再以深浅异色百褶短裙、妆发和本人气质完成区分。
    headings:
