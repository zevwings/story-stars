    sections:
      - heading: 使用边界
        value: |-
          - 本页不记录生命周期状态；当前状态只从 `story/construction/_status/` 读取。
          - 绑定章纲时可以补足日期、地点、记录字段、对白与动作，但不得改变对应正式节点已经确认的结果与边界。
          - 多节点共享事件只执行一次；下列分节用于保留各线路必须承接的职责，不代表重复发生同一场景。
      - heading: PL-M-017、PL-M-018｜招聘接口控制方法显影
        value: |-
          - **正式节点**：[PL-M-017｜郑文悦固定归因异常显影](../../plotlines/主线/组织/反派/郑文悦固定归因异常显影.md)、[PL-M-018｜八个招聘／用工接口交叉验证](../../plotlines/主线/组织/反派/八个招聘／用工接口交叉验证.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 慈善晚会公开入口 | 建立可信身份与后续一对一入口 | 齐心凭慈善身份在邀请制晚会中与郑文悦公开认识；公开部分只完成身份背书和初步接触 | 不在公开活动中批量筛选或施术，不把慈善活动本身写成犯罪组织 | `PL-S-145、PL-S-146` |
          | 晚会私域延伸 | 把公开认识转入可持续的一对一关系 | 齐心利用晚会内场、会后答谢区或后续私人邀约，把郑文悦带入私域接触；再针对她真实存在的经营或职业困境提供一次真实、合规且有效的帮助 | 具体困境、帮助内容、接触次数和对白由命中章纲确定；不写成见面即强种，不把正常帮助倒写为从一开始就虚假 | 管理局协查线 |
          | 越权扩张 | 形成第一次深层塑心／孤悬控制连接 | 齐心越权利用既有信任，以塑心实施篡心并固定核心解释，再以孤悬隔离能够推翻该解释的具体反证 | 深层连接不倒推此前帮助虚假，也不抹除目标当时仍有的自主行为 | `PL-M-003` |
          | 招聘端调查 | 使郑文悦成为首名完整显影者并使骆志莲提前进入控制 | 三个彼此不相识的家庭分别因成年亲属异常失联报案：至少两人完全断联，一人只保留异常联系或由用工方声称“特殊工作、不便使用通讯设备”；三人均经郑文悦招聘，警方据此找到她；后续现实记录同时定位骆志莲并使其依据本人案件进入程序控制 | 不设置赎金要求或家属专业调查团；郑文悦承担完整异常显影，骆志莲不重复独立问询章；二人提前进入控制不等于八接口同源结构已经确认 | `PL-S-049`、`PL-S-290` |
          | 华靖材料回流与行动前关联 | 同时启动国内控制准备与跨境协查 | 三名幸存者把华靖材料送入官方程序；材料与国内既有招聘、转送和出境记录接通，补强主园区方向、定位其余六名招聘接口并提高行动紧迫性 | 华靖材料不单独证明齐心控制、八接口同源结构或朱岑郁完整责任；此时只形成行动准备和跨境协查入口 | `PL-S-291`、`PL-M-036` |
          | 同一行动窗口 | 先切断齐陆反制并纳管剩余六接口 | 郑文悦、骆志莲保持此前控制状态；齐心、陆佳凝与尚未被控制的六名招聘接口在同一行动窗口分别被控制、切断或保护性隔离 | 齐陆是主要责任对象；六人的措施依据本人事实与风险分别决定，不把同步纳管写成八人同责或全部刑事抓捕 | `PL-M-048` |
          | 控制后八人材料交叉 | 排除单人口供、普通共谋与同责解释 | 人员分别隔离、现实材料保全后，官方交叉八人的接触、招聘、联络、业务、人员结果与异常评估材料，确认八人存在受齐心同源控制的异常 | 八人功能相同但责任分别审查；不逐人展开完整问询，不由华靖材料、幸存者或单一口供替代统一交叉 | `PL-M-018`、`PL-M-037` |
          | 管理局复核 | 在现实调查门槛后确认同源精神异常 | 普通调查已排除串供、规避责任与共同利益后，管理局才按权限介入精神异常复核 | 章节大纲可决定现场动作；权限分工服从管理局与公安正式边界，不得让晏林凭一次接触读出八人受控或齐心身份 | `PL-S-006`、`PL-S-007` |
          | 跨案重识别 | 固定共同方法痕迹 | 多个独立对象能够准确复述事实，却持续以近似结构维持同一选择；旧理由被现实推翻后会迅速生成新解释，具体反证又难以进入当前判断 | 单次偏差不足以指向齐心；只确认“塑心＋孤悬·闭环自证”的共同方法，不确认统一组织或完整幕后名单 | `PL-S-148、PL-S-150、PL-S-149、PL-S-147`、`PL-M-003` |
      - heading: PL-M-020、PL-M-021、PL-M-022、PL-M-024｜陆佳凝合法出境组织与境外交接显影
        value: |-
          - **正式节点**：[PL-M-020｜合法出境包装](../../plotlines/主线/组织/反派/合法出境包装.md)、[PL-M-021｜第一次境外交接](../../plotlines/主线/组织/反派/第一次境外交接.md)、[PL-M-022｜实验对象与结果流转](../../plotlines/主线/组织/反派/实验对象与结果流转.md)、[PL-M-024｜朱岑郁器官交易轴显影](../../plotlines/主线/组织/反派/其他独立黑色轴显影.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 邮轮前 | 固定招聘、筛选与交接入口 | 郑文悦历史材料指向刘秉文；刘秉文向八接口提供真假岗位口径、汇总人员并以随机为底、年龄外貌与可控性加权筛选 | 八接口不知道岗位真假、筛选规则和园区去向；只能确认调查方向 | `PL-M-017`、`PL-S-049`、`PL-S-290` |
          | 邮轮后 | 交叉合法出境与公开行程中断 | 陆佳凝控制真实合同、行程、接收与结算，刘秉文完成主要筛选和首次交付；人员正常进入金洲后，由兔子快递金洲特殊专送人员改变实际去向并送往园区 | 陆佳凝通常不到交接现场；合法手续不等于同意入境后被改换去向；不把人员藏入国际快件越境 | `PL-M-020`、`PL-M-021`、`PL-M-034` |
          | 齐陆及六接口纳管、八接口验证后 | 完成境外园区与朱岑郁独立责任轴的结果闭合 | 华靖材料和三名幸存者早已启动跨境协查；待国内行动与八接口控制后验证完成，再由园区现场、兔子快递命令链和当地独立材料达到三个园区正式接手及朱岑郁责任门槛 | 齐陆及八接口材料没有牵出朱岑郁；不枚举材料字段、保管分工或行动细节；器官贩卖链与裴家人体实验链分别归责 | `PL-S-291`、`PL-M-048`、`PL-M-018`、`PL-M-037`、`PL-M-024`、`PL-M-049` |
      - heading: PL-M-030、PL-M-031、PL-M-032｜异常干预者观察、试探与首次有效反制
        value: |-
          - **正式节点**：[PL-M-030｜反派识别持续干预模式](../../plotlines/主线/组织/反派/反派识别持续干预模式.md)、[PL-M-031｜主动试探泄露位置](../../plotlines/主线/组织/反派/主动试探泄露位置.md)、[PL-M-032｜第一次有效反制造成持续现实损失](../../plotlines/主线/组织/反派/第一次有效反制造成持续现实损失.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 安若曦订单后 | 形成反派侧第一份错误观察 | 现场执行者确认感知中的命中位置与现实结果不一致，将异常暂按清醒侧感知欺骗或位置替换理解 | 单次结果不能识别断流、双子星结构或四项权柄 | `PL-M-001` |
          | 多案痕迹聚合 | 把单次误判升级为可供试探的错误模型 | 反派把订单失败、目标脱离与接口受阻归入同一类稳定干预 | 错误模型只改变反派行动，不取得管理局机密档案或授权结论 | `PL-S-194、PL-S-195`、`PL-M-028、PL-M-029、PL-M-025、PL-M-026、PL-M-027` |
          | 主动试探 | 定位异常干预与信息泄露范围 | 反派更换中间人、调整订单字段或使用相似目标测试信息来源 | 一次试探不能识破双子星，也不能让反派取得管理局档案 | `PL-S-161、PL-S-162` |
          | 切割与现实反制 | 让具体匿名联系切割留下后果 | 裴家控制的联系人、中间人和关联市场身份被局部切断并发生剪裁甩锅；调查只能确认白玥本人行为与一段匿名控制联系，不能据此直接指向裴家 | 不虚构统一后台、全局账户或可直接追溯的暗色星辰身份；华靖潜伏由既有招聘失联和刘秉文材料触发 | `PL-S-159`、`PL-S-161`、`PL-S-162`、`PL-S-290` |
      - heading: PL-M-036、PL-M-048、PL-M-018、PL-M-050、PL-M-037、PL-M-049、PL-M-038｜分时控制与责任链清算
        value: |-
          - **正式节点**：[PL-M-036｜齐心—陆佳凝先行控制窗口与保全](../../plotlines/主线/组织/反派/证据窗口与保全.md)、[PL-M-048｜齐心、陆佳凝及现实执行接口先行被控制](../../plotlines/主线/组织/反派/齐心陆佳凝及现实执行接口先行被控制.md)、[PL-M-018｜八个招聘／用工接口交叉验证](../../plotlines/主线/组织/反派/八个招聘／用工接口交叉验证.md)、[PL-M-050｜晏林诱饵式探查锁定裴家实验中心](../../plotlines/主线/人物/晏林/晏林诱饵式探查锁定裴家实验中心.md)、[PL-M-037｜跨境电诈证据闭合与官方接手](../../plotlines/主线/组织/反派/各反派主体责任分别闭合.md)、[PL-M-049｜裴家与朱岑郁责任轴分别闭合](../../plotlines/主线/组织/反派/裴家与朱岑郁责任轴分别闭合.md)、[PL-M-038｜个人裁判结果](../../plotlines/主线/组织/反派/个人裁判结果.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 阶段四秘密断链 | 固定带核潜伏前置 | 浅层交底后，顾清言授权晏林在近距离接触中秘密断流既有主动控制链；齐心未察觉，旧印核不能远程重连，顾清言恢复自主并继续伪装受控 | 不等待齐心主动加固；防止齐心重新安排近距离接触并再次施加；晏林不负责现实取证 | `PL-S-123`、`PL-S-125`、`PL-S-138`、`PL-M-036、PL-M-037、PL-M-038` |
          | 齐陆行动前 | 预保全齐心—陆佳凝现实证据 | 华靖材料已进入程序并启动双线准备；国内经办链另行保全门禁、车辆、物业、资金、行程、招聘、真实出境项目、关联企业及已定位现实设备中的必要记录 | 不等待顾清言完整解印；不把华靖材料、三名幸存者陈述、兔子快递或裴家实验材料单独当作齐陆的行动门槛 | `PL-S-291`、`PL-M-020`、`PL-M-021`、`PL-M-036`、`PL-S-138` |
          | 三月同盟后带核陈述 | 固定第一次有效陈述 | 顾清言已经秘密断开齐心的主动控制，仍保留可被用于生命要挟的印核并继续伪装受控；在秘密保护、理解风险和持续授权条件下，她说明章绍衡、刘秉文、私域与风归的最终收益和控制均归齐心，并提供招聘端基本结构 | 陈述不替代园区现实材料；齐心被控制后才解印，解印后只作补充复核 | `PL-S-138`、`PL-M-017`、`PL-M-018`、`PL-M-036` |
          | 记录复核后 | 完成齐陆责任复核 | 以已经完成保全的现实材料核对顾清言和郑文悦的有限陈述，再由二人分别解释本人可见记录间的关系 | 只闭合齐心—陆佳凝及直接现实接口；不以二人的合作关系、通讯录、供述或共同收益牵出裴家、朱岑郁 | `PL-M-036` |
          | 第一行动窗口 | 齐心、陆佳凝与剩余六招聘接口同步失去继续反制条件 | 管理局与警方分责控制齐心、陆佳凝及其观察、传令、转移和现实反制接口；郑文悦、骆志莲保持此前控制状态，剩余六名招聘接口在同一窗口分别进入程序控制或保护性隔离；顾清言随即转入程序隔离 | 六名接口与齐陆的措施性质、知情和责任分别判断；当时搜查、陈述和材料没有牵出或同步控制裴家、朱岑郁；晏林与受保护当事人不取得执法指挥权 | `PL-M-048`、`PL-S-138`、`PL-S-288` |
          | 八接口统一验证完成后 | 以结果节点分别闭合两条独立责任轴 | 裴家轴由白玥局部材料、万安内供与外部客户材料、实验幸存者、现实记录及限定记忆交叉；朱岑郁轴承接早已启动的跨境协查，再由华靖材料、园区幸存者、兔子快递命令链、园区现场和当地材料完成闭合 | 齐陆及八接口材料只能提供人员来源、前端控制与出境组织方向；不以一个总账、统一后台或共同收网抹平证据来源 | `PL-M-018`、`PL-S-186`、`PL-M-037`、`PL-M-024`、`PL-M-049` |
          | 各自行动与保护 | 在各轴达到门槛时终止持续侵害 | 万安涉案接口、裴家实验药剂节点、三个园区及朱岑郁现实执行链按各自证据和风险分别进入控制；晏林在正式风险评估、持续同意和中止机制下承担一次受控诱饵行动，既有受保护当事人继续按各自保护方案行动 | 行动按风险与证据成熟度分时推进；医疗保护、陈述和公开分别承接 | `PL-S-286`、`PL-M-050`、`PL-M-037`、`PL-M-049` |
          | 责任闭合后 | 完成分层裁判与长期后果 | 齐心、陆佳凝、裴崇礼、裴怀民、裴怀安、裴兰馨、刘秉文与朱岑郁八名核心裁判对象具名取得结果；黄锦一实际知情并参加协商，却因朱岑郁收束兔子快递秘密链的实控、命令与可证明责任，以不知情抗辩脱身；丁宇、周博获得保护并承担刑事责任；穆珂宜按受害者与有限证人进入长期恢复 | 不让受控前史、逃离、材料贡献或华靖牺牲自动免责；兔子快递经最低整改后由黄锦一继续经营，兰纳安吉旅游集团重组，不展开公司处置过程；朱岑郁不替齐、陆或裴家吸收责任 | `PL-M-038`、`PL-S-233`—`PL-S-235`、各线独立结果节点 |
          本节只把园区接收、人员分层和处置升级的既成结果作为朱岑郁独立责任轴的前置，不直接施工 `PL-S-241、PL-S-242、PL-S-228、PL-S-229、PL-S-230`；前四项由 `CON-0044` 承接，`PL-S-230` 由 `CON-0041` 承接。
