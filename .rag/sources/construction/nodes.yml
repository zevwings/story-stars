    sections:
      - heading: 场次作用
        value: |-
          本场不再承担双人 COS ③，也不设置具体角色、作品或身份扮演。它把“回归”落实为小鱼儿与悦悦再次共同到场时主动选择更直接的双人情趣造型：这不是用同款衣装代替关系确认，而是两人在已经能够分别选择、分别退出的前提下，再次主动选择共同到场和共同揭示。外出时，两人都由过膝黑色薄风衣完整遮覆；进入确认私密的室内空间后，风衣脱下并单独挂起，里面只保留黑色蕾丝胸衣裙、吊袜带、黑色长袜和鞋履。
          外层与内层的反差是本场唯一揭示结构。外出时两人首先是两道收束、完整的黑色长轮廓；室内才同时显出半杯胸衣、半透束腰、极短荷叶裙摆与吊带丝袜。风衣不敞开披在情趣装外，也不作为持续挑逗的第三层。
      - heading: 场次接口
        value: |-
          - 本单元只承接云顶第 13 次亲密消费场；参与者为晏林、小鱼儿与悦悦。阿九连续三晚已经在此前三场完整结束，本场只负责松散付费关系的普通回归，不回收或代证阿九的求助后果。
          - 这是小鱼儿与悦悦再次共同回归的付费亲密场，两位女性都实际参与；共同揭示不是其中一人只负责配合造型或旁观另一人。
          - 本场继续调用 `PL-I-034` 的有限共同付费回路；不承担悦悦的职业压力显影，两人分别确认费用、离场、身体范围、停止点、情趣语言与影像边界。
          - 双人情趣衣装不自动建立主从关系，也不自动推出小鱼儿与悦悦之间发生直接身体互动；具体范围仍须逐人、逐次成立。
      - heading: 商 K 消费承接（简写）
        value: |-
          - 两人脱下风衣并完成一次共同揭示后，本场仍须有真实开包、至少一轮酒水或无酒精饮品、点歌／交谈与包厢停留；正文用落座、续杯、切歌或结账中的一至两个动作即可。
          - 情趣装展示与包厢内有限亲密可以嵌入消费段；是否结束包厢、两人是否分别离场及后续场外亲密继续分别决定，不把风衣脱下直接写成带走。
          - 开台、酒水账单、稳定付款、人员反馈和正常离场继续进入云顶经营记录，成为于静后续递名前判断熟客的累计依据；本场单独不产生会员入口。
      - heading: 视觉参考
        value: |-
          参考图片：
          - `/Users/zevwings/Library/Mobile Documents/com~apple~CloudDocs/inimate/参考/服装/IMG_7554.JPG`
          - `/Users/zevwings/Library/Mobile Documents/com~apple~CloudDocs/inimate/参考/服装/IMG_7555.JPG`
          - `/Users/zevwings/Library/Mobile Documents/com~apple~CloudDocs/inimate/参考/服装/IMG_7556.JPG`
          采用范围：
          - 黑色半杯胸衣与杯口窄蕾丝边形成的上身结构。
          - 腹腰使用半透花纹蕾丝、纵向软骨和深色包边收出腰线。
          - 臀线外覆盖极短单层／双层荷叶蕾丝裙摆，侧腰保留小体量缎带结。
          - 四根可调吊袜带连接黑色蕾丝边长袜。
          - 哑光胸杯、半透蕾丝、缎带与薄丝袜共同形成的全黑材质层次。
          不采用范围：
          - 第三张图片中的猫耳、黑色项圈、蕾丝长手套和鞭子。
          - 角色语言、支配道具、宠物身份、兽系身份或任何具体 COS 设定。
          - 参考人物的面容、身体比例、纹身、姿势表演、拍摄地点、水印与账号信息。
          - 图片未展示清楚的后背闭合、内层下装与鞋履原款；这些只按现实穿着重新施工。
      - heading: 外出层：过膝黑色薄风衣
        value: |-
          - 两人使用同类黑色过膝薄风衣，长度至少遮住吊袜带连接点与长袜上缘；衣摆停在膝下至小腿中段，不能短到走动时直接露出室内情趣层。
          - 面料选择轻薄、低光泽但不透肤的风衣布或高密度混纺。所谓“薄”只指重量与垂坠，不写成能够从公共区域直接看见内层蕾丝的透明罩衣。
          - 风衣为单排扣或隐藏按扣结构，腰部配同色软腰带。公共区域保持前襟扣合并系好腰带，不依赖双手一直拢住衣襟。
          - 内侧增加一枚胸下暗扣和一枚大腿上方暗扣，防止步行、转身或坐车时前襟意外散开；暗扣不与内层胸衣和吊袜带连接。
          - 袖长至腕部，肩线不做夸张硬垫。风衣轮廓能够容纳内层胸杯与荷叶裙摆，不用过小尺码把蕾丝压皱或让吊袜带在外面形成清楚凸痕。
          - 侧袋至少能放手机、房卡和小型个人物品；两人各自保管自己的物品与衣装，不共用一件无法独立离场的外层。
          两件风衣保持相近长度与黑色明度，形成双人到场关系；尺码、肩线与腰带位置分别服从小鱼儿和悦悦本人，不要求绝对复制。
      - heading: 半杯胸衣
        value: |-
          - 使用黑色半杯或低位三分之四杯胸衣，杯面为低光泽哑黑缎或细密不透弹力布，杯口只加一圈窄花边蕾丝。
          - 胸杯下方保留稳定钢圈或柔性支撑、侧比与可调肩带，不能只靠图片滤镜和错误尺码维持胸型。
          - 两侧肩带为黑色窄带，外缘可有极细蕾丝，不增加锁扣、链条、肩饰和角色徽记。
          - 胸口中央只保留一枚小型黑色缎带结；不叠宝石吊坠、项圈链和金属环。
      - heading: 半透蕾丝束腰
        value: |-
          - 胸衣下缘与腰腹半透蕾丝连成完整胸衣裙，蕾丝底层为柔软黑网，花纹集中在腹部和腰侧，不覆盖成完全不透的黑布。
          - 前后使用四至六根柔性纵向软骨维持长线条，软骨只塑形，不追求压缩呼吸、限制弯腰或制造真正硬质紧身胸衣的束缚。
          - 腰线通过深色包边、蕾丝明暗和真实合体剪裁收紧；不加硬腰封、金属锁、长排扣和需要他人才能解除的背后重型系带。
          - 闭合优先采用一侧短拉链配顶部暗扣，或背部短排扣配可自行够到的侧开口。两人都应能够自行穿回、调整或解除，不让情趣装成为无法退出的控制装置。
      - heading: 荷叶短裙与内层
        value: |-
          - 腰臀外覆盖一至两层极短黑色荷叶蕾丝，裙摆只到臀线下方，边缘使用细窄波浪花边。
          - 荷叶层负责在站立和落座时产生轻微位移，不扩大成女仆伞裙、蓬蓬裙或角色短裙。
          - 侧腰可以保留一枚小体量黑色缎带结，缎带尾长度不超过大腿上段；两人不同时叠加多组蝴蝶结。
          - 裙摆内保留完整黑色低腰内层，面料与胸杯同为不透哑黑；半透蕾丝和短裙不替代现实下装。
      - heading: 吊袜带与长袜
        value: |-
          - 每套使用可调、可自行处理的吊袜带连接黑色薄透长袜；结构合身，不与风衣、鞋履或另一人的衣装相连。
          - 袜口停在大腿上段，与荷叶短裙之间留出一段连接结构；不使用渔网格、破洞、文字、背缝箭头和撞色图案，避免重新叠成主题造型。
          - 两人分别决定是否保留、调整或换回普通丝袜。连接数量和袜口位置只服从现实合身，不承担共同关系证明。
      - heading: 小鱼儿
        value: |-
          - 胸衣的纵向软骨包边更清楚，使用偏几何、密度略低的蕾丝纹样，使腰线和结构感更利落。
          - 荷叶裙摆以单层为主，长度略短，侧腰只留一枚窄缎带结；不增加多层蓬度。
          - 自然深黑发做高马尾或利落半束，露出肩带和颈后；妆面使用清楚眼线与低饱和莓红唇色。
          - 她的完成度来自衣装检查、风衣收纳和身体姿态，不恢复 COS 角色语言或职业角色表演。
      - heading: 悦悦
        value: |-
          - 胸衣保持同样的黑色半杯结构，腹腰蕾丝纹样更细、更密，半透区与肤色的对比更柔和。
          - 荷叶裙摆可以使用两层极薄蕾丝，外层比小鱼儿多出少量垂坠，但总长度仍停在臀线下方。
          - 深色长发中分或轻偏分披下，由裸露肩颈和黑色肩带切开头发与胸衣；妆面使用冷灰粉眼妆与水润玫瑰唇色。
          - 她不戴假发、猫耳和项圈，也不因使用黑色冷面衣装进入暗黑角色人格。
          两人的主体结构与颜色保持同类，但共同选择不要求复制到每个扣件和袜口高度。小鱼儿以更利落的结构检查和揭示动作成立，悦悦以更柔和的层次与自主跟进成立；衣装差异服务两人的行动方式，不只停留在纹样与妆发。
      - heading: 鞋履与小配饰
        value: |-
          - 两人都使用黑色尖头浅口中跟鞋或简洁踝带中跟鞋，鞋面保持低光泽，不增加铆钉、锁链和长系带。
          - 小鱼儿可使用小型枪灰耳钉，悦悦可使用细银耳坠；不再叠加项链、项圈、手链和臂环。
          - 不使用蕾丝手套、面具、眼罩、鞭子、拍具、锁链或其他支配道具。衣装本身已承担足够强的情趣识别，不借道具制造场型。
          - 两人各自准备备用普通鞋履与衣物，离开主要室内空间时能够重新穿回。
      - heading: 内外层切换
        value: |-
          1. **外出状态**：两件过膝黑风衣前襟扣合、腰带系紧，只露出黑色鞋履与正常妆发。
          2. **确认室内私密**：两人分别确认门、随身物品与各自衣装状态，再自行解开风衣腰带与暗扣。
          3. **风衣离身**：风衣完整脱下并挂到独立衣架，不敞开披肩、不堆在地面，也不压住手机与房卡。
          4. **室内主体出现**：半杯胸衣、半透束腰、荷叶短裙、可调吊袜带和黑色长袜共同构成完整黑色内层。
          5. **退出状态**：任意一人需要离开、保暖或停止展示时，都可以重新穿回并扣好自己的风衣，不要求另一人同步。
          内外层切换只是衣装揭示，不自动构成任何具体亲密行为的开始、继续或完成。
      - heading: 云顶 KTV 适配
        value: |-
          - 黑色蕾丝、黑色长袜与深色沙发容易连成一片，包厢灯光须让哑光胸杯、半透腰腹、荷叶裙边和袜口形成四个不同黑度，不用强逆光把身体拍成剪影。
          - 柔性软骨允许正常靠坐、转身和取杯，但长时间弯腰或缩在沙发里仍会产生压痕；任意一人都可以调整坐姿或暂时松开侧扣。
          - 落座前分别整理荷叶裙边和吊袜带，确认夹扣没有压在大腿与沙发之间。动作是现实衣装管理，不写成同步表演。
          - 风衣挂在随手可取的位置，口袋内的手机、房卡和个人物品仍由本人掌握；不把外层交给场所保管到无法独立离开。
      - heading: 双人进入画面的顺序
        value: |-
          1. **先见外层**：小鱼儿与悦悦穿着相近长度的黑色薄风衣进入，腰带与低光泽长轮廓把两人先连成一组。
          2. **再见内层**：风衣分别挂起以后，两套黑色蕾丝胸衣裙同时出现；半杯、束腰、荷叶裙和长袜形成明确情趣层。
          3. **再分本人**：小鱼儿的软骨线和束发更利落，悦悦的细蕾丝、双层裙摆与披发更柔和。
          4. **回到本人状态**：没有角色名、假发、道具和台词，两人以自己的妆发、说话方式与动作继续室内社交。
      - heading: 正文优先锚点
        value: |-
          每次调用只取一至两个：
          1. 两件过膝黑风衣并排挂起，里面才露出同色而不同纹理的蕾丝胸衣裙。
          2. 哑黑胸杯之下，花纹蕾丝沿纵向软骨收进腰线。
          3. 极短荷叶裙摆下露出纤细吊带与大腿上段的黑色蕾丝袜口。
          4. 小鱼儿的单层裙边更利落，悦悦的第二层薄蕾丝在动作中晚半拍落下。
          5. 没有猫耳、项圈和道具，两个人仍再次选择共同揭示，同时保留各自改变决定的能力。
          6. 任意一人重新拿回风衣并扣好，画面便从私密内层恢复为能够离开的完整外出状态。
      - heading: 与前面及后续衣装的区分
        value: |-
          - 与第 01 场小鱼儿黑色蕾丝甜辣裙相比，本场不是普通夜间连衣短裙，而是双人半杯胸衣、半透束腰、极短荷叶层与吊袜带长袜组成的明确情趣内层。
          - 与第 04 场轻量女仆相比，本场没有白色翻领、围裙、女仆发箍和过膝白袜；荷叶短层只是胸衣裙的一部分，不承担角色制服。
          - 与第 05 场黑白天使相比，本场没有翅膀、羽片、黑白反色和幻想揭示；两人全黑同类，揭示只发生在风衣与室内内层之间。
          - 与第 09 场黑白镜像夜场装相比，本场不露完整腰腹，也不是纯色抹胸配斜裙；半透蕾丝、纵向软骨、吊袜带与长袜显著提高私密情趣识别。
          - 第 10—12 场阿九不复用本场的双人全黑蕾丝胸衣裙、荷叶短层和吊带长袜组合，而以三套连续但互不替代的单人服务装承接连续三晚。
      - heading: 执行边界
        value: |-
          - 本场是小鱼儿与悦悦逐次选择的双人情趣衣装，不是 COS、公开拍摄服、云顶制服或永久服务项目。
          - 风衣遮覆、同时脱下外层、半透蕾丝、吊袜带和共同到场都不构成共同报价、共同离场、拍摄、保存、传播或任何身体授权。
          - 两人分别决定自己的风衣、胸衣扣合、吊袜带、长袜、鞋履与退出时间；其中一人调整、重新遮覆或离开，不要求另一人同步。
          - 图片中的猫耳、项圈、手套和鞭子已经明确删除，不得在正文中以“临时加一点气氛”为由重新出现。
          - 本场只固定衣装与内外层切换，不预设具体亲密动作、主从关系、称呼、多人范围或场后关系变化。
      - heading: 当前结论
        value: |-
          云顶第 13 次共同亲密消费场的衣装锁定为“**小鱼儿＋悦悦过膝黑色薄风衣＋双人黑色蕾丝胸衣裙与吊带丝袜**”：外出时两人分别扣合不透肤的过膝黑风衣；进入确认私密的室内空间后，风衣完整挂起，露出半杯胸衣、半透花纹束腰、极短荷叶蕾丝裙、可调吊袜带与黑色蕾丝边长袜。
          本场不是 COS。小鱼儿以更清楚的结构线、衣装检查和主动揭示成立，悦悦以更柔和的薄层、披发和自主跟进成立；猫耳、项圈、蕾丝手套、鞭子和角色语言全部删除。回归感来自两人在不依赖角色身份、也不要求动作完全同步的情况下，再次选择共同到场与共同揭示，并且各自保留重新穿回风衣、调整或退出的完整能力。
