          | 阿九个人脱离 | 固定关停安排与人物解除的先后 | 关停安排形成后，由 `CON-0028` 完成阿九个人赌债、服务抵扣义务和云顶直接控制解除，阿九退出排班与服务投放 | 本页只继承 `PL-S-179` 结果，不重复执行；个人脱离不启动非付费关系 | `PL-S-177、PL-S-178、PL-S-179` |
