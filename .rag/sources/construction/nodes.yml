    transition: ""
    note: 固定魏琳在教学楼顶楼目击坠亡、首次咨询、持续恢复、向父亲说明、本人报警、华靖接待、医院独立复诊评估与学校复学安排；不补她到达顶楼的时间和原因。
    summary: "- 魏琳保持单元来访者定位，不因开场示范自动进入核心人物线。"
