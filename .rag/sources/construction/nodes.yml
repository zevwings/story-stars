    sections:
      - heading: 使用边界
        value: |-
          - 本页不记录生命周期状态；当前状态只从 `story/construction/_status/` 读取。
          - 不展开具体性行为流程、侵害复述、调查操作、贷款核销、秘密转移、酒店细节和章号。
