    source_file: story/construction/反派控制与责任链/01_反派控制方法反制与责任链.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 使用边界
        value: |-
          - 本页不记录生命周期状态；当前状态只从 `story/construction/_status/` 读取。
          - 绑定章纲时可以补足日期、地点、记录字段、对白与动作，但不得改变对应正式节点已经确认的结果与边界。
          - 多节点共享事件只执行一次；下列分节用于保留各线路必须承接的职责，不代表重复发生同一场景。
      - heading: PL-M-018、PL-M-017、PL-M-019｜共同精神控制方法显影
        value: |-
          - **正式节点**：[PL-M-017｜郑文悦固定归因异常显影](../../plotlines/主线/组织/反派/郑文悦固定归因异常显影.md)、[PL-M-018｜八个招聘／用工接口交叉验证](../../plotlines/主线/组织/反派/八个招聘／用工接口交叉验证.md)、[PL-M-019｜多案共同方法源确认](../../plotlines/主线/组织/反派/多案共同方法源确认.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 公开接触 | 建立可信身份与后续一对一入口 | 慈善活动只完成公开认识；齐心先针对郑文悦真实存在的经营或职业困境，提供一次真实、合规且有效的资源帮助，取得后续接触机会 | 具体困境、帮助内容与公开活动场景由章节大纲确定；不在公开活动中批量筛选或施术，不把正常帮助本身写成控制 | `PL-S-145、PL-S-146` |
          | 多次接触 | 使普通精神连接逐步稳定 | 郑文悦在多次正常接触中主动谈及真实困境、依赖或关键选择，既有信任与普通精神连接逐步形成 | 具体接触次数、地点和对话由章节大纲确定；不写成见面即强种，不让齐心凭空读取目标全部隐私 | 管理局协查线 |
          | 越权扩张 | 形成第一次深层塑心／孤悬控制连接 | 齐心越权利用既有信任，以塑心实施篡心并固定核心解释，再以孤悬隔离能够推翻该解释的具体反证 | 深层连接不倒推此前帮助虚假，也不抹除目标当时仍有的自主行为 | `PL-M-003` |
          | 招聘端调查 | 使郑文悦成为首名完整显影者 | 警方沿失联人员留下的招聘联系、合同与人员记录找到并控制郑文悦；她准确提供名单、岗位、合同、联系人、出境及失联时间，却不断替换境外管理、转岗、离职或主动断联等理由，维持齐心无关的固定结论 | 章节大纲须为另一名招聘负责人、六名真实用工方及招聘服务机构设置最低可辨识身份；不把异常口供直接当作异能证据，先排除串供、逃责与共同利益 | `PL-S-049`、`PL-M-021、PL-M-023、PL-M-020、PL-M-022、PL-M-024` |
          | 八人材料交叉 | 排除单人口供与普通共谋解释 | 警方分批交叉八人的口供、合同、资金、通讯、出入境记录及人员结果，确认不同接口出现同构的“事实准确、归因固定”偏差 | 具体批次、记录字段和核验顺序由章节大纲确定；不能省略现实调查，也不能用精神异常直接替代证据 | `PL-S-049`、`PL-M-021、PL-M-023、PL-M-020、PL-M-022、PL-M-024` |
          | 管理局复核 | 在现实调查门槛后确认同源精神异常 | 普通调查已排除串供、规避责任与共同利益后，管理局才按权限介入精神异常复核 | 章节大纲须确定介入门槛、现场动作与权限分工；不得让晏林凭一次接触读出八人受控或齐心身份 | `PL-S-006`、`PL-S-007` |
          | 跨案重识别 | 固定共同方法痕迹 | 多个独立对象能够准确复述事实，却持续以近似结构维持同一选择；旧理由被现实推翻后会迅速生成新解释，具体反证又难以进入当前判断 | 单次偏差不足以指向齐心；只确认“塑心＋孤悬·闭环自证”的共同方法，不确认统一组织或完整幕后名单 | `PL-S-148、PL-S-150、PL-S-149、PL-S-147`、`PL-M-003` |
      - heading: PL-M-021、PL-M-023、PL-M-020、PL-M-022、PL-M-024｜陆佳凝合法出境组织与境外交接显影
        value: |-
          - **正式节点**：[PL-M-020｜合法出境包装](../../plotlines/主线/组织/反派/合法出境包装.md)、[PL-M-021｜第一次境外交接](../../plotlines/主线/组织/反派/第一次境外交接.md)、[PL-M-022｜实验对象与结果流转](../../plotlines/主线/组织/反派/实验对象与结果流转.md)、[PL-M-023｜境外资产与经营权重组](../../plotlines/主线/组织/反派/境外资产与经营权重组.md)、[PL-M-024｜其他独立黑色轴显影](../../plotlines/主线/组织/反派/其他独立黑色轴显影.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 邮轮前 | 固定招聘链异常交接入口 | 郑文悦等招聘／用工材料先显出被标记人员分流，再由车辆和交接材料指向刘秉文的转移执行 | 只能确认调查方向，不能提前证明合法出境组织和境外去向 | `PL-M-018、PL-M-017、PL-M-019`、`PL-S-049` |
          | 邮轮后 | 交叉合法出境与公开行程中断 | 刘秉文的少数转移记录，与陆佳凝掌握的真实合同、行程变更、付款指令、结算摘要和交接确认发生交叉 | 多数对象进入真实工作或自行合法出境，不统一经过刘秉文；不设置万能服务器或全链名单 | `PL-M-033、PL-M-035、PL-M-034`、`PL-S-050` |
          | 收网前 | 接通境外接收与实验结果 | 境外接收、园区运营、实验需求、结果回传和收益材料分别指向朱岑郁、裴家及齐心一侧的控制轴 | 各责任轴分别证明；器官贩卖链与人体实验链不得合并定责 | `PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
      - heading: PL-M-030、PL-M-031、PL-M-032｜异常干预者观察、试探与首次有效反制
        value: |-
          - **正式节点**：[PL-M-030｜反派识别持续干预模式](../../plotlines/主线/组织/反派/反派识别持续干预模式.md)、[PL-M-031｜主动试探泄露位置](../../plotlines/主线/组织/反派/主动试探泄露位置.md)、[PL-M-032｜第一次有效反制造成持续现实损失](../../plotlines/主线/组织/反派/第一次有效反制造成持续现实损失.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 安若曦订单后 | 形成反派侧第一份错误观察 | 现场执行者确认感知中的命中位置与现实结果不一致，将异常暂按清醒侧感知欺骗或位置替换理解 | 单次结果不能识别截断、双子星结构或四项权柄 | `PL-M-001` |
          | 多案痕迹聚合 | 把单次误判升级为可供试探的错误模型 | 反派把订单失败、目标脱离与接口受阻归入同一类稳定干预 | 错误模型只改变反派行动，不取得管理局机密档案或授权结论 | `PL-S-194、PL-S-195`、`PL-M-028、PL-M-029、PL-M-025、PL-M-026、PL-M-027` |
          | 主动试探 | 定位异常干预与信息泄露范围 | 反派更换中间人、调整订单字段或使用相似目标测试信息来源 | 一次试探不能识破双子星，也不能让反派取得管理局档案 | `PL-S-161、PL-S-162` |
          | 切割与现实反制 | 让反派学习产生持续后果 | 裴家切割外围并剪裁甩锅；陆佳凝决策、刘秉文执行周晓莉转移，形成第一次持续现实损失 | 账户停用、证据缺口或短暂失联不能替代周晓莉的长期后果 | `PL-S-161、PL-S-162`、`PL-S-050` |
      - heading: PL-M-036、PL-M-038、PL-M-039、PL-M-037｜核心反派责任链清算
        value: |-
          - **正式节点**：[PL-M-036｜证据窗口与保全](../../plotlines/主线/组织/反派/证据窗口与保全.md)、[PL-M-037｜各反派主体责任分别闭合](../../plotlines/主线/组织/反派/各反派主体责任分别闭合.md)、[PL-M-038｜个人裁判结果](../../plotlines/主线/组织/反派/个人裁判结果.md)、[PL-M-039｜合法产业接管与剩余受害后果承接](../../plotlines/主线/组织/反派/合法产业接管与剩余受害后果承接.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 阶段四秘密断链 | 固定带核潜伏前置 | 浅层交底后，顾清言授权晏林在近距离接触中秘密截断既有主动控制链；齐心未察觉，旧印核不能远程重连，顾清言恢复自主并继续伪装受控 | 不等待齐心主动加固；防止齐心重新安排近距离接触并再次施加；晏林不负责现实取证 | `PL-S-123`、`PL-S-125`、`PL-S-138`、`PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
          | 解印前 | 预保全现实证据 | 先保全门禁、车辆、物业、资金、行程、关联企业接口及已定位服务器的原始记录或镜像 | 不等待顾清言完整解印后再启动全部取证 | `PL-M-021、PL-M-023、PL-M-020、PL-M-022、PL-M-024`、`PL-S-138` |
          | 隔离与解印后 | 固定第一次清醒陈述 | 经身体状态、现实定向、理解能力和持续授权评估后，只固定顾清言本人经手的人员、场所、时间、车辆、结算、交接与上游接触事实；郑文悦脱离齐心后先经历隔离、现实定向和持续评估，再按自身恢复条件补充本人经手的招聘、材料与接触事实 | 解印或脱离持续控制不自动证明陈述可信；郑文悦的固定归因不会立即消失；任何单人都不提供完整责任链 | `PL-S-138`、`PL-S-140`、`PL-M-018、PL-M-017、PL-M-019` |
          | 记录复核后 | 完成第二次复核陈述 | 以预保全材料核对第一次陈述，再由顾清言解释已出现记录间的关系并指出继续核验方向；郑文悦的陈述只提供招聘端责任链地图 | 章节大纲须确定日常经办人员、现场分工、预保全手续、记录字段、时间戳和交叉核验顺序；不以精神痕迹、错误反馈或单人口供替代现实证据 | `PL-M-021、PL-M-023、PL-M-020、PL-M-022、PL-M-024` |
          | 统一行动门槛 | 四轴分别达到行动条件 | 人口贩卖／跨境人员转移、艺人压迫与场所输送、非法精神药剂、境外人体实验分别完成必要预保全 | 不要求艺人集体递材料，不以单一梦境、记忆或口供替代现实证据 | `PL-S-190、PL-S-189、PL-S-191、PL-S-188`、`PL-S-009`、`PL-S-187、PL-S-184、PL-S-185、PL-S-186`、`PL-M-021、PL-M-023、PL-M-020、PL-M-022、PL-M-024` |
          | 统一收网窗口 | 同步控制境内外接口 | 境内人员、场所、资金、药剂供应与使用端，同境外接收、拘禁和实验节点尽量在同一行动窗口控制 | 统一行动时点，不合并罪名和责任；顾清言、晏林和受保护当事人不取得指挥权 | `PL-M-036、PL-M-038、PL-M-039、PL-M-037`、`PL-M-021、PL-M-023、PL-M-020、PL-M-022、PL-M-024`、`PL-S-138` |
          | 收网当日保护 | 防止当事人被转移或封口 | 杨柳、白玥及其他秘密保护对象优先完成安全确认，未保护对象按风险同步撤离 | 不以任何人作诱饵，不要求当日完成陈述或公开 |
          | 收网后 | 完成分层裁判与长期后果 | 顾清言的主动犯罪、受控行为、退出减害和配合调查分别裁判；章绍衡的主动诱导、非法放贷、债务施压与目标移交单独裁判；其余招聘、转移、场所经营、共同获利和境外承接责任继续逐人核验 | 不让顾清言吸收齐心、章绍衡、陆佳凝、刘秉文、朱岑郁或裴家责任；不把郑文悦统一写成无责受害者、总招聘头目或完整境外去向知情者 | `PL-S-142`、`PL-S-143`、`PL-S-190、PL-S-189、PL-S-191、PL-S-188`、`PL-S-049`、`PL-S-050`、`PL-S-130`、`PL-S-132`、`PL-S-134`、`PL-S-060`、`PL-S-087`、`PL-S-089`、`PL-S-090`、`PL-M-018、PL-M-017、PL-M-019` |
