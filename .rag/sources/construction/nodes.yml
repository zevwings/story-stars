        value: |-
          - 本页不记录生命周期状态；当前状态只从 `story/construction/_status/` 读取。
          - 绑定章纲时可以补足日期、地点、记录字段、对白与动作，但不得改变对应正式节点已经确认的结果与边界。
          - 多节点共享事件只执行一次；下列分节用于保留各线路必须承接的职责，不代表重复发生同一场景。
      - heading: PL-M-001｜晏林断流安若曦的外来欲望连接
        value: |-
          - **正式节点**：[PL-M-001｜晏林断流安若曦的外来欲望连接](../../plotlines/主线/人物/晏林/安若曦-外来欲望连接断流.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 断流与离场 | 完成第一次绘影遮蔽并留下错误观察结果 | 晏林用绘影制造错误位置，再通过现实移动脱离；反派侧现场执行者最先发现所见位置与现实结果不一致 | 绘影不替代现实位移；本案不进入管理局材料，也不暴露双子星结构或四权柄分配 | `PL-M-030、PL-M-031、PL-M-032`、`PL-M-028、PL-M-029、PL-M-025、PL-M-026、PL-M-027` |
      - heading: PL-M-025—PL-M-029｜双子星主体解释权与分层公开边界
        value: |-
          - **正式节点**：[PL-M-025｜晏林主体解释权](../../plotlines/主线/人物/晏林/晏林主体解释权.md)、[PL-M-026｜内圈完整私人知情](../../plotlines/主线/人物/晏林/内圈完整私人知情.md)、[PL-M-027｜管理局分层权限](../../plotlines/主线/人物/晏林/管理局分层权限.md)、[PL-M-028｜敌对资源化模型被否定](../../plotlines/主线/人物/晏林/敌对资源化模型被否定.md)、[PL-M-029｜公共风险行动验证新边界](../../plotlines/主线/人物/晏林/公共风险行动验证新边界.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 行动前主体说明 | 先确立晏林对本人操作真相与能力结构的解释位置 | 晏林以契约自知和长期使用经验确认本人完整报备内容，准确说明两星无主次、织梦／绘影与断流／倒卷的分配、已成形能力、现实限制及自己愿意承担的公共风险边界 | 主体解释权不是隐瞒公共风险、否决依法监管或单方面决定所有公开范围；机构可以依据证据复核其陈述，但不得把阶段性档案反过来替代本人第一人称操作事实，关系者也不得替他解释本人能力与意愿 | `PL-M-025`、`PL-S-007` |
          | 第一波私人告知 | 先让直接处于既有风险面的安若曦、江岚取得完整知情 | 晏林分别向安若曦、江岚说明双子星结构、四项权柄分配及与本人安全和选择直接相关的风险；两人各自提问并决定后续参与边界 | 两人的告知分别成立，不因两人既有关系合并授权；不公开其他伴侣隐私、身体细节或案件材料 | `PL-M-026` |
          | 第二波私人告知 | 继续完成苏璃、唐雨薇的独立知情 | 晏林分别向苏璃、唐雨薇完成同等完整告知；两人分别确认自己理解到何种程度以及是否需要暂停后续危机参与 | 不让苏璃与唐雨薇的既有关系代替逐人告知，也不把完整知情写成共同亲密的前置或结果 | `PL-M-026` |
          | 最后一人单独告知 | 让谢晚乔在不被群体气氛代答的条件下取得完整知情 | 晏林单独向谢晚乔完成双子星结构与四项权柄分配告知，并允许她独立追问、暂停和决定危机参与边界 | 不用全员会议、小组行动或既有关系稳定推定她已经知情 | `PL-M-026` |
          | 管理局分层权限锁定 | 把私人知情与机构调用分开 | 管理局最高机密层保留完整档案，普通业务摘要仍只显示织梦方向；绘影、断流或倒卷只在具体任务达到门槛、晏林同意且风险和退出条件明确时逐案调用 | 私人告知不扩散机构档案；最高机密层知情不等于普通经办层或任务现场完整知情 | `PL-M-027`、`PL-S-007` |
          | 终局对敌或公共风险 | 以双星协同否定反派错误模型并验证新边界 | 织梦／绘影所在星以绘影制造错误现场并遮蔽真实行动路径；断流／倒卷所在星以断流中止持续连接，并只在作用仍沿通道传递时局部倒卷 | 双星只负责精神层控场和制造物理破绽，抓捕必须由现实行动完成；调用范围服从前一阶段逐案授权 | `PL-M-028、PL-M-029`、`PL-M-030、PL-M-031、PL-M-032`、`PL-M-036、PL-M-037、PL-M-038` |
          | 终局现场复核 | 固定有限可见结果 | 外部只能确认反派连接失效、调度错误及普通梦境任务摘要不足以解释全部结果 | 现场结果只能形成事件证据或能力推定，不能唯一证明断流、倒卷、双子星结构或四权柄分配；管理局只向任务人员调用最低必要机密信息 | `PL-M-028、PL-M-029`、`PL-S-007` |
          | 终局后授权复核 | 留下可追踪、可复核的主体异议 | 晏林在机密任务授权复核中提交本人书面异议，并绑定材料访问审计编号 | 异议不否认完整报备与公共安全责任，只反对无证据推定、非必要扩权和持续征用；本行只复核既有边界，不倒置前述告知和授权顺序 | `PL-M-025、PL-M-027`、`PL-S-007` |
          六位核心女主完成完整私人知情后，取得继续协商的条件；景雪瑶的知情继承大学时期星辰之桥建立事实，其余五人按风险相关性分波完成。共同告知、暂停、危机参与和职业分权规则仍由 `PL-S-193` 独立承接。
