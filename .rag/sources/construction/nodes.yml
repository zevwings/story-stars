    source_file: story/construction/云顶KTV会所线/08_梦露小娜.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 场次作用
        value: |-
          本场把原定的“梦露深色御姐、小娜浅色甜欲”收束为一组成年学院风双子造型。两人使用相同的白色短衬衣、深色蝴蝶结和黑色鞋履，先建立一眼可见的组合关系，再以深浅异色百褶短裙、妆发和本人气质完成区分。
          “双子”只描述同框造型逻辑，不表示梦露与小娜是双胞胎，也不要求两个人从头到脚完全复制。它属于成年人主动采用的学院风时装，不建立真实中学、年级、校名或学生身份。
      - heading: 视觉参考
        value: >-
          参考图片：

          - `/Users/zevwings/Library/Mobile
          Documents/com~apple~CloudDocs/inimate/参考/服装/IMG_7549.PNG`

          - `/Users/zevwings/Library/Mobile
          Documents/com~apple~CloudDocs/inimate/参考/服装/IMG_7550.PNG`

          - `/Users/zevwings/Library/Mobile
          Documents/com~apple~CloudDocs/inimate/参考/服装/IMG_7551.PNG`

          采用范围：

          - 两人使用同版白色短袖衬衣、同色蝴蝶结和同类黑色鞋履形成成组感。

          - 以一深一浅、格纹与纯色不同的百褶短裙保留人物差异。

          - 上装相同、下装变化的“双子但不复制”结构。

          - 白衬衣、深色领结与百褶裙在并肩画面中形成的清楚层次。

          调整范围：

          - 不采用两人从上装、粉色短裙到白色连裤袜全部相同的复制式搭配。

          - 不采用一黑一白露肩上衣配同款白裙的方案；该结构更接近普通双人辣妹装，也会重复前面黑白上衣的组合逻辑。

          - 不照搬参考人物的面容、身体比例、发型、动作、拍摄地点与平台界面。

          - 不使用校徽、校名、班级牌、学生证、书包或其他能够指向真实学校身份的配件。
      - heading: 白色短袖衬衣
        value: |-
          - 两人穿同版纯白短袖衬衣，使用小翻领、窄门襟和轻微收腰；衣摆停在自然腰附近，露出一小段腰线，但不短到只剩胸衣式结构。
          - 面料以不透、低光泽的棉混或弹力衬衣料为主，包厢顶光下仍能看见领口、袖口和门襟，不能依赖强光滤镜维持白色完整度。
          - 胸前不加英文校名、虚构班徽或号码刺绣。需要细节时只保留一处无文字的小型同色口袋或简洁压线。
          - 两件衬衣保持同版同长，尺码分别服从梦露与小娜的身体，不为制造复制感强行让肩线、胸线或腰线落在绝对相同的位置。
      - heading: 深色蝴蝶结
        value: |-
          - 领口使用同款深藏青软蝴蝶结，尺寸能够被近景辨认，又不扩张成女仆领结或舞台大蝴蝶结。
          - 蝴蝶结采用低光泽罗纹或哑光缎面，与纯白衬衣形成清楚反差；两人都不额外叠领带、领圈或角色项圈。
          - 蝴蝶结可独立解下，长时间落座或觉得领口不适时能够调整，不把配件固定成无法退出的角色装置。
      - heading: 梦露｜深灰藏青格纹
        value: |-
          - 梦露穿高腰百褶短裙，底色为深灰或藏青，使用低对比细格纹；远看先呈深色块，靠近后才看出格线。
          - 裙摆停在大腿上段，褶量清楚但不过度蓬开。深色格纹承接她稳定衣装里的黑、深灰与冷色，也保留原方案中较利落、较成熟的一侧。
          - 裙腰保持干净，不增加链条、徽章、吊饰或夸张金属扣，避免从成年学院风滑向具体作品 COS。
      - heading: 小娜｜浅灰粉纯色
        value: |-
          - 小娜穿与梦露同版的高腰百褶短裙，颜色使用低饱和浅灰粉，不使用糖果粉、荧光粉或带校服识别度的固定配色。
          - 裙面保持纯色，以柔和浅色承接她稳定衣装中的珍珠白、浅裸粉和浅灰粉；不复制梦露的格纹，也不增加蕾丝裙边。
          - 相同裙型落在小娜身上仍保留她自己的柔软曲线，不要求她模仿梦露的职业展示站姿或控制方式。
      - heading: 腿部与鞋履
        value: |-
          - 两人都使用黑色乐福鞋或低跟玛丽珍鞋，鞋型保持一致，具体尺码与跟高各自适配。
          - 默认裸腿；温度或人物状态需要时，可使用接近肤色的轻薄连裤袜，但两人不采用参考图中的白色不透明连裤袜。
          - 不叠加及膝白袜、堆堆袜或带条纹的运动长袜，避免把成年人时装推向真实中学生制服或体育馆拍摄造型。
          - 鞋跟控制在能够通过云顶走廊、正常落座并独立离场的高度，不使用只适合静态拍摄的过高厚底鞋。
      - heading: 梦露
        value: |-
          - 使用自然深黑发，高马尾、半束发或利落披发均可；不戴彩色假发，不为了“双子”与小娜复制相同发型。
          - 眼线与睫毛收得清楚，唇色可用低饱和莓红或水红；妆面比小娜更利落，但不使用角色瞳片和舞台妆。
          - 配饰只保留小型银色或枪灰耳饰，与深色格纹裙呼应。
      - heading: 小娜
        value: |-
          - 保留深黑长发自然披下或发尾轻卷，让头发围住小脸和白衬衣领口；不采用梦露的束发方式。
          - 妆面使用明亮底妆、柔和眼尾和水润浅玫瑰唇色，保持她本人的清甜感，不把面容处理成梦露的复制品。
          - 配饰控制在一件细银项链或小型耳饰；不同时堆叠名牌包、胸针和多件首饰。
          两人通勤与离场都各自携带一件能够覆盖短衬衣与短裙的外层。梦露可用深灰短西装，小娜可用乳白或浅灰粉短外套；外层只处理公共空间移动、温度和独立离场，不纳入双子主造型。
      - heading: 云顶 KTV 适配
        value: |-
          - 白色短衬衣在暗光中承担共同亮面，深色蝴蝶结负责切开领口；不能让顶光把衣料照透或让门襟消失。
          - 梦露的深灰藏青格纹裙位于较暗一侧，小娜的浅灰粉纯色裙位于较亮一侧，二人并肩时自然形成深浅分区。
          - 落座后百褶裙会压平，两人分别整理自己的裙摆和外套，不设计完全同步的摆拍动作。
          - 若两人交换站位，识别仍依靠裙装颜色、格纹／纯色、束发／披发和妆面差异，而不是固定让某个人只能站在某一侧。
      - heading: 双人进入画面的顺序
        value: |-
          1. **先认出组合**：两件同版白衬衣、两枚深藏青蝴蝶结与同类黑鞋首先把两人连成一组。
          2. **再看见深浅**：梦露是深灰藏青格纹裙，小娜是浅灰粉纯色裙；下半身直接拆成一深一浅。
          3. **最后分清本人**：梦露的束发与利落妆面更紧，小娜的披发与水润妆面更柔，不依靠复制脸或复制动作制造“双子”。
          4. **回到正常社交**：两人落座后分别管理裙摆、外层和随身物品，组合衣装不把她们变成需要持续维持同步表演的角色。
      - heading: 正文优先锚点
        value: |-
          每次调用只取一至两个：
          1. 两枚深藏青蝴蝶结同时压在纯白领口下。
          2. 同样的衬衣往下分成深格纹与浅灰粉两片百褶裙。
          3. 梦露束起深黑长发，小娜的披发则沿白色肩线垂下。
          4. 两双同型黑鞋停在一起，裙装颜色却把两个人清楚分开。
          5. 落座后两人各自压平裙褶，没有刻意复制对方的动作。
      - heading: 与相邻衣装的区分
        value: |-
          - 与第 03 场梦露、月月普通黑白夜装相比，本场不使用抹胸和黑色短裤；共同感来自白衬衣、蝴蝶结与百褶裙，差异放在深浅和格纹／纯色。
          - 与第 04 场轻量女仆相比，本场没有围裙、褶边发箍、心形扣、白色肩部褶边和角色服务结构，只保留成年人学院风时装。
          - 与第 06 场月月 OL 相比，本场使用短袖白衬衣、软蝴蝶结和百褶短裙，不使用证件牌、无框眼镜、文件夹或包臀裙。
          - 与第 07 场淼淼黑色夜装相比，本场不使用吊带抹胸、牛仔毛边和半透罩衫，画面从单人全黑现实夜装切换为双人白色上装与深浅裙装。
          - 后续梦露、月月双人 COS 不应复用白衬衣、深藏青蝴蝶结和深浅百褶裙的整套组合。
      - heading: 执行边界
        value: |-
          - 本场所有人物均为成年人；“双子 JK”在施工调用中统一写作“成年学院风双子造型”，不扮演真实未成年人。
          - 不出现真实或虚构校名、校徽、年级、班级、学生证、书包和课堂身份，也不把云顶包厢改写成校园场景。
          - 同款上装、短裙、露腰和双人同框只建立衣装关系，不构成共同报价、共同离场、拍摄、保存、传播或任何身体授权。
          - 梦露与小娜分别决定自己的外层、袜装、鞋履、落座位置与离场安排；其中一人的选择不能替另一人确认。
          - 小娜不是 Coser，也不因本场学院风造型承担持续角色扮演；梦露可以帮助检查衣装完成度，但不能替她决定展示与后续范围。
      - heading: 当前结论
        value: |-
          第八次衣装锁定为“**梦露＋小娜成年学院风双子造型**”：两人穿同版纯白短袖短衬衣、同款深藏青软蝴蝶结和同类黑色乐福鞋／低跟玛丽珍鞋；梦露搭配深灰藏青低对比格纹百褶短裙，小娜搭配低饱和浅灰粉纯色百褶短裙。
          本场采用“上装与配件相同、裙装深浅异色”的组合方式。它保留原定的梦露深色、小娜浅色分工，同时避免从头到脚完全复制；不使用白色不透明连裤袜、真实学校标识和校园身份道具。
