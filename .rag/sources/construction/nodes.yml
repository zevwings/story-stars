          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 第一至第五日 | 维持正常慈善航程与会议前的公开掩护 | 六名决策者分别参加必要公开活动；顾清言不发生星辰之印排异发作，也不需要晏林再次止损 | 不让公开公益、私人娱乐和闭门议题互相替代；航程不承载顾清言解印前置 | `PL-I-028`、`PL-I-026`、`PL-S-124` |
          | 第六日前后 | 完成六人闭门会谈 | 会议空间与公开活动、高权限娱乐区分离；只确认最少重组条款 | 不增加第七名参会者，不展开完整合同或犯罪操作流程 | `PL-S-187、PL-S-184、PL-S-185、PL-S-186` |
          | 会谈后 | 形成后续现实记录入口 | 进出时间、公开缺席和必要运营变化留下可供后续核验的方向 | 顾清言、楚辞、赵梦娜只能掌握各自亲历，不能还原会议全貌 | `PL-M-021、PL-M-023、PL-M-020、PL-M-022、PL-M-024`、`PL-M-036、PL-M-038、PL-M-039、PL-M-037` |
      - heading: PL-I-028｜航程限定关系、楚辞欲望确认与靠岸分流
        value: |-
          - **正式节点**：[PL-I-028｜航程限定关系、楚辞欲望确认与靠岸分流](../../plotlines/亲密线/晏林/赵梦娜×楚辞-航程限定关系与楚辞欲望确认.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
