          | 交易后 | 让顾清言识别两人的后续可能 | 顾清言分别问晏林是否喜欢、楚辞是否愿意再见；两边均给出肯定方向后，以自己看上为名暂留她 | 顾清言仍按客户维护、资源保留与控场逻辑行动，不写成无私保护 | `PL-S-051` |
          | 邮轮前两至三个月 | 建立楚辞的场面能力与服从惯性 | 顾清言完成衣装、礼仪、识人、避险和应答训练 | 训练、住宿和职业安排不产生身体授权 | `PL-S-068` |
          | 登船 | 完成公开同行落位 | 楚辞以顾清言名义上的女人登船 | 公开身份不授权观看、触碰、加入或未来关系 | `PL-I-028` |
      - heading: PL-I-028｜航程限定关系、楚辞欲望确认与靠岸分流
        value: |-
          - **正式节点**：[PL-I-028｜航程限定关系、楚辞欲望确认与靠岸分流](../../plotlines/亲密线/晏林/赵梦娜×楚辞-航程限定关系与楚辞欲望确认.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 第一日 | 完成公开身份落位 | 晏林以独立慈善来宾登船；楚辞以顾清言名义上的女人同行 | 公开名单不产生私人娱乐或会议权限 | `PL-S-066`、`PL-S-068` |
          | 第二日 | 启动航程限定关系 | 赵梦娜完成公开活动后主动邀舞，与晏林进入第一次私人相处 | 不以角色、资源或长期承诺交换 | 赵梦娜人物线 |
          | 第三日 | 建立高频关系与楚辞醋意 | 赵梦娜与晏林公开同行并继续逐次确认；楚辞开始辨认自己的欲望 | 不让十余次兑现同质重复 | 亲密专项 |
