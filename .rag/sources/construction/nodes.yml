    plotline_owner: 亲密线 / 晏林
    plotline_interfaces: PL-I-041、PL-S-099
    scope: 阶段四
    transition: ""
    note: 固定只有小鱼儿、悦悦同行的游玩、用餐、留宿、非付费无女女共同兑现与次日离开；悠悠、娜娜、阿九不进入本次行程。
    summary: "- 位于阶段四，发生在 CON-0029 完成会员资格以后、阿九独立事件之后。"
    headings:
      - 场景位置
      - 行程顺序
