    source_file: story/construction/云顶KTV会所线/07_何雯娜.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 场次作用
        value: |-
          这是娜娜第一次单独进入云顶 KTV 衣装序列。她不承担 COS，造型需要从前面小鱼儿、悦悦的角色服中退回现实都市夜装，同时保持足够大胆、贴身和有镜头完成度。
          本场采用作者确认的黑色改版：黑色细吊带抹胸、水洗黑低腰牛仔超短裙与烟灰半透短罩衫。黑色更适合包厢暗光，但上衣、短裙和罩衫不能使用同一种纯黑，必须依靠材质、洗色和裸露腰线分层。
      - heading: 场次接口
        value: |-
          - 本单元只承接云顶第 07 次亲密消费场；参与者为晏林与何雯娜，小鱼儿、悦悦及其他女性不参加本场。
          - 晏林惯常联系的小鱼儿、悦悦当晚都无法赴约，于静才从当晚可用的松散外部人员中临时撮合娜娜；娜娜不是由小鱼儿介绍，也不因于静撮合而进入云顶内部排班。
          - 本场承接 `PL-I-035` 的夜场班次、独立离场与付费性服务关系，并为 `PL-S-093` 提供夜场调度碎片入口。
          - 单人到场不产生后续重复权；费用、离场、身体范围、停止点、入梦与影像边界仍分别确认。
      - heading: 商 K 消费承接（简写）
        value: |-
          - 娜娜以现实夜装进入包厢后，本场须有真实开包、至少一轮酒水或无酒精饮品、点歌／交谈与包厢停留；正文选择递酒、点歌或结账中的一至两个动作即可。
          - 现实夜装展示与包厢内有限亲密可以嵌入消费段；是否结束包厢、娜娜是否离场及后续场外亲密另行决定，不能从独立到场直接跳到带走。
          - 当晚开台、账单、稳定付款、人员反馈与正常离场进入云顶经营记录，继续累积于静对晏林消费稳定性和现场风险的判断；单场不产生私域推荐。
      - heading: 视觉参考
        value: |-
          参考视频：
          `/Users/zevwings/Library/Mobile Documents/com~apple~CloudDocs/inimate/参考/小水一号/v2700fgi0000d97uv0nog65hgustoif0.MP4`
          视频参数为 720×1280、60 帧／秒、有效视频流约 10.28 秒，共 530 帧。画面展示了浅色细吊带短上衣、宽松短罩衫、低腰蓝色牛仔超短裤、正侧面腰线以及抬臂时的衣装变化；约 7.3 秒后进入平台尾卡。
          采用范围：
          - 细吊带、偏方形低领与贴身短上衣构成的肩颈和上腹轮廓。
          - 上衣腰侧轻微褶皱，避免弹力面料完全平贴。
          - 宽松短罩衫从肩部滑落、露出内层吊带的覆盖关系。
          - 低至中腰位置、贴身胯线和窄毛边处理。
          - 抬臂、拢发和重新整理罩衫时产生的真实位移。
          改造范围：
          - 浅米白内层改成深黑，蓝色牛仔短裤改成水洗黑低腰牛仔超短裙；视频只提供腰位、胯线和牛仔材质依据，不作为裙装结构依据。
          - 浅米色罩衫改成烟灰半透，保留材质对比，不做全身同质纯黑。
          - 户外湿身、瀑布、水汽和湿透后的透明效果不进入云顶场景。
          不采用范围：
          - 参考人物的面容、身体比例、湿发、动作表演、滤镜和拍摄地点。
          - 视频水印、账号与搜索文字。
          - 画面没有展示的鞋履、内衬和具体闭合方式。
      - heading: 黑色层次
        value: |-
          | 部位 | 色彩 | 材质与作用 |
          | --- | --- | --- |
          | 吊带抹胸 | 深黑 | 哑光双层弹力布，建立最实的黑色主体 |
          | 牛仔超短裙 | 水洗黑／炭灰黑 | 牛仔纹理、褪色边缘和银色五金切开上下纯黑 |
          | 短罩衫 | 烟灰半透 | 最轻的一层黑，移动时显出肩带和手臂 |
          | 鞋履／小配件 | 黑与冷银 | 收住下身，只留少量城市金属感 |
          不能把三层统一成漆黑亮面。包厢暗光中应先看见烟灰罩衫的轮廓，再看见实黑上衣，由腰腹裸露过渡到有洗色纹理的牛仔超短裙。
      - heading: 黑色细吊带抹胸
        value: |-
          - 上衣采用细肩带与偏方形低领，介于短背心和抹胸之间；肩带只负责稳定，不扩大成普通吊带衫。
          - 下缘停在肚脐上方，完整露出一段腰腹；长度比第 03 场的平直筒形抹胸略长，但贴合度更高。
          - 胸前保持纯黑，不使用文字、蕾丝、亮片、镂空和撞色滚边。
          - 腰侧保留一至两道轻微抽褶，使上衣从胸线向下收窄，也能在抬臂后自然产生小幅皱折。
          - 使用双层哑光弹力布，内部有现实承托和防滑结构。肩带可以调节，但调节扣压为黑色，不做明显银色装饰。
      - heading: 水洗黑低腰牛仔超短裙
        value: |-
          - 下装使用低腰贴胯牛仔超短裙，裙腰落在肚脐下方，与短上衣之间保留完整裸露腰线。版型贴住胯部后略微放开，不做高腰或弹力包臀筒裙。
          - 黑色经过轻度水洗，裙腰、口袋边和裙口呈炭灰层次；不是与上衣完全一致的纯黑，也不漂成浅灰。
          - 保留牛仔下装的腰头、腰袢、前后口袋、银灰金属扣和前中短拉链。五金只承担现实结构，不增加腰链、腿链或垂挂饰物。
          - 裙口停在大腿上段，正面大体平直，一侧可以留轻微不对称的上收，以窄毛边结束；不加蕾丝裙边、百褶或斜向堆褶。
          - 裙内不固定、不另设安全短裤。面料含少量弹力但仍保留牛仔厚度；坐下、起身和转身时裙口会产生真实位移，不写成能自动保持覆盖的舞台装。
      - heading: 烟灰半透短罩衫
        value: |-
          - 外层沿用视频的宽松短罩衫结构，颜色改为烟灰，材质使用轻薄网纱、雪纺或低光泽薄针织。
          - 罩衫长度停在腰部附近，前襟不设纽扣，可以自然敞开；衣摆不覆盖整条短裙。
          - 袖子宽松，长度到前臂或手腕之间。肩部允许自然滑到上臂，露出黑色细吊带，但滑落由娜娜自己整理，不固定成永远半脱状态。
          - 罩衫是本场唯一外层，不能再叠黑西装、皮衣、披肩或主题袖套。
          - 需要减装时可以直接从肩臂退出并完整脱下，不与抹胸肩带、短裙或首饰连接。
      - heading: 妆发与配件
        value: |-
          - 深色长发不使用视频中的持续湿发。云顶版本做松散低髻或低束，保留八字刘海和脸侧碎发；少量发丝可以在抬臂后松落。
          - 妆面保持白净、低阴影，以灰粉／浅棕压在睫毛根部，下眼睑和眼头只做少量提亮。
          - 唇色使用玫瑰豆沙或低饱和水红，不用浓黑眼妆加正红唇把她推向小鱼儿的暗色角色妆。
          - 配饰只留一对小型冷银耳饰，或一枚简洁银色裙扣作为远近呼应；不加项圈、腰链、长项链和成套手饰。
          - 手包选黑色或银灰小包，能够放手机、补妆物和个人物品，不作为镜头道具反复展示。
      - heading: 腿部、鞋履与外出完整性
        value: |-
          - 腿部保持裸露，不使用丝袜、过膝袜或腿环，由超短裙口直接放出完整腿线，保留牛仔材质的现实都市感。
          - 视频没有提供鞋履依据。云顶版本可使用黑色细带中跟鞋、简洁黑色短靴或银灰短跟鞋；优先选择能够正常走廊移动和独立离场的款式。
          - 黑色短抹胸、水洗黑牛仔超短裙与烟灰短罩衫共同构成完整现代夜装，娜娜可以直接穿过车辆、前厅与走廊并独立离场；烟灰罩衫是唯一外层，不再另备通勤外套。
      - heading: 云顶 KTV 适配
        value: |-
          - 暗光中用三种黑色明度保持层次：烟灰罩衫最浅，水洗短裙居中，哑光上衣最深。
          - 抬臂、拢发或靠坐时，罩衫会从肩头滑向上臂；娜娜可以重新提回，也可以直接脱下，不把滑落强行解释为邀请。
          - 低腰超短裙落座后需要确认裙腰和裙口位置。她坐下前可以先顺一下后侧裙口，起身时再拉平一侧毛边，体现表演训练与夜场兼职形成的衣装整理习惯。
          - 上衣肩带、罩衫和手包彼此独立，避免三条细带在肩部缠绕。
          - 不继承视频中的淋湿状态；包厢内的面料透明度以干燥实物为准。
      - heading: 衣装拆解顺序
        value: |-
          1. **保留完整夜装**：烟灰罩衫、黑色吊带抹胸与水洗黑牛仔超短裙共同完成到场与第一次完整呈现。
          2. **去掉轻外层**：罩衫可以从肩臂直接退出，留下最简洁的黑色短上衣与牛仔超短裙。
          3. **分别处理主体**：抹胸由肩带和侧部闭合解除，短裙由金属扣与前中拉链处理；两件互不连接。
          方便穿脱只属于现代夜装结构，不预设后续行为。娜娜可以始终保留罩衫，也可以只去掉罩衫，不由衣装顺序替她作决定。
      - heading: 正文优先锚点
        value: |-
          每次调用只取一至两个：
          1. 烟灰罩衫从肩头滑下，露出下面一根实黑细肩带。
          2. 哑光黑上衣与水洗黑牛仔超短裙之间隔着一段清楚腰线。
          3. 银灰裙扣和炭灰裙口使黑色牛仔超短裙没有消失在暗光里。
          4. 娜娜抬臂重束头发，罩衫宽袖随动作向前臂堆起。
          5. 落座前她顺过后侧裙口，起身时又拉平一侧毛边，再把小包放回手边。
          6. 罩衫完整脱下后，没有角色配件，只剩现实的吊带短装。
      - heading: 与相邻衣装的区分
        value: |-
          - 与第 03 场小鱼儿、悦悦的同款抹胸短裤相比，本场使用细吊带方领、腰侧抽褶、低腰水洗毛边牛仔超短裙和烟灰罩衫；不是平直无肩带上衣配纯黑同款短裤。
          - 与小鱼儿的黑天使基础装相比，本场没有翅膀、羽片、反色配对和幻想妆面，黑色通过牛仔洗色与半透罩衫表现现实材质。
          - 与悦悦 OL 相比，本场没有衬衣、高腰弹力包臀裙、眼镜和身份道具，视觉重心从职业符号转回肩颈、裸露腰线与牛仔结构。
          - 与后续小鱼儿＋悦悦的黑白斜向堆褶超短裙相比，本场保留水洗牛仔腰头、口袋、金属扣和毛边，不使用同版弹力纯色裙。
      - heading: 执行边界
        value: |-
          - 这是娜娜自己选择的大胆现代夜装，不是 COS、主题制服或云顶固定工作服。
          - 衣装贴身、露腰、超短裙、裙内不设安全短裤和罩衫滑落都不构成续场、离场、拍摄或身体授权。
          - 视频只提供衣装结构，不继承湿身表演、瀑布环境和社交平台语境。
          - 娜娜可以按温度、行动和个人判断重新穿上罩衫，不把重新覆盖写成角色中断或扫兴。
      - heading: 当前结论
        value: |-
          云顶第 07 次单人亲密消费场的衣装锁定为“**黑色细吊带方领短抹胸＋水洗黑低腰牛仔超短裙＋烟灰半透短罩衫**”。整体采用深黑、炭灰与烟灰三层明度，在云顶暗光中保留纯黑夜装的利落感，又避免上衣和短裙糊成一个色块。
          本场不使用湿发、丝袜、腰链、蕾丝裙边和主题配件，牛仔超短裙内不设安全短裤。娜娜以现实剪裁、干燥材质和整理肩带／裙口的自然动作成立，明确与小鱼儿、悦悦承担的 COS 场分开。
