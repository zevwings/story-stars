    summary: 这是阿九连续三晚中的第二晚，也是云顶 KTV 集中段的第十一次亲密消费场。本场把白衬衣、纯黑百褶超短裙与薄黑丝袜组合成成年夜场情趣造型；衣装本身就是当晚的包厢服务装，不再额外携带或换上另一套情趣服装。
