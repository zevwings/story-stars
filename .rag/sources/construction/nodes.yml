        value: |-
          这是阿九第一晚在本轮云顶 KTV 集中段采用的衣装。它只服务第一晚，不替第二晚、第三晚预设或复用服装；后两晚分别由 [CON-0042｜第十一场](13_秦瑶.md) 与 [CON-0043｜第十二场](14_秦瑶.md) 承接。
          它不走原先预留的黑金礼服、深酒红贴身裙或完整蕾色情趣内层，而以一套面积很小、结构直接的灰黑做旧牛仔装集中展示胸腰比例、完整腰腹、胯侧和裸腿。
