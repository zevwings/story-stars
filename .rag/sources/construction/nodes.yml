      - heading: 调用规格
        value: |-
          - 终局按“付费结束—关停后三人组局—小鱼儿邀约—晏林买单—小鱼儿在亲密开场前再次明确不收费—悠悠首次加入非付费回路—关系可间断继续”推进，不需要把所有后续单人、双人和三人组合逐一写完。
