    sections:
      - heading: 场次作用
        value: |-
          这是梦露在普通装亮相后的第一次完整 COS。重点不是单纯增加露肤，而是第一次让晏林看到她能够同时控制假发、重型头饰、角色妆、手部饰件、衣装层次与镜头姿态，正式建立她作为自由 Coser 的职业完成度。
          角色采用作者已确认的“**貂蝉·马年限定**”。本场属于红黑／暗金东方幻想，与上一场的本人黑裙形成明确切换：上一场先认出梦露本人，这一场再看见她怎样把本人藏进完整角色外壳。
      - heading: 视觉参考与逐帧口径
        value: |-
          参考视频：
          `/Users/zevwings/Library/Mobile Documents/com~apple~CloudDocs/inimate/参考/施梦露/v0200fg10000d6lddbvog65o45co0go0.MP4`
          视频参数为 960×720、30 帧／秒、总长约 10.43 秒，共 313 帧。逐帧检查后，有效造型画面集中在第 000—222 帧；第 223—312 帧为平台尾卡，不作为衣装依据。
          | 帧段 | 时间 | 画面提供的信息 |
          | --- | --- | --- |
          | F000—F065 | 0.00—2.17 秒 | 双手与袖口特写：甲片、红花手饰、金色手链／指环结构、前臂镂空金饰与红色袖料 |
          | F066—F073 | 2.20—2.43 秒 | 手部特写向正面半身叠化，只用于确认层次衔接，不据此判断真实透明度 |
          | F074—F117 | 2.47—3.90 秒 | 正面上半身：高冠、发型、面饰、胸前黑金主体、红色大袖与圆形马纹饰件 |
          | F118—F124 | 3.93—4.13 秒 | 正面半身向脸部特写叠化 |
          | F125—F170 | 4.17—5.67 秒 | 妆面与头部近景：红瞳、红色眼妆、额心花钿、金色横向面饰、发冠侧饰与垂坠流苏 |
          | F171—F178 | 5.70—5.93 秒 | 脸部特写向右侧半身叠化 |
          | F179—F222 | 5.97—7.40 秒 | 右侧三分之二角度：露肩结构、黑色上身、白红脱肩袖、头冠高度与背侧长坠饰 |
          | F223—F312 | 7.43—10.40 秒 | 平台尾卡，无新增服装信息 |
          补充下装截图：
          - 作者本轮提供的现场摊放画面补足了主视频未拍到的腰部以下结构。
          - 截图能够确认白色褶裥短内裙、红色外层裙片、侧部开口和赤足；仍不能确认背面、完整腰封闭合及站立后的精确裙长。
          - 截图来自临时剪贴板文件，本页只继承其中可确认的衣装事实，不登记临时路径为长期参考入口。
          采用范围：
          - 视频明确出现的头冠轮廓、假发结构、角色妆、面饰、上身黑金结构、左右袖层、手饰及圆形马纹饰件。
          - 从正面到右侧角度能够互相印证的颜色、材质关系与佩戴位置。
          - 手势、转身时饰件产生的摆动，用于判断现实活动范围。
          - 补充截图明确出现的白色短内裙、金色纹样、红色滚边、红色外层裙片与赤足。
          不采用范围：
          - 视频滤镜造成的肤色、瞳色亮度、飘落花瓣、背景光斑和叠化残影。
          - 参考人物的面容、身体比例、具体表演和账号信息。
          - 主视频与补充截图均未完整展示的背部闭合、腰封固定、内衬边界、站立后的准确裙长和完整穿脱方式。
      - heading: 整体色彩与轮廓
        value: |-
          - **主色**：正红、黑色与暖金。红色负责袖料和花饰，黑色压住发型与上身，暖金贯穿头冠、面饰、胸前甲片、手饰和袖边。
          - **辅助色**：白色不仅出现在右侧脱肩袖，也构成下身中央短内裙；青蓝只作为头冠中心宝石及圆形马纹饰件内部的小面积冷色。
          - **整体轮廓**：上方由高耸的双弧冠形成尖长纵向线，中部由宽大的红色外袖与圆形饰件向左扩张，下身再以白色短内裙收紧中央、红色外层裙片向两侧铺开。它不是均匀对称的古装，而是“高冠＋窄身＋单侧大体量＋红外白内”的展示型 COS 轮廓。
      - heading: 假发结构
        value: |-
          - 使用乌黑长假发，不改变为梦露本人的自然披发。
          - 顶部盘成高髻，两侧保留厚而圆的鬓发体积；额前中分，两束弧形发片贴近面侧，把脸收在狭长的黑色框架里。
          - 耳前与背侧保留细长发束。右侧转身时能看到至少一束长发落到胸侧，后方另有与冠饰并行的细长坠线。
      - heading: 高冠结构
        value: |-
          - 冠顶是两道向上合拢但不闭合的金黑尖弧，形成近似火焰或角形的高挑外框。
          - 中央叠放红橙色尖瓣形片，最下方嵌一枚小型青蓝圆形宝石；它是整个头部唯一明显冷色点。
          - 左侧集中红色花簇与小型金饰，右侧使用金色弧片和红色水滴形侧饰，整体为受控的不对称。
          - 冠侧与后方有细长金色坠饰，末端带小珠或水滴件。人物转身时它们会晚于头部半拍摆动，是角色进入动态画面的主要识别点之一。
          现实落地时，高冠应做成可拆的轻量三段结构：基础发箍／发梳负责受力，中央冠片与两侧尖弧分别固定。尖端使用轻质圆边材料，不使用真正锐利金属；长坠饰避开座椅靠背，进入低矮车门或需要久坐前可以由梦露自行拆下。
      - heading: 妆面与面饰
        value: |-
          - **眼妆**：上眼睑使用高饱和红色，由眼头向眼尾拉长；下眼睑同样晕入红色，配合明显的上下睫毛，把圆杏眼推向角色化的人偶感。
          - **瞳片**：画面为亮红色角色瞳片。只在提前准备、眼睛状态允许时使用，不能把红瞳写成梦露的自然眼色。
          - **额心**：中央是红色四瓣花形花钿，上方叠一小段蓝紫色弧线；发际中央另悬一枚红金菱形额饰，二者上下对齐。
          - **唇色**：饱和砖红／正红，边缘清楚，光泽低于眼妆和金饰，避免面部所有部分同时反光。
          - **横向面饰**：一条纤细金色饰条横跨鼻梁前方，靠两侧发饰或耳侧结构支撑；右端可见小型菱叶形收尾。左侧垂下多条细金片和红珠链，靠近脸颊但不贴住嘴唇。
          面饰负责把“本人面容”切割成角色面具感，但不写成遮挡视线的硬质面甲。进入包厢后如需要进食、饮水或长时间交谈，应允许梦露先摘下面饰；摘除不等于角色或当次约定自动结束。
      - heading: 贴身主体
        value: |-
          - 上身中心是黑色贴身胸衣／短上衣，领口压低，肩颈和锁骨保持大面积开放。
          - 黑色主体上叠暖金花瓣形甲片，中心点一枚小红方饰；旁侧还有黑、白、红组成的卷纹饰片。
          - 颈肩与上胸可见极细的金色线带交叠，形成装饰性框线。视频叠化和暖光会放大透明感，因此只确认“细金线＋贴近肤色的轻薄承托层”，不锁定为完全裸露或无内衬结构。
          - 上臂有独立黑色细带，负责固定脱肩袖或侧部饰件，不将其误写成普通细肩带。
      - heading: 左侧红色大袖
        value: |-
          - 画面左侧是整套造型最大的服装体量：正红宽袖／外披以黑色作内侧阴影，边缘和表面使用大面积暖金弧纹。
          - 袖料抬起时形成硬挺外轮廓，但靠近手腕处仍能折叠，说明应采用“轻质主体＋局部定型边”，而不是整片硬甲。
          - 袖前固定或悬挂一枚大型圆形暖金饰件，表面有浮雕纹路，中央能辨认出青蓝与浅色组成的马形图案。这是视频中最直接的“马年限定”视觉证据，也是本套不能删除的主题件。
      - heading: 右侧白红脱肩袖
        value: |-
          - 右侧可见白色宽袖／披帛从上臂外侧垂落，表面叠黑、金、红色卷纹与红色尖片，和左侧大红袖形成明暗不对称。
          - 袖口与前臂之间由金色镂空线条连接，手抬起时能够看到皮肤，不是一只完全封闭的传统长袖。
          - 正文不把左右袖写反：圆形马纹饰件随红色大袖出现在画面左侧；白红脱肩袖在人物右侧转身画面最清楚。
      - heading: 白色短内裙
        value: |-
          - 下身中央是一条白色短内裙，裙长落在大腿上段。它与白红脱肩袖形成上下呼应，使白色不再只是上身的小面积辅助色。
          - 腰部使用密集细褶收束，向下展开为较平整的短裙片；前片有重叠关系，不是一圈完全封闭、没有层次的筒裙。
          - 裙片边缘使用红色细滚边，表面分布少量暖金花形与弧形纹样。装饰密度明显低于红色外层，作用是把白裙接回整套红金体系。
          - 侧部开口较高，人物侧躺时能够露出大腿。当前只确认画面所见开口，不推断左右完全对称，也不锁定背面结构。
      - heading: 红色外层裙片
        value: |-
          - 白色短裙外侧另有大体量正红裙片／外袍下摆，颜色、金边和立体花饰与上身红色大袖连续。
          - 红色外层不完全覆盖白裙，而是向身体两侧打开，让中央白色短裙和腿部保持可见。
          - 外层裙片比白色内裙更长、更宽，负责人物停下或侧卧时的铺陈；站立和行走时应通过腰侧固定点控制，不写成始终漂浮在身体周围。
          - 圆形马纹主题件落在红色外层与腰侧之间，仍是连接上身和下身的核心主题标记。
      - heading: 赤足
        value: >-
          - 本套不配鞋履，完整展示状态明确为赤足；脚背、脚跟与脚趾保持裸露，不增加高跟鞋、长靴或角色鞋。

          - 赤足把下身从红金重装中重新拉回轻盈状态，也让白色短内裙与腿部之间没有新的色块截断。

          -
          赤足只指包厢内完成造型后的状态。公共走廊、车辆和换装途中另备便于穿脱的平底鞋或拖鞋，进入清洁、安全的室内区域后再脱下；备用鞋不进入角色画面。

          - 地面温度、清洁度或安全条件不适合时，梦露可以暂时穿回备用鞋，不能为了维持造型忽略现实风险。
      - heading: 手部、甲片与小配件
        value: |-
          - 指甲为超长尖形甲片，以红色为主，混入金色或红金渐变；长度明显服务于定点手势，不适合普通取物。
          - 一只手背有立体红花，下面连接金色细条、圆片与指环，形成手链—指环一体的手甲结构。
          - 另一侧前臂使用金色几何镂空护腕，线条沿腕部和手背延伸；它在翻腕时形成连续金线。
          - 红花手饰、面侧红花与头冠花簇构成三处呼应，但正文每次只需抓其中一处，不同时罗列。
          到达云顶前，梦露应保留一双能够操作手机、拉链和随身物品的普通手；长甲片与立体手饰可在换装完成后安装。若本场需要正常用餐或持续取杯，采用可拆甲片，不能让造型以不现实的方式自动适应所有动作。
      - heading: 云顶 KTV 的现实落地
        value: |-
          - 这套造型需要提前约定与独立换装条件，不可能从普通通勤状态直接完成。梦露至少携带假发与发网、头冠分件、面饰、瞳片用品、手饰、补妆用品和衣装袋。
          - 通勤时另穿能够独立离场的本人衣物与备用鞋；角色服和赤足状态不是她往返公共空间的唯一选择。
          - 首次进入画面可保留高冠、横向面饰、长甲片和圆形马纹饰件，先给出完整角色揭示。
          - 入座以后优先卸下会撞椅背的后侧长坠件；饮水或用餐前可摘面饰与部分甲片。红色大袖和圆形主题件是否继续保留，取决于座位空间，不要求她整晚维持拍摄姿态。
          - 白色短内裙与红色外层落座后会发生叠压，坐下前由梦露先收拢红色外层、确认白裙前片位置，再将赤足放到清洁地面或自带的软垫上。
      - heading: 动态调用
        value: >-
          1. **第一眼**：先写高冠超过日常发顶的高度和单侧红袖形成的宽度，让角色轮廓先于面容出现。

          2. **确认角色**：由圆形金色饰件中的青蓝马纹点出“马年限定”，不靠旁白报完整商品名。

          3. **靠近**：再看见鼻梁前的金色横饰、红瞳和额心花钿，本人的圆杏眼被妆造改造成角色表情。

          4. **手势**：红金长甲、手背红花和镂空金饰只适合慢而准确的翻腕、托手与停顿；不写成她戴着整套手甲仍能毫无障碍处理所有物品。

          5. **下身揭示**：红色外层向两侧分开以后，中央白色褶裥短裙与赤足才完整出现，形成“上身重、下身轻”的第二层反差。

          6. **落座**：先收红色外层，再整理白裙重叠前片，最后让赤足落到软垫或清洁地面；动作体现她在管理复杂衣装。

          7.
          **退出角色**：先摘横向面饰或一枚长甲，再拆妨碍靠坐的坠件，最后穿回备用鞋。角色外壳被一层层卸下，梦露本人的说话方式和肩颈状态才逐渐回来。
      - heading: 正文优先锚点
        value: |-
          每次调用只取一至两个：
          1. 冠顶两道未闭合的金黑尖弧，以及中央唯一的青蓝宝石。
          2. 左侧红色大袖前那枚带青蓝马纹的圆形金饰。
          3. 鼻梁前横过的细金面饰与一侧垂落的红珠金片。
          4. 红瞳、红色上下眼妆和额心四瓣花钿组成的完整角色脸。
          5. 翻腕时连续亮起的长甲、红花手饰与几何金线。
          6. 右转以后，高冠后方的长坠件比她的动作晚半拍停下。
          7. 红色外层打开后露出的白色褶裥短裙、红边与零星金花。
          8. 红金重装一直铺到腿侧，最后却以一双赤足收住。
      - heading: 与前后衣装的区分
        value: >-
          - 与上一场普通黑裙相比，本场不是“更大胆的梦露本人”，而是第一次用高冠、假发、瞳片、花钿、面饰和主题件完成整套身份转换。

          - 与后续梦露＋月月双人 COS
          相比，本场由梦露单独承担全部角色信息，造型允许高冠和单侧大袖占据较大空间；双人场必须主动缩减体量，避免两个人的头饰、袖幅与道具互相打架。

          - 后续东方幻想造型不得再次照搬“红黑暗金＋高冠＋横向面饰＋圆形主题件”的完整组合，否则会削弱第一次 COS 的独占辨识度。
      - heading: 执行边界
        value: |-
          - 角色、衣装、手势与镜头完成度属于提前约定的 COS 展示，不自动扩大亲密、拍摄、保存或传播范围。
          - 主视频证明正面与右侧上半身结构，补充截图证明下身中央层次与赤足；两者都不提供完整背面，不把滤镜、叠化和花瓣特效写成现实物件。
          - “马年限定”是本次施工使用的角色版本名称，不由本页推导品牌、官方设定、服装价格、活动经历或梦露已经长期持有该套服装。
          - 头冠、瞳片、面饰、长甲、重袖与赤足都有现实负担；梦露可以因眼睛、头皮、颈肩、地面温度或清洁状态拆减配件、穿回备用鞋，拆减不应被叙事解释为失职。
      - heading: 当前结论
        value: |-
          第二次衣装锁定为“**貂蝉·马年限定完整 COS**”。完整结构为“**乌黑高髻假发＋金黑红高冠＋红瞳花钿角色妆＋金色横向面饰＋黑金贴身上衣＋左侧红色大袖与圆形马纹主题件＋右侧白红脱肩袖＋红金长甲手饰＋白色红边金纹褶裥短内裙＋两侧红色外层裙片＋赤足**”。
          当前仍不锁定背面闭合、完整腰封和站立后的精确裙长；这些未知项不得覆盖已经确认的“红外白内、短裙、侧部开口、赤足”四个下身锚点。
