    sections:
      - heading: 使用边界
        value: |-
          - 本页不记录生命周期状态；当前状态只从 `story/construction/_status/` 读取。
          - 不展开开店资金、租赁、证照、装修、供应、经营数据或治疗流程，也不把奶茶店写成创业经营教程。
          - 奶茶店生活与私人关系必须先后分层：先有不依赖晏林的工作、收入、日常安排与现实离开能力，后有私人复选。
          - 阿九重新使用“主人／母狗”语言，只说明她在自由状态下愿意针对晏林重新调用这套话术与取悦方式，不合理化云顶规训。
      - heading: 对应正式节点
        value: |-
          - [PL-S-085｜奶茶店经营、普通生活重建与缓慢重逢](../../plotlines/副线/人物/阿九/奶茶店经营普通生活重建与缓慢重逢.md)
          - [PL-I-039｜普通生活建立后的非付费服侍与间断性私人回归](../../plotlines/亲密线/晏林/阿九-普通生活建立后的非付费服侍与间断性私人回归.md)
          - [PL-I-040｜债务解除后的主动告别与临行前亲密](../../plotlines/亲密线/晏林/阿九-债务解除后的主动告别与临行前亲密.md)
      - heading: 执行顺序
        value: >-
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 |

          | --- | --- | --- | --- |

          | 临行分别 | 给阶段三和尾声之间建立距离 | 阿九在个人债务解除后主动与晏林完成一次非付费临行亲密，随后按本人决定去其他地方看看 |
          临行亲密不建立稳定回路；晏林不安排目的地和职业 |

          | 普通生活重新启动 | 证明她不是从云顶直接转入另一段依附 |
          阿九在其他地方经历一段不由晏林支配的生活探索期，重新安排自己的时间、工作与日常选择 | 不固定目的地、职业和时长；不要求写成完全痊愈 |

          | 公共终局完成 | 切断旧固定场所的持续影响 | 于静收监、云顶关停，阿九此前的个人脱离得到公共结果回收 | 只继承 `PL-S-082`
          的结果，不重写案件或司法过程 |

          | 奶茶店建立 | 给人物落下稳定的生活终点 |
          阿九在阶段五或尾声开设并经营一家面向普通顾客的奶茶店，以本人能够决定的营业节奏和收入维持生活 |
          不固定店址、规模、资金来源和经营数字；明确不以晏林的救助、投资或关系交换为条件 |

          | 奶茶店工作装落位 | 给普通生活建立稳定视觉锚点 |
          阿九使用暖象牙白短袖针织上衣、深酒红交叉背帆布围裙、黑色高腰直筒裤和黑色防滑软底乐福鞋；蜂蜜金长发扎低马尾或低盘发 |
          不把围裙写成女仆装、旧服务制服或私人情趣触发物 |

          | 缓慢恢复接触 | 把普通往来与身体复选分开 |
          阿九与晏林在非交易、非案件环境中重复发生普通接触，能谈工作、饮品、生活或其他不以旧经历为中心的话题 |
          不得以一次偶遇直接跳进身体关系；调查方不泄露阿九私人资料 |

          | 第一次非付费复选 | 让阿九在自由状态下重新定义旧语言 |
          由阿九确认这次没有费用、债务、服务单或帮助交换，并主动选择是否称晏林为“主人”、以“母狗／小母狗”自称及用熟悉方式服侍他 |
          每一项仍分别确认；旧脚本不能自动推出疼痛、束缚、扮演式强制、窒息、拍摄或永久从属 |

          | 间断性私人回路 | 固定终局关系结构 | 两人形成低频、非付费、逐次确认的私人双人回路；阿九继续经营奶茶店，任一次拒绝或停止都不影响生活
          | 不进入恋爱、排他、共同生活、经济依附或长期伴侣位置；不自动并入梦露、小娜、月月组合 |
      - heading: 阿九的主体性落点
        value: |-
          - 奶茶店不能只作一句职业结论，至少应出现一个由阿九自己安排营业、拒绝要求或调整生活节奏的普通动作。
          - 奶茶店视觉至少调用一次她自己系围裙、把手机钥匙放进前袋，或打烊后自己解下围裙并决定离开的动作。
          - 缓慢接触不能只靠晏林持续追问旧事；阿九应当能够决定谈什么、不谈什么、何时见面和何时结束。
          - 私人回归中的关键变化不是她比云顶时期更熟练，而是她能够明确说出“这次我想要”“这个可以”“那个不要”或同等效力的选择。
          - 她可以喜欢为晏林服务，也可以享受“主人／母狗”身份层；这种愉悦属于当前自由关系，不反向证明旧规训是培养、启蒙或善意帮助。
      - heading: 与其他终局线的隔离
        value: >-
          - 梦露、小娜、月月可以作为云顶外围旧相识存在，但不得以撮合者身份把阿九重新招入商业服务。

          - 阿九不加入三人的线上撮合职业；奶茶店不承担客户会面、人员筛选、订单中转或线下结算。

          - `PL-I-038` 与 `PL-I-039`
          结构相近但分别运行：前者是梦露、小娜、月月的不固定组合回路，后者只固定阿九与晏林的独立双人回路。

          - 若未来需要阿九与三人中任何人共同出现，须另行确认人物关系、进入动机与逐人边界，不能由本施工单元自动推出。
      - heading: 不得写偏
        value: |-
          - 不把“开奶茶店”简化成晏林替她安排的新生活。
          - 不把性服侍当成治疗方案、康复完成判据或阿九必须向晏林提供的回报。
          - 不用重新选择旧话术抹去章绍衡、于静、云顶及上层经营链的既往责任。
          - 不让阿九一回到晏林身边就重新使用“都行”“随便”替代具体选择。
          - 不把低频私人回路升级为固定接单、免费服务义务、长期伴侣或固定第四人。
      - heading: 当前结论
        value: 阿九的终局按“**个人债务与直接控制先行终止 → 主动临行复选与分别 → 去其他地方重新寻找生活 → 阶段五或尾声独立经营奶茶店 →
          与晏林重复普通接触 → 稳定私人关系的第一次自由复选 →
          间断性私人双人回路**”执行。她最终愿意针对晏林重新使用云顶训练形成的“主人／母狗”语言和主动取悦方式，但该选择只属于奶茶店生活已经独立后的当次与后续逐次确认，不继承旧债务、旧排班、旧服务义务或临行亲密的自动权限。
