    source_file: story/construction/工作室咨询线/CON-0037-魏琳首次咨询、报警交接与复学收束.md
    registry_file: story/construction/_status/active.md
    registry_line: 45
    registry_quote: "| CON-0037 | [CON-0037｜魏琳首次咨询、报警交接与复学收束施工](../工作室咨询线/CON-0037-魏琳首次咨询、报警交接与复学收束.md) | 副线 / 人物 / 魏琳 | PL-S-294—PL-S-297 | 阶段一首次咨询至阶段二复学收束 |  | 固定魏琳在教学楼顶楼目击坠亡、首次咨询、持续恢复、向父亲说明、本人报警、华靖接待、医院独立复诊评估与学校复学安排；不补她到达顶楼的时间和原因。 |"
    sections:
      - heading: 使用边界
        value: |-
          - 魏琳保持单元来访者定位，不因开场示范自动进入核心人物线。
          - 第一次咨询只完成问题方向定位与第一个现实选择，不完成家长告知、学校介入、试返校、正式复学或治愈。
          - 梦境辅助只在现实评估、本人同意、最低干预与醒后现实核验的边界内运行，不替代诊疗、证据或魏琳的选择。
          - 监护授权不能替代魏琳本人同意；晏林不代替她向家长讲述问题根因。
          - 晏林不能通过能力生成、补全或验证证词，梦境和咨询内容不能自动进入警方证据；报警与陈述必须由魏琳本人选择。
          - 本单元的警务部分只写到警方正式接收事情原委，不展开重新调查、取证、处分、审判或校方责任处置。
      - heading: 开场基线
        value: |-
          - 魏琳为 17 岁高二学生，经江州第一医院独立评估后转介至林语心理咨询工作室。
          - 她当前继续暂时休学，不进入复学或试返校安排。
          - 问题根因为：好友话少、朋友很少，独处时常到学校教学楼顶楼躺开人群；顶楼原本只是她看书、听歌或安静待着的地方，不是自杀预演场。她长期遭受排挤、现实殴打与言语霸凌；相关老师已经知道排挤问题，校医或校方安排的伤情检查也记录了她当日遭到殴打的伤情。校方希望压低事件影响，相关老师只作敷衍询问、口头训诫或推迟处理，没有立即隔离施暴者、通知监护人、安排成年人陪同或启动正式保护。老师当时知道的是排挤与伤情，不知道她即将实施自伤；失职点是没有处理已经明确的现实危险，不是在已知即时自杀意图后坐视不理。
          - 魏琳在教学楼顶楼目睹好友在当日殴打和持续言语刺激后主动越过护栏坠亡。正文不解释魏琳到达顶楼的具体时间与原因。现有公开与程序结论仍保留“本人主动跳楼死亡”；后续核查不必把死亡方式改写为他杀，而是分别追查长期霸凌、当日殴打、现场言语刺激与校方失职。校方对外仍以个人心理问题压低事件影响；“自杀”只描述最终身体动作，不抹除上述前置因果和责任。魏琳因惊吓与报复恐惧没有说出跳楼前的完整原委，继而把返校理解为对好友的背叛。
          - 开场时魏琳父亲尚不知道问题根因。学校相关教师与事件处理层知道好友遭排挤及伤情检查结果，但魏琳的休学材料只保留办理休学所需的行政信息，没有收录她的完整目击陈述。
          - 华靖与晏林是在鱼泉县成长阶段相识的同龄发小，成年后已有若干类似工作接触，但不补写独立案件；华靖不知道晏林的能力，只把他视为懂得咨询与警务交接边界的专业咨询者。
      - heading: 执行顺序
        value: |-
          | 顺序 | 场景功能 | 必须发生 | 执行边界 |
          | --- | --- | --- | --- |
          | 首次现实评估 | 建立咨询与授权边界 | 确认医院已完成独立评估与转介；晏林只在魏琳本人同意后使用梦境辅助 | 不由工作室越权医学诊断，不让监护授权覆盖本人选择 |
          | 末班车梦境 | 让问题方向显影 | 魏琳在站台等待已经不会出现的好友；晏林只让车门多停几秒，是否上车仍由她决定 | 不让晏林替她上车、留下或宣布问题已经解决 |
          | 醒后核验 | 把梦境放回现实 | 通过现实访谈核验她的感受、记忆与当下意愿 | 不把梦境象征当作事实、诊断或证据 |
          | 首次现实行动 | 给出可撤回的第一步 | 魏琳穿便服走到学校附近，并保留不进入校园的选择 | 这只是休学期间的接触练习，不等于试返校、复学或治愈 |
          | 中间恢复 | 让变化经过时间而不抢占主线 | 恢复期约每周一至两次咨询，并接受后续复诊与复学评估 | 中间场次只通过预约、工作室日常或简短反馈带过 |
          | 表达准备 | 使家长告知仍由魏琳主动完成 | 晏林帮助魏琳准备表达，由她决定时机与说法 | 晏林不代为披露完整梦境、好友身份或无关隐私 |
          | 最后一次关键咨询 | 完成从沉默到可以表达的变化 | 晏林帮助魏琳区分“当时没能阻止”与“现在仍替霸凌者保守秘密”；魏琳不由晏林代述，用自己的话向父亲说出内心想法和当时发生的事情 | 不由梦境生成记忆，不把说出事实写成晏林替她作出的选择 |
          | 报警决定 | 把表达推进为本人现实行动 | 魏琳在知情和可撤回前提下决定报警，由父亲作为监护人陪同 | 晏林不代替她报警，不以治疗、复学或家长要求强迫陈述 |
          | 警察局交接 | 把事情原委交给正式警务系统 | 魏琳、父亲和晏林共同前往；华靖负责接待。晏林只说明当前沟通状态和专业边界，事实由魏琳本人陈述 | 华靖不知道能力，不取得完整梦境或无关咨询记录；正文不展开后续查案 |
          | 复诊与复学评估 | 让现实专业系统承接结果 | 报警交接后，晏林只提出复诊建议；江州第一医院精神科独立完成复诊与风险评估，评估支持后再由魏琳及父亲与学校落实复学安排 | 报警不自动等于治愈，不由晏林、警方或医院直接替学校决定复学 |
          | 学校侧承接 | 完成最低必要知情与复学安排 | 家长知情后，魏琳及家长再与学校做复学所需的最低必要沟通 | 学校不取得完整梦境、好友身份与无关隐私 |
      - heading: 知情分层
        value: |-
          | 主体 | 开场知情 | 后续变化 | 不得自动获得 |
          | --- | --- | --- | --- |
          | 魏琳 | 自己的经历、感受与选择 | 逐步能够用自己的话表达内心想法和当时发生的事情 | 无；她仍可决定向谁披露到什么程度 |
          | 家长 | 休学、复诊、安全照护与安排所需信息，不知道问题根因 | 最后一次关键咨询中由魏琳主动讲述坠楼前的霸凌原委；父亲随后陪同报警 | 不因监护身份自动取得完整梦境与无关咨询隐私 |
          | 学校 | 相关教师与事件处理层知道好友曾遭排挤及伤情检查结果；魏琳休学档案只保留行政信息 | 完成复学评估后，获得安排复学和保护所需的最低信息 | 魏琳的完整梦境、咨询细节、完整目击陈述与无关隐私 |
          | 江州第一医院 | 独立评估、复诊与风险处置必需信息 | 在授权和处置必要范围内完成复诊与复学评估 | 工作室的完整咨询记录、完整梦境与无关隐私 |
          | 工作室运营人员 | 预约、安全与岗位所需的最低信息 | 只通过排班、预约变化和普通反馈承接中间恢复 | 梦境材料、问题根因、医疗细节与完整咨询记录 |
          | 华靖／警方 | 开场不接入咨询 | 报警时由魏琳说明亲历事实，父亲协助提交本人愿意交出的现实材料；华靖完成正式接收 | 梦境材料、能力事实、完整咨询记录及超出报案所需的隐私 |
      - heading: 章纲可调参数
        value: |-
          - 第一章正面展开首次咨询；案例收束时再正面展开最后一次关键咨询。
          - 报警交接收在魏琳把未能归还的课堂笔记放到桌上，并说出“她跳下去以前，他们打了她”；具体措辞可由命中章纲保持原意调整。课堂笔记是魏琳主动陈述的动作锚点，不单独证明霸凌、殴打或校方责任。
          - 华靖与晏林此前接触的次数和案件内容不补写；本场直接通过安排安静环境、控制询问节奏与及时交接表现既有默契。
          - 学校在复学时提供的具体保护措施，由命中章纲按当时场景需要确定。
          - 复学的具体日期、手续和是否需要短期渐进过渡，由命中章纲确定。
          - 上述参数不得改变“能够主动向父亲说出事实 → 本人决定报警并完成警务交接 → 复诊与复学评估确认 → 可以复学”的因果顺序。
      - heading: 不得写偏
        value: |-
          - 不把首次梦境辅助写成一次治愈，不用“上车”自动证明她已经放下过去。
          - 不把走到学校附近写成试返校或复学成功。
          - 不让家长、学校、医院或工作室运营人员因身份或合作关系自动打通完整信息。
          - 不把魏琳能够讲述经历写成完全治愈，也不跳过后续复诊与复学评估。
          - 不把死者写成被人直接推下；身体动作上由她主动越过护栏，事件因果上必须保留长期霸凌、当日殴打和现场言语刺激。
          - 不因校方保留“自杀”判定而抹除已知的排挤、伤情与未启动保护事实；也不把校医或校方安排的伤情检查写成司法验伤或自动完成责任认定。
          - 不把校方压低处理扩写成所有教师、校医与行政人员共同谋划；只追踪实际知情、处置与未履行保护职责的具体接口。
          - 不让晏林把梦境内容、咨询推断或能力读取交给警方充当事实证据。
          - 不写警方如何重新调查、调取材料、处理霸凌者或认定学校责任；事情进入正式程序即完成本场收束。
          - 不把本单元扩张为工作室普通运营权限或异常接待权限的完成证据；许知秋的 `PL-S-198`、`PL-S-199` 仍须由独立施工兑现。
