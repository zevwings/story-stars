          | 管理局分层权限锁定 | 把私人知情与机构调用分开 | 管理局最高机密层保留完整档案，普通业务摘要仍只显示织梦方向；绘影、断流或倒卷只在具体任务达到门槛、晏林同意且风险和退出条件明确时逐案调用 | 私人告知不扩散机构档案；最高机密层知情不等于普通经办层或任务现场完整知情 | `PL-M-027`、`PL-S-007` |
