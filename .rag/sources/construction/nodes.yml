    summary: "- 本页不记录生命周期状态；当前状态只从 story/construction/status/ 读取。"
    headings:
      - 使用边界
      - 债务链与带离前置
      - 场景定性与参与结构
      - 已确认事件顺序
      - 后续黑暗压迫场设计接口
      - 与云顶 KTV 第十二场衣装的接口
      - 终局接口
      - 不得写偏
    content_indexed: true
    source_file: story/construction/阿九债务侵害线/01_阿九债务侵害前史.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 使用边界
        value: |-
          - 本页不记录生命周期状态；当前状态只从 `story/construction/_status/` 读取。
          - 本页只固定已经确认的债务链、相对时间、参与人数、先后结构、拒绝失效、责任归属、辨认锚点与场后转送接口，不展开具体性行为过程。
          - 事件准确地址与日历日期不补；正文视角方案以及身体与心理后果的承接章节留到正式分章或对应场景设计时决定，不另建待确认分析页。
          - 后续进入章节正文前，仍须按黑暗压迫场流程单独设计；任何设计不得改变本页已经确认的顺序与责任边界。
      - heading: 债务链与带离前置
        value: |-
          - 阿九在地下赌场内完成赌博及贷款材料确认；赌博参与和借款分别定性，赌场现场完成两项手续不构成对后续催收、带离、身体侵害或债务性服务的授权。
          - 阿九不知道章绍衡的真实姓名；她在后续只能够以“那个人”指代本人见过的施害与转送者，并说明外貌、声音、地点与顺序。
          - 第一份高息贷款账单在一个月后出现。能够按时归还者不进入催收，也可以由本人主动寻找收入更高的工作筹款；阿九未能归还，随后遭遇催收、威胁与向工作、家庭暴露债务的压力，正常生活节奏被持续打乱。
          - 黑暗压迫事件发生在晏林第一次于云顶 KTV 遇见阿九前约一个月；只固定相对时间，不补具体日期。
          - 阿九当时被带走，随后上了一辆面包车；车辆行驶很久后抵达一栋位置不明的二层小楼。路线、城市方位和准确地址均不确认。
      - heading: 场景定性与参与结构
        value: |-
          - 阿九 25 岁；章绍衡和两名现场手下均为成年人。
          - 阿九真实不愿意。她能够喊“不要”表达拒绝，但四肢被约束器具固定，无法离开或使行为停止；口塞使用后，她连清晰发声也做不到。拒绝已经成立，后续沉默不产生同意；本场明确属于黑暗压迫场。
          - 施害方固定为三人：章绍衡一人先实施，两名手下在场等候；章绍衡结束后，两名手下一起继续实施。
          - 章绍衡既是第一个直接实施者，也是后续两人共同侵害的组织者；两名手下分别承担直接实施责任。
          - 两名手下只使用绰号，不补正式姓名：
          - **大黑**：约 165 cm，肥胖厚重，肩背宽、腹部明显，圆方脸、短寸；声音低哑，脚步沉重。
          - **狗子**：约 175 cm，偏瘦，窄长脸，两侧头发较短；语速较快，脚步比大黑轻。
          - 债务只构成章绍衡一方实施控制的杠杆，不构成阿九对三人中任何一人的身体授权。
          - 同一次事件拆成两场连续的黑暗压迫场设计，不新增第二次侵害事件。
      - heading: 已确认事件顺序
        value: >-
          | 阶段／顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |

          | --- | --- | --- | --- | --- |

          | 黑暗压迫场一：章绍衡单独实施 | 固定其直接施害责任与组织位置 |
          两名手下先在场等候，不与章绍衡同时实施；章绍衡独自先实施强制侵害，并以约束器具剥夺阿九的行动与停止能力 |
          不把章绍衡写成只下令、不直接参与的幕后人员；不过程化细写侵害动作 | `PL-S-074`、`PL-S-081` |

          | 场次转交 | 固定章绍衡对第二场的组织责任 | 章绍衡结束自己的直接实施后，对两名手下说“到你们啦，别弄坏了”，由此把现场交给两人 |
          这句话不构成债务减免、报酬、补偿或抵债完成；不增加账务对白 | `PL-S-074`、`PL-S-081` |

          | 黑暗压迫场二：两名手下一起实施 | 固定群体侵害及分别责任 | 大黑与狗子在章绍衡允许和组织下一起继续实施强制侵害 |
          不增加第三名手下，不改成两人先后轮流；不把共同参与写成阿九选择或默认接受的玩法 | `PL-S-074`、`PL-S-081` |

          | 场后联系与转送 | 接通云顶接收线 | 大黑与狗子结束后，章绍衡一侧联系于静，称有“新货”可以送过去；于静确认接收后，阿九被送往云顶
          KTV | 不展开人员转送流程；“新货”是施害方物化话术，不代表叙事认同，也不产生阿九的身体或服务授权 |
          `PL-S-075`、`PL-S-081` |

          | 事件后果延续 | 承接阿九后续的债务耗损与保护感耗损 |
          债务没有获得任何减免并继续存在；约束、强制暴露与多人侵害共同削弱她对遮挡能够换来保护的信任 |
          后续麻木与减少遮挡不是享受受辱，也不能反推出束缚、多人、强迫或债务情趣偏好 | 阿九人物线 |
      - heading: 后续黑暗压迫场设计接口
        value: |-
          - 两场只需保持章绍衡、大黑、狗子可辨认，并交代第一场、转场命令与第二场的连续关系；不要求细拆动作和声音。
          - 拒绝失效固定为“阿九可以喊不要，但因四肢受约束无法使行为停止；口塞使用后无法清晰发声”，不再追加复杂停止信号。
          - 场后直接接入“联系于静—确认接收—送往云顶”，不展开转送流程；身体与心理后果的承接章节仍另行确定。
      - heading: 与云顶 KTV 第十二场衣装的接口
        value: |-
          - [CON-0012｜第十二场｜阿九灰黑做旧牛仔系带装](../云顶KTV会所线/12_阿九.md)可以承接阿九已经不愿再维护遮挡的外在状态，但不得复演本场侵害过程。
          - 第十二场不得加入镣铐、锁链、项圈、惩罚标记或仿伤设计；本场约束器具不得被转化为阿九当前衣装的刺激点。
          - 阿九在第十二场仍保留自行穿脱外层、调整系带、重新遮覆、确认范围、暂停和离开的能力。
      - heading: 终局接口
        value: |-
          - 本单元只固定债务侵害前史；后续先由 [PL-S-086｜有限陈述、保护接入与赌债脱离](../../plotlines/副线/人物/阿九/晏林-有限陈述保护接入与赌债脱离.md)和 [CON-0028｜连续三晚求助与临行回声施工](02_连续三晚求助与临行回声.md)承接阿九个人债务解除与先行离场，再由 [PL-S-082｜非法贷款链断裂、于静收监与云顶关停](../../plotlines/副线/组织/云顶KTV/非法贷款链断裂于静收监与云顶关停.md)和 [CON-0024｜云顶关停与债务控制终止施工](../云顶KTV会所线/云顶关停与债务控制终止.md)完成贷款执行链、云顶场所与于静责任的公共终局。
          - 债务清零不反向改变本单元的强制侵害定性，也不自动完成阿九的治疗、职业恢复、案件参与或关系结局。
      - heading: 不得写偏
        value: |-
          - 不把本场写成催收手段的合理延伸、抵债交易、危险魅力或情色启蒙。
          - 不以身体反应、求生配合、沉默或失去动作能力推定阿九愿意。
          - 不把三名施害者的参与结构扩写成可供消费的猎奇展示；正文必须让阿九的受害后果与施害方责任同等在场。
          - 不用阿九后来对晏林作出的具体选择反向替本场生成同意，也不因本场剥夺她此后针对具体对象重新作出选择的能力。
