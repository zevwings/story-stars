          - 临行亲密发生在个人债务和云顶直接控制已经解除之后，与第三晚崩溃中的 C 档索取分别定性。
      - heading: 对应正式节点
        value: |-
          - [PL-I-037｜连续三晚付费亲密、创伤吐露与边界拒绝](../../plotlines/亲密线/晏林/阿九-连续三晚付费亲密创伤吐露与边界拒绝.md)
          - [PL-S-086｜有限陈述、保护接入与赌债脱离](../../plotlines/副线/人物/阿九/晏林-有限陈述保护接入与赌债脱离.md)
          - [PL-I-040｜债务解除后的主动告别与临行前亲密](../../plotlines/亲密线/晏林/阿九-债务解除后的主动告别与临行前亲密.md)
      - heading: 执行顺序
        value: >-
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 |

          | --- | --- | --- | --- |

          | 第一晚：发现紧绷 | 建立阿九的脚本状态与晏林的询问方式 |
          双方完成分别确认的付费亲密；晏林发现阿九结束后仍等待命令，只让她知道当晚已经结束；阿九泄露“债还没有清” |
          不问赌场、人名与云顶过程；不让第一晚变成完整交代 |

          | 第二晚：确认询问有效 | 让阿九第一次看见拒绝不会带来惩罚 |
          双方再次发生分别确认的付费亲密；晏林在她迟疑时真实停下；事后阿九说出钱是在地下赌场现场签的、账目没有明显减少 |
          不把“可以吗”写成形式口令；她仍可停止聊天 |

          | 第三晚：说出顺序 | 拼出个人经历的最低链条 |
          双方先完成分别确认的付费亲密；事后阿九以“那个人”称呼施害与转送者，说出赌场签贷、催逼、被送入云顶和于静接收规训的顺序 |
          阿九不知道章绍衡姓名；只说本人确定的事实 |

          | 第三晚：崩溃 | 把取证和安抚切开 | 阿九哭泣、伤心、崩溃；晏林停止询问，抱住并安抚她，明确她不需要继续证明什么 |
          不趁崩溃补问身份、侵害过程和证据 |

          | 第三晚：C 档索取被拒绝 | 兑现晏林不会伤害她 | 阿九索取被“糟蹋”，会闹、主动、拉扯或使用受训话术；晏林拒绝执行 C
          档伤害，但不羞辱、不离开，允许她索取拥抱和陪伴 | 请求出现但不执行；不把主动行为写成崩溃状态下的有效伤害授权 |

          | 有限陈述与保护接入 | 让帮助从关系转入正式程序 |
          晏林说明自己不能个人抹债，只能帮助接入正式保护与现实核验；阿九自愿只提供人、地点、顺序和伤害类别 |
          晏林不讯问、不替答、不读取真实记忆；现实材料独立核查 |

          | 个人债务与直接控制终止 | 完成阶段三的人物脱离 | 阿九确认本人不再承担赌场债务与服务抵扣义务，并离开云顶排班和投放 |
          云顶公共终局仍留 `PL-S-082`；不把债务解除写成痊愈 |

          | 临行主动邀约 | 回应第三晚无法自由表达的欲望 | 阿九主动约晏林，告诉他准备去其他地方看看，并明确说出“想要” |
          不由调查方泄露联系资料，不把邀约写成报恩 |

          | 临行酒店亲密 | 完成第一次债务解除后的主动复选 |
          双方明确不付费、不抵债、不交换帮助后共同前往酒店；阿九以“下次见面不知道多久”为由选择当晚亲密 | 不自动调用 C 档，不自动建立稳定回路
          |

          | 允许分别 | 为阶段五或尾声奶茶店留时间距离 | 阿九按本人决定离开当前环境，晏林不安排去向、不要求固定联系 |
          不提前出现奶茶店；后续由 `PL-S-085` 承接 |
      - heading: 三晚的询问边界
        value: |-
          - 晏林可以询问是否愿意、是否继续、是否停下，以及阿九是否愿意说明债务从哪里开始。
          - 他不主动点出章绍衡、于静或罗东海的姓名，不用答案选项替她补完责任人。
          - 阿九可以只说“赌场”“那个人”“接收我的人”；她不知道的姓名和身份由现实材料核验。
          - 第三晚哭泣后只安抚，不再继续问；后续有限陈述必须在她重新稳定并愿意继续时另行成立。
      - heading: 第三晚与临行亲密的回声
        value: >-
          - 第三晚，阿九索取的是熟悉的伤害方式，用来覆盖痛苦、证明自己有用或测试晏林是否最终也会变成“那个人”；晏林拒绝的是在她崩溃时利用这一请求。

          - 临行前，阿九已经没有赌场债务与云顶服务义务，由本人主动约见、说出“想要”并提出去酒店；这是她第一次不靠服务脚本表达当下欲望。

          - 临行亲密仍只是一次自由复选，不等于已经完成普通生活重建；稳定“主人／母狗”私人回路必须等奶茶店生活成立后由 `PL-I-039`
          重新确认。
      - heading: 不得写偏
        value: |-
          - 不把性爱写成取证工具，不把温柔写成审讯技巧。
          - 不把三晚付费、阿九主动或身体回应写成债务控制已经不存在。
          - 不让晏林在阿九崩溃中继续追问或执行 C 档伤害。
          - 不让有限陈述直接证明章绍衡姓名、罗东海能力或顾清言—章绍衡完整往来。
          - 不把帮助、债务解除和临行亲密写成一项交换。
          - 不把临行亲密直接升级为恋爱、长期伴侣、稳定联系或奶茶店终局。
      - heading: 当前结论
        value: 阿九的阶段三变化按“**连续三晚分别确认 → 事后逐层吐露 → 第三晚崩溃 → C 档索取被拒绝并获得安抚 → 有限陈述与现实核验 →
          个人债务和云顶直接控制终止 → 主动临行邀约与非付费亲密 →
          去其他地方重新看生活**”执行。奶茶店经营、普通重逢与稳定私人回路仍留阶段五或尾声。
