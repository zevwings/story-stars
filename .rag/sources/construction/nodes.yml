    summary: 这是阿九在本轮云顶 KTV
      集中段的唯一衣装。它不走原先预留的黑金礼服、深酒红贴身裙或完整蕾色情趣内层，而以一套面积很小、结构直接的灰黑做旧牛仔装集中展示胸腰比例、完整腰腹、胯侧和裸腿。
