    sections:
      - heading: 场次作用
        value: |-
          本场用一件结构极简的白色细吊带贴身短裙，集中呈现童颜最重要的身体曲线：清甜显小的脸、小骨架与窄肩之下，是明显丰满的成年胸型、自然收束而带有柔软感的腰腹、圆润臀线和由超短裙完整放出的裸腿。
          反差不来自学生身份、伤痕、恐惧或未成年化造型。她首次登场已经成年；白裙只让已经成立的成年身体比例更直接，不使用校服、长袜、发带、书包或稚气角色语言强化“年幼”印象。
