          | 关停后分流 | 把公共终局交给各人物后果线 | 小鱼儿、悠悠、悦悦进入职业转向；阿九主动完成告别共餐与一次非交易亲密后离开 | 阿九未来城市、职业、住处、关系与是否重逢保持开放 | `PL-S-084`、`PL-I-062`、`PL-I-063` |
