          - **参与者**：晏林、王诗悦。
          - **剧情接口**：承接 `PL-I-094` 的单独关系入口与 `PL-S-092` 的个人显影。
          - **排除项**：不把单人接触写成固定包养、真实雇佣或后续优先权。
      - heading: 衣装快照
        value: |-
          - 冷灰蓝合身卷袖衬衣，领口开放两枚视觉扣位并由隐藏结构稳定。
          - 炭灰高腰包臀超短裙，短开衩、同色安全裤；窄黑腰带配小银扣。
          - 裸腿，黑色尖头约 7—8 cm 中高跟；窄银框／无框眼镜、无真实信息工牌和薄黑文件夹。
          - 深色大波浪、冷调成年妆面。眼镜、工牌和文件夹均可独立拆除。
      - heading: 场景执行
        value: |-
          1. 可穿完整主体通过公共区域，不另设夸张外层。
          2. 先以文件夹、工牌和眼镜建立主题，再按王诗悦自己的节奏逐件卸下。
          3. 退出主题以摘工牌、放下文件夹或切回本人声线中的任一清楚动作为准。
      - heading: 执行边界
        value: |-
          - 这是成年人私域职业幻想，不是现实职员、秘书或上下级关系。
          - 工牌不得出现真实机构、姓名与职位；挂绳使用快拆结构。
          - 职业脚本、穿着、拍摄、亲密和后续联系分别确认。
