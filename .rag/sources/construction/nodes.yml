    sections:
      - heading: 使用边界
        value: |-
          - 本页不记录生命周期状态；当前状态只从 `story/construction/_status/` 读取。
          - 绑定章纲时可以补足日期、地点、记录字段、对白与动作，但不得改变对应正式节点已经确认的结果与边界。
          - 多节点共享事件只执行一次；下列分节用于保留各线路必须承接的职责，不代表重复发生同一场景。
      - heading: PL-S-262—PL-S-264｜私域对象更换、顾清言暂留与云梦号公开同行入口
        value: |-
          - **正式节点**：[PL-S-262｜私域对象更换与第一次交易关系成立](../../plotlines/副线/人物/楚辞/私域对象更换与第一次交易关系成立.md)、[PL-S-263｜顾清言暂留楚辞并建立训练控制位置](../../plotlines/副线/人物/楚辞/顾清言暂留楚辞并建立训练控制位置.md)、[PL-S-264｜楚辞取得云梦号公开同行入口](../../plotlines/副线/人物/楚辞/楚辞取得云梦号公开同行入口.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 秘密断链后二至三周 | 建立意外交易入口 | 观察确认顾清言恢复自主且未出现齐心察觉迹象后，万安第一次把楚辞安排给一位不具名老板；原定对象临时有事未到，顾清言提出由晏林承接 | 原订单不自动授权换人；楚辞针对晏林重新选择；不得补写原定对象身份或双方后续私人关系；不得把观察期压缩掉 | `PL-S-125`、万安线 |
          | 当晚 | 完成第一次交易性关系 | 楚辞选择留下，与晏林完成当次关系；关系后可自然进入睡眠与入梦接口 | 当次选择成立，利益背景不另设道德审判；楚辞明确拒绝后不得强制入梦 | `PL-S-194、PL-S-195`、`PL-S-101` |
          | 交易后 | 让顾清言识别两人的后续可能 | 顾清言分别问晏林是否喜欢、楚辞是否愿意再见；两边均给出肯定方向后，以自己看上为名暂留她 | 顾清言仍按客户维护、资源保留与控场逻辑行动，不写成无私保护 | `PL-S-130` |
          | 暂留后三至四周 | 建立楚辞的场面能力与服从惯性 | 顾清言完成衣装、礼仪、识人、避险和应答训练 | 训练、住宿和职业安排不产生身体授权；普通推荐不得提前到训练开始前 | `PL-S-243` |
          | 登船 | 完成公开同行落位 | 楚辞以顾清言名义上的女人登船 | 公开身份不授权观看、触碰、加入或未来关系 | `PL-I-083` |
      - heading: PL-S-124｜普通推荐与云梦号公开登船入口
        value: |-
          - **正式节点**：[PL-S-124｜普通推荐与云梦号公开登船入口](../../plotlines/副线/人物/顾清言/普通推荐与云梦号公开登船入口.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 楚辞训练接近结束时 | 建立晏林公开登船资格 | 顾清言以活动组织者的普通推荐权，把晏林列入公开慈善来宾名单 | 必须继承秘密断链、二至三周观察期及楚辞进入训练；野人不赞助，不写管理局派遣或调查任务 | `PL-S-125`、`PL-S-243` |
          | 推荐后一至两周 | 留出乔宁私宴入口 | 乔宁以万安项目参与者身份进入思语承接的行业品牌私宴或项目庆功宴 | 不由顾清言专门引荐；乔宁关系与入梦由 `PL-I-042`、`PL-S-112` 承接 | `PL-I-042`、`PL-S-112` |
          | 登船 | 完成公开身份落位 | 晏林以野人联合创始人、青年创业者和普通慈善来宾身份登船 | 普通名单不产生私人娱乐区、闭门会议或高权限空间准入 | `PL-M-033、PL-M-035、PL-M-034`、`PL-I-083` |
      - heading: PL-M-033、PL-M-035、PL-M-034｜云梦号六人会谈与跨境运营重组
        value: |-
          - **正式节点**：[PL-M-033｜六人必要决策席位](../../plotlines/主线/组织/反派/六人必要决策席位.md)、[PL-M-034｜三方跨境分轴控制](../../plotlines/主线/组织/反派/三方跨境分轴控制.md)、[PL-M-035｜公益、邮轮费用和私人活动边界隔离](../../plotlines/主线/组织/反派/公益、邮轮费用和私人活动边界隔离.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 第一至第五日 | 维持正常慈善航程与会议前的公开掩护 | 六名决策者分别参加必要公开活动；顾清言不发生星辰之印排异发作，也不需要晏林再次止损 | 不让公开公益、私人娱乐和闭门议题互相替代；航程不承载顾清言解印前置 | `PL-I-083`、`PL-I-026`、`PL-S-124` |
          | 第六日前后 | 完成六人闭门会谈 | 会议空间与公开活动、高权限娱乐区分离；只确认最少重组条款；黄锦一以兔子快递创始人、董事长与明面控制人身份取得独立席位，并实际知道秘密专送链用途 | 不增加第七名参会者；黄锦一的席位不来自朱岑郁伴侣身份或私人活动；朱岑郁仍是兔子快递幕后实控人 | `PL-S-187、PL-S-184、PL-S-185、PL-S-186` |
          | 会谈后 | 让重组进入实际运营 | 兔子快递秘密专送链正式接管至少一次人员或异常物资交接；黄锦一开放必要公开权限，朱岑郁通过少数知情高层、金洲子公司负责人和固定专送人员完成具体命令与调度 | 朱岑郁不在兔子快递任职；不把人员藏入国际快件越境；普通快递业务与员工不自动涉案 | `PL-M-034`、`PL-M-021、PL-M-022` |
          | 会谈后 | 形成后续现实记录入口 | 进出时间、公开缺席、兔子快递异常人员与车辆往来及必要运营变化留下可供后续核验的方向 | 顾清言、楚辞、赵梦娜只能掌握各自亲历，不能还原会议全貌；运输痕迹不能显示每次具体内容 | `PL-M-020、PL-M-021、PL-M-022、PL-M-024`、`PL-M-036、PL-M-037、PL-M-038` |
      - heading: PL-I-083—PL-I-086｜航程限定关系、楚辞自主有限加入、职业承接与赵梦娜岸上回流关系
        value: |-
          - **正式节点**：[PL-I-083｜赵梦娜与晏林建立航程限定关系](../../plotlines/亲密线/晏林/赵梦娜与晏林建立航程限定关系.md)、[PL-I-084｜楚辞脱离原订单后自主有限加入](../../plotlines/亲密线/晏林/楚辞脱离原订单后自主有限加入.md)、[PL-I-085｜赵梦娜提出楚辞职业承接入口](../../plotlines/亲密线/晏林/赵梦娜提出楚辞职业承接入口.md)、[PL-I-086｜赵梦娜靠岸后职业／档期回流伴侣关系成立](../../plotlines/亲密线/晏林/赵梦娜靠岸后保留低频重逢.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 第一日 | 完成公开身份落位 | 晏林以独立慈善来宾登船；楚辞以顾清言名义上的女人同行 | 公开名单不产生私人娱乐或会议权限 | `PL-S-243`、`PL-S-124` |
          | 第二日 | 启动航程限定关系 | 赵梦娜完成公开活动后主动邀舞，与晏林进入第一次私人相处 | 不以角色、资源或长期承诺交换 | 赵梦娜人物线 |
          | 第三日 | 建立高频关系与楚辞醋意 | 赵梦娜与晏林公开同行并继续逐次确认；楚辞开始辨认自己的欲望 | 不让十余次兑现同质重复 | 亲密专项 |
          | 第四日 | 把楚辞带入平等公开相处 | 赵梦娜向顾清言借楚辞两日，只取得公开同行安排 | 顾清言不能替楚辞授权私人场景 | `PL-S-243` |
          | 第五日 | 完成知情观看、有限加入与范围停止 | 楚辞知道可以离开后自愿留下，逐项确认有限加入；已有会所前史不替代多人场授权 | 不形成女女关系、稳定三人关系或未来权限 | `PL-I-084` |
          | 第六日 | 让关系线与主线在同一航程错层推进 | 赵梦娜与晏林继续航程关系；楚辞与顾清言只能观察公开活动和调度异常 | 不让亲密自动产出闭门会谈情报 | `PL-M-033、PL-M-035、PL-M-034`、`PL-I-026` |
          | 第七日 | 留下航程外接口并完成靠岸分流 | 赵梦娜确认对晏林满意、主动提出以后常联系，并承诺帮助楚辞核查旧约；楚辞先回到自己的生活再分别决定职业与私人后续 | 船上只留下接口，不提前完成第二层；人情因果可承认，身体参与不是签约价格 | `PL-I-086`、`PL-S-225、PL-S-223、PL-S-224` |
          | 靠岸后真实分离 | 切断航程关系的持续效力 | 赵梦娜与晏林分别回到职业和个人生活，期间不按航程频率自动联系或兑现 | 不把“以后常联系”当自动续约，不讨论赵梦娜的外部私人关系 | `PL-I-086` |
          | 岸上独立重逢 | 建立第二层职业／档期回流关系 | 赵梦娜在工作行程允许且本人想念时主动联系，或明确接受重新提出的见面；双方确认长期可持续但非共同生活的第二层位置 | 不固定排期、不完整内圈知情、不进入第一层候补；回归可只有普通相处 | `PL-I-086` |
      - heading: PL-S-225、PL-S-223、PL-S-224｜旧约解除、梦娜工作室承接与职业复位
        value: |-
          - **正式节点**：[PL-S-223｜楚辞旧约解除](../../plotlines/副线/人物/楚辞/楚辞旧约解除.md)、[PL-S-224｜梦娜工作室承接](../../plotlines/副线/人物/楚辞/梦娜工作室承接.md)、[PL-S-225｜职业复位](../../plotlines/副线/人物/楚辞/职业复位.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 靠岸前 | 建立帮助接口 | 赵梦娜向晏林承诺会护住楚辞，并向楚辞留下独立联系方式 | 不当场要求楚辞签约或承诺未来私人关系 | `PL-I-083` |
          | 靠岸后 | 恢复独立选择环境 | 楚辞先回到原有住所和生活，再决定是否联系梦娜工作室 | 不由顾清言、晏林或赵梦娜替她接受条件 | `PL-I-080、PL-I-081` |
          | 合同核查 | 显影现实退出成本 | 独立核查万安旧约、剩余期限与违约责任 | 不固定尚未确认的金额或合同全文 | 楚辞人物线 |
          | 解约协商 | 切断旧团队持续调度 | 楚辞本人参与谈判，工作室提供行业与法律接口 | 不把赵梦娜写成一句话封杀或无成本解约 |
          | 新约审阅 | 验证职业与私人分离 | 条款明确垫付回收上限、拒绝权与私人关系不挂钩 | 不以身体、陪侍或未来三人关系抵扣成本 |
          | 正式签入 | 建立职业复位 | 楚辞自愿签入梦娜工作室，恢复正常试镜与拍摄入口 | 不保证角色、爆红或全部现实后果立即消失 |
      - heading: PL-I-081、PL-I-080｜楚辞安全拒绝、第一次非交易身体关系与职业／档期回流伴侣关系
        value: |-
          - **正式节点**：[PL-I-081｜楚辞职业复位后的安全拒绝与第一次非交易双人身体关系](../../plotlines/亲密线/晏林/楚辞与晏林关系确认后的第一次身体兑现.md)、[PL-I-080｜楚辞职业／档期回流伴侣关系成立](../../plotlines/亲密线/晏林/楚辞与晏林的长期关系确认.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 靠岸后 | 切断邮轮安排的持续效力 | 楚辞先回到自己的住所、工作和生活，不跟晏林离开；职业转约与私人联系分别决定 | 顾清言和赵梦娜不替她安排后续，工作室条件不绑定身体关系 | `PL-I-083`、`PL-S-225、PL-S-223、PL-S-224` |
          | 数日后 | 验证欲望在脱离环境后仍成立 | 楚辞通过晏林本人留下的联系方式主动提出普通约会 | 不由职业推荐、保护或顾清言传话代替主动联系 | 赵梦娜职业接口 |
          | 职业复位后 | 建立拒绝安全感 | 楚辞至少一次明确拒绝留下或拒绝推进，晏林正常接受 | 拒绝不撤回合同、合理保护或联系 | `PL-I-081` |
          | 另一独立事件 | 第一次非交易双人身体关系 | 楚辞在非工作、非应酬、非资源交换的私人时间主动提出或明确接受，并至少一次提出要求、纠正节奏或拒绝推进 | 本次不确认第二层，不生成未来留宿、身体或多人权限 | `PL-I-081` |
          | 真实职业间隔 | 证明关系脱离邮轮与订单环境 | 楚辞进入拍摄、试镜、宣传或正常工作节律，双方不按邮轮频率自动续接 | 不以梦娜工作室转约替代私人选择 | `PL-I-080` |
          | 第二层确认前 | 完成位置与必要事实告知 | 晏林说明楚辞属于第二层、不进入共同生活与第一层结构；楚辞知道直接相关事实 | 不泄露其他伴侣隐私或完整关系名单，不讨论楚辞的外部私人关系 | `PL-M-046、PL-M-044、PL-M-047、PL-M-045` |
          | 主动重逢 | 建立职业／档期回流伴侣关系 | 楚辞经职业间隔后主动联系，并确认有稳定预期、由空档和本人思念推动的第二层关系 | 不固定排期、不写成方便情人或第一层候补 | `PL-I-080` |
