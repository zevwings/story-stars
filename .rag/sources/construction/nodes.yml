          | 有限信任形成后 | 让她第一次把受骗与责任放进同一段自述 | 她讲大学觉醒、未登记、外围任务包装和发现后台把柄的过程，并承认后来仍主动接过部分订单 | 不固定完整对白；不在此交代全部订单，不把倾诉写成求免责或用亲密换保护 | `PL-I-022`、`PL-S-044` |
