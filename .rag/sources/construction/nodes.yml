          - 终局按“付费结束—关停后三人组局—梦露邀约—晏林买单—梦露在亲密开场前明确不收费—关系可间断继续”推进，不需要把所有后续单人、双人和三人组合逐一写完。
          - “不收你钱，去不去”只在第一次私人复选的亲密开场前说一次，以梦露自然、大方的口吻完成关系切换；不再补一轮交易定义或边界宣讲。
          - 若需要表现组合差异，优先通过谁主动联系、谁决定地点、谁先确认女性互动与谁提前离场来区分，不依赖更重的身体动作。
          - 梦露婚房场只承担她的风险偏好与隐瞒责任，不承担丈夫发现、婚姻摊牌或家庭线推进。
      - heading: 不得写偏
        value: |-
          - 不把停止商业服务写成三人必须免费补偿晏林。
          - 不把三人吐槽收入降低写成向晏林索取补偿，也不把晏林买单写成隐性服务费用。
          - 不以梦露一人的邀请替小娜或月月确认，也不以任何人的到场替女性互动授权。
          - 不把丈夫不知情改写成默许、开放婚姻或第三方情趣。
