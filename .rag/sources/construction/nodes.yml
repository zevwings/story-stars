  - id: CON-0023
    truth_level: construction
    name: 阿九债务侵害前史施工
    package: 阿九债务侵害线
    status: active
    plotline_owner: 副线 / 人物 / 章绍衡
    plotline_interfaces: PL-S-074、PL-S-081
    scope: 未分章施工
