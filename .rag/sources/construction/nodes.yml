          | 店级责任落位 | 固定于静能做、能知和不能知的边界 | 于静负责接收、训练、排班与服务投放，并承担阿九脚本化服从训练的直接责任 | 于静不参与顾清言—章绍衡的联系、目标决定、结算或分利，不掌握两人往来的直接证据 | `PL-S-130` |
          | 收监与关停 | 结束固定场所及店级控制链 | 于静收监，云顶实体场地关停，旧接收、排班、规训和服务投放停止 | 只交代结果，不写具体事件；关停不替上层责任人免责 | `PL-M-036、PL-M-037、PL-M-038` |
          | 关停后分流 | 把场所终局交给各人物后果线 | 小鱼儿、悠悠、悦悦回到各自原有生活，不建立共同职业网络；与晏林的付费关系结束，私人关系另行确认。阿九主动完成告别共餐与一次非交易亲密后离开 | 三人的其他商业选择各自独立；阿九未来城市、职业、住处、关系与是否重逢保持开放 | `PL-I-038`、`PL-I-062`、`PL-I-063` |
      - heading: 章节落点建议
        value: |-
          - 关停决定及执行安排先形成，再把阿九个人脱离交给 `CON-0028`；收到 `PL-S-179` 完成结果后，本页才继续兑现于静收监与实体关停。
