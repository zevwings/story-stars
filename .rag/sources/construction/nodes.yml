          - **正式节点**：[PL-S-159｜首次市场任务与长期匿名联系结构确认](../../plotlines/副线/人物/白玥/首次市场任务与长期匿名联系结构确认.md)、[PL-S-161｜长期匿名联系中止与关联身份切割](../../plotlines/副线/组织/裴家/外围账户和订单接口切割.md)、[PL-S-162｜对白玥剪裁放料与甩锅](../../plotlines/副线/组织/裴家/对白玥剪裁放料与甩锅.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 前史辨认 | 区分两种接触结构 | 白玥第一次在暗色星辰中的独立服务主动接下市场任务；此后改用公开加密工具中的专用匿名联系人继续自愿交易 | 白玥可议价、拒绝和停止接单；上游隐瞒真实需求方不等于强制派单；不虚构统一后台 | `PL-S-159` |
          | 白玥停止响应后 | 接收执行端不稳定信号 | 专用匿名联系人只能从任务失败和白玥停止回应确认执行端失联 | 不出现管理局抓捕或公开转移表象；不让联系人由该结果确认白玥入案、管理局介入或晏林立场 | `PL-S-151—PL-S-155`、`PL-S-159` |
          | 异常聚合后 | 降低长期联系连续性 | 裴家一侧中止专用联系人，更换或停用中间人和相关市场身份，并切断继续交易、提供新单或联系白玥的现实接口 | 只写具体联系人、中间人和市场身份；不把黑市或暗色星辰写成行动主体 | `PL-S-161` |
          | 切割生效 | 形成真实证据缺口 | 至少一段联系、身份或资金关联无法当场完整恢复 | 切割部分成功但不消灭白玥本人的行为痕迹，也不直接证明裴家身份 | `PL-S-161` |
          | 剪裁放料 | 把可见责任压向执行者 | 具体联系人、中间人或关联市场身份选择性释放白玥真实但不完整的接单、收款与施为记录 | 真实局部行为不等于完整责任链；不能由此指向裴家，裴家责任须由其他现实证据独立闭合 | `PL-S-156—PL-S-158`、`PL-S-162`、`PL-M-049` |
