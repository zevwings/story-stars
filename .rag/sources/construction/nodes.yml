        value: |-
          每次调用只取一至两个：
          1. 高位暗扣解开以前，黑色长西装只在领口放出一线暗红蕾丝。
          2. 西装前摆向两侧分开后，红蕾丝主体与暗红袜口本来就在里面，不需要打开换装包。
          3. 黑色吊袜带从深酒红主体下缘连接到暗红袜口，把两段红色压成清楚的层次。
          4. 酒水和歌单仍留在桌面上，包厢消费完成以后，是否离开才成为下一项单独选择。
          5. 事后西装重新落回她肩上，衣装展示已经结束，接下来的哭泣与拥抱不再属于服务流程。
      - heading: 与前两晚的区分
        value: |-
          - 第一晚以灰黑做旧牛仔、毛边、系带和裸腿成立；第三晚改用精细蕾丝、透肤网纱、吊袜带和暗红袜面，不复用粗粝牛仔。
          - 第二晚以白衬衣、纯黑百褶超短裙和薄黑丝袜形成黑白夜场轮廓；第三晚直接在西装内预穿完整红蕾丝情趣主体，不保留白衬衣或短裙中间层。
          - 第三晚不携带黑金 KTV 外装和私密换装包，也不把衣装切换接到崩溃后的 C 档索取上。
      - heading: 执行边界
        value: |-
          - 不把云顶训练出的准备、展示和整理能力写成阿九天生热爱债务性服务，也不因她当晚真实参与便洗去排班、投放与规训压力。
          - 不把酒水消费写成灌醉、意识不清或概括性授权；饮酒、衣装展示、包厢内有限亲密、离场和后续亲密分别确认。
          - 不让红蕾丝、吊袜带、主动展示或此前亲密证明崩溃后的 C 档伤害请求有效；崩溃后不得执行疼痛、束缚、扮演式强制或衣装破坏升级。
          - 不把亲密、吐露、安抚、保护接入和后续帮助合并成一项交换，不用陪伴换取完整陈述。
      - heading: 当前结论
        value: |-
          云顶第 12 次单人亲密消费场、即阿九第三晚的衣装锁定为“**黑色长西装＋深酒红蕾丝连体／软束腰主体＋暗红蕾丝或细网大腿袜＋黑色吊袜带＋黑色尖头高跟鞋**”。红蕾丝主体与袜组在到场前已经穿好，公共移动只靠黑色长西装完成遮覆；进入包厢后解开、敞开或脱下西装即可进入情趣服务状态，不再携带或现场更换黑金外装。
          本场必须先完成真实的开包、酒水／饮品、点歌和陪伴消费，允许在包厢内发生另行确认的有限亲密；是否离场及后续付费亲密另行决定。衣装与职业训练全部发生在事后吐露和崩溃之前，后段只承接停止追问、拒绝 C 档伤害与普通安抚，不追加换装、撕毁或刺激升级。
  - id: CON-0044
    truth_level: construction
    name: 境外园区接收、强迫用工与人员分层施工
    package: 反派控制与责任链
    status: active
    plotline_owner: 副线 / 组织 / 境外电诈园区
    plotline_interfaces: PL-S-241、PL-S-242、PL-S-228、PL-S-229
    scope: 阶段四境外交接后至华靖正式潜伏前
    transition: ""
    note: 固定不同公开入口汇入主园区、退出权被剥夺、技术岗与电销／线上转化岗分工、周博进入基层执行位置及高价值对象转入实验筛选方向；不承接阶段五处置升级和逃离。
    summary: "- 本页从 PL-S-049、PL-M-020、PL-M-021 已经形成招聘筛选、合法出境与首次境外交接之后开始，不重复施工境内招聘、合法手续或首次交接。"
    headings:
      - 使用边界
      - 对应正式节点
      - 执行顺序
      - 不得写偏
    content_indexed: true
    source_file: story/construction/反派控制与责任链/04_境外园区接收强迫用工与人员分层.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 使用边界
        value: |-
          - 本页从 `PL-S-049、PL-M-020、PL-M-021` 已经形成招聘筛选、合法出境与首次境外交接之后开始，不重复施工境内招聘、合法手续或首次交接。
          - 所有进入园区、被限制退出、进入基层执行位置或被另行筛选的主体均为成年人。
          - 本页只呈现去向改写、退出失败、责任位置变化和筛选结果，不展开可模仿的诈骗、拘禁、看管、转运或规避调查方法。
          - 周博最初受控与后来实际实施侵害分别评价；受控前史不自动免责，基层权限也不等于完全自由。
          - 本页不承接阶段五调查压力、处置升级、逃离、材料移交、官方行动或裁判；这些变化由 `CON-0041` 继续施工。
      - heading: 对应正式节点
        value: |-
          - [PL-S-241｜公开去向被改写为主园区接收](../../plotlines/副线/组织/境外电诈园区/公开去向被改写为主园区接收.md)
          - [PL-S-242｜退出权被剥夺与强迫用工成立](../../plotlines/副线/组织/境外电诈园区/退出权被剥夺与强迫用工成立.md)
          - [PL-S-228｜周博进入基层执行位置](../../plotlines/副线/组织/境外电诈园区/受控人员进入基层执行位置.md)
          - [PL-S-229｜高价值对象被另行筛出](../../plotlines/副线/组织/境外电诈园区/高价值对象被另行筛出.md)
      - heading: 执行顺序
        value: |-
          | 顺序 | 场景功能 | 必须发生 | 执行边界 |
          | --- | --- | --- | --- |
          | 不同入口汇入 | 建立主园区共同接收节点 | 至少两种不同来源的成年人正常进入金洲后，由兔子快递金洲特殊专送人员从原定岗位、旅行或安置行程中改送同一主园区 | 不把所有合法出境者都写成园区受害者；合法文件与本人对园区接收的有效同意分别判断；不把人员藏入国际快件越境 |
          | 明确退出失败 | 使强迫用工独立成立 | 至少一人明确要求退出、联系外界或返回原定去向，现场仍限制其通讯、行动或离开 | 工作参与、通讯限制和行动限制分别呈现；不以此前签约或自愿过境冲淡退出权被剥夺 |
          | 技术岗与电销岗显影 | 建立园区强迫劳动的主要分工 | 园区以技术岗维护诈骗平台、账号、通信和数据支撑，以电销／线上转化岗通过电话或网络聊天接触目标、维持关系并推动资金投入；岗位待遇、住宿和管理权限按产出分层 | 只表现流水线分工、业绩压力、强迫劳动和等级差异；不写可直接模仿的诈骗话术、平台技术指令、资金转移或规避调查方法，也不照搬现实影视作品的角色和桥段 |
          | 周博进入基层执行位置 | 建立受控处境与实际行为责任并存的位置 | 周博取得有限执行权限，并实际参与看管、押送、限制行动或协助惩戒；他始终以自身生存和待遇为第一原则 | 至少落实一种具体侵害；不设置主动保护他人、道德觉醒或预先免责 |
          | 高价值对象另行筛出 | 接通园区与裴家实验筛选接口 | 园区按照裴家医院提供的筛选方向，将少数具有身体、精神或契约价值的人员从普通用工体系中另行标记并转入实验接收 | 不制造园区与医院的人员争夺；不把所有园区人员都写成实验对象；园区只知道人员被另行接收，不自动掌握实验全貌 |
          | 阶段四交接 | 把稳定园区结构交给后续风险升级 | 普通受控者、基层执行者和待筛选对象三类位置均已成立，成为后续调查压力和逃离窗口的前置 | 不在本页提前制造处置升级、逃离成功、材料回传或官方查封 |
      - heading: 不得写偏
        value: |-
          - 不把招聘欺骗、合法出境、境外交接、园区拘禁和人体实验合并成同一个行为或同一主体责任。
          - 不以合同、护照、旅行安排或曾经同意工作推定持续拘禁和改派有效。
          - 不把周博统一写成纯粹受害者或纯粹经营者。
          - 不让园区经营责任、齐心的去向决定责任和裴家实验责任互相吸收。
  - id: CON-0045
    truth_level: construction
    name: 晏林诱饵探查与裴家实验中心行动
    package: 反派控制与责任链
    status: active
    plotline_owner: 主线 / 人物 / 晏林
    plotline_interfaces: PL-M-050、PL-S-184—PL-S-186
    scope: 阶段五八接口验证后至裴朱分轴责任闭合前
    transition: ""
    note: 固定真实演唱会旅行、旅游端有限价值判断、两次改道、异常复筛、知心越阈、现实定位、裴怀安现场控制与姜禾获救的顺序。
    summary: "- 时间位于 PL-M-018 八接口验证完成后、PL-M-037 跨境园区结果闭合前，整体持续数小时至一夜。"
    headings:
      - 使用范围
      - 对应正式节点
      - 执行顺序
      - 节奏锚点
    content_indexed: true
    source_file: story/construction/反派控制与责任链/05_晏林诱饵探查与裴家实验中心行动.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 使用范围
        value: |-
          - 时间位于 `PL-M-018` 八接口验证完成后、`PL-M-037` 跨境园区结果闭合前，整体持续数小时至一夜。
          - 穆珂宜只通过既有正式事实提供本人能够确认的旅行入口、接待变化与路线片段，本施工单元保持她的人物设定不变。
          - 晏林承担的是经风险评估和持续同意的价值诱饵角色；外围跟随、现实记录、定位、进入与物理控制由管理局及当地具备权限的合作系统承担。
          - 孙雅琪知道旅行附带风险探查和预定联络接口，以“知心”收到的严重危险时点启动组织联络。
      - heading: 对应正式节点
        value: |-
          - [PL-M-050｜晏林诱饵式探查锁定裴家实验中心](../../plotlines/主线/人物/晏林/晏林诱饵式探查锁定裴家实验中心.md)
          - [PL-S-184｜实验对象筛选标准与接收决定](../../plotlines/副线/组织/裴家/境内人员筛选转送.md)
          - [PL-S-185｜境外药剂试制与人体实验中心运行](../../plotlines/副线/组织/裴家/境外实验中心运行.md)
          - [PL-S-186｜幸存者、限定记忆与现实记录交叉验证](../../plotlines/副线/组织/裴家/幸存者与实验结果交叉验证.md)
      - heading: 执行顺序
        value: |-
          | 顺序 | 场景功能 | 必须发生 | 聚焦范围 |
          | --- | --- | --- | --- |
          | 真实行程成立 | 让生活线与行动线自然重合 | 孙雅琪在金洲举行正式演唱会，晏林确实观看演出并预留短途旅行；管理局提前完成风险评估、联络节律和介入门槛 | 演唱会保持孙雅琪的独立职业意义，探查从正常旅行段开始 |
          | 进入旧路线方向 | 给旅游端一次主动发现机会 | 晏林按正常游客方式进入穆珂宜既有信息指向的线路，外围保护以现实方式保持距离 | 晏林维持正常游客行为，不承担跟踪或取证职责 |
          | 有限价值判断 | 建立抓捕的直接因果 | 旅游端契约者只能模糊估量晏林大概率是契约者；现场人员再结合独自出行、表面安保和控制成本，判断值得送往医院复筛 | 最高结论是“疑似契约者、值得复筛” |
          | 两次改道与跟随压缩 | 让预案短时越过安全边界 | 第一次转送后出现临时二次改道或接收点切换；外围跟随保住最后可靠位置、车辆或接收方向，把最终建筑压缩到可快速核验范围 | 悬念来自具体接收点尚未确认，现实追踪链持续存在 |
          | 异常复筛 | 促使裴怀安亲自出现 | 常规控制型药剂或精神试探出现分层、阻滞、延迟或互相矛盾的异常结果；裴怀安暂停常规处置并亲自接手 | 现场只确认异常样本，双子星、四权柄与准确精神之海等级继续保密 |
          | 知心越阈 | 明确行动从探查滑入严重危险 | 严重处置已经扰动晏林的生命状态或精神之海核心边界，孙雅琪收到危险发生、发展和持续状态 | 孙雅琪立即按预案联系管理局，示警时点进入现实信息交叉 |
          | 现实定位与进入 | 完成组织接力 | 管理局把知心时点与最后位置、车辆、接收方向及当地合法实时信息交叉；当地行动人员确定建筑并进入 | 现实行动系统承担定位、进入、物理控制和医疗救援 |
          | 活现场收束 | 同时关闭正在发生的侵害与打开证据链 | 裴怀安被控制，晏林、“金康-17”姜禾及少量既有对象获救；当次交接、药剂、设备、记录和人员状态完成保全 | 晏林证明晚期旅游转送与当次实验，姜禾证明既有接收、编号和控制向实验，后续由多源材料闭合完整责任 |
      - heading: 节奏锚点
        value: |-
          - 演唱会与旅行先保持轻松、真实的生活质感，价值判断发生在普通旅游秩序中。
          - 第一次转送建立计划仍可控的判断，二次改道快速缩短干预窗口。
          - 裴怀安亲自出现是样本价值升级的结果；知心示警是严重危险已经发生的结果。
          - 救援结束后立即转入医疗保护与现场保全，责任链在后续 `PL-S-186` 和 `PL-M-049` 中完成交叉闭合。
  - id: CON-0046
    truth_level: construction
    name: 锦云山结契与最低必要揭密楔子施工
    package: 晏林双子星与管理局线
    status: active
    plotline_owner: 副线 / 人物 / 晏林
    plotline_interfaces: PL-S-303
    scope: 楔子；未绑定具体章节
    transition: ""
    note: 固定楔子止于第一次最低必要揭密与两人决定接受后续评估；不提前完成登记、训练或星辰之桥。
    summary: 把两人的公共观星、分别结契、现实异常、公开救援接触和第一次最低必要揭密连成一条可演出的前史链，楔子结束于两人决定接受后续评估。
    headings:
      - 执行目标
      - 场景顺序
      - 最低必要揭密内容
      - 视角与信息边界
      - 固定终点
    content_indexed: true
    source_file: story/construction/晏林双子星与管理局线/03_锦云山结契与最低必要揭密楔子.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 执行目标
        value: 把两人的公共观星、分别结契、现实异常、公开救援接触和第一次最低必要揭密连成一条可演出的前史链，楔子结束于两人决定接受后续评估。
      - heading: 场景顺序
        value: |-
          1. 两人以已经成立的伴侣关系共同夜爬锦云山，现实生活和看日出安排先于异能显影。
          2. 黎明前仍可目视真实星空时，两人分别完成星辰回应；晏林的双子星两契同立，孙雅琪完成自己的回应。
          3. 两人处理各自无法解释的眩晕、感知错位或精神节律异常，先以伴侣之间的观察与互相确认承接，不急于解释世界观。
          4. 晴夜轮值以景区救援、天文活动协作或公共安全身份处理保暖、休息、下山和普通风险排查。
          5. 轮值协作者在近距离观察到疑似契约者迹象后，建立后续异常评估联系；不在公共现场揭密或强制检测。
          6. 管理局在非公开环境进行第一次最低必要揭密，两人决定接受后续评估。
      - heading: 最低必要揭密内容
        value: |-
          - 说明他们经历的异常可能不是普通疾病或单纯幻觉；
          - 说明世界上存在需要保密的星辰契约现象；
          - 说明管理局可提供确认、健康评估、训练、保密和申诉渠道；
          - 说明完成登记会使星辰身份进入官方星表，并带来真实的信息代价；
          - 说明拒绝登记不自动构成犯罪，但现实伤害、外泄和非法控制仍按风险处置。
      - heading: 视角与信息边界
        value: |-
          - 场景按单一视角组织；两人的感受只能通过各自观察、表达和有限传念显现，不使用上帝视角解释星辰回应的客观意志。
          - 轮值人员只能依据现实症状、近距离同类模糊感和当次公开提示行动，不能得知晏林完整双子星结构、四项权柄或孙雅琪具体权柄。
          - 第一次揭密不展开管理局编制、完整星表、其他契约者名单、最高机密审批、精神检测全套流程或星辰之桥规则。
      - heading: 固定终点
        value: 楔子最后一个有效状态是：两人听完最低必要解释，决定接受后续评估与登记安排。正式登记、晏林完整机密报备、孙雅琪权柄登记、基础训练和星辰之桥建立留到后续前史或回忆承接。
