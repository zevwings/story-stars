    scope: 阶段四境外交接后至华靖正式潜伏前
    transition: ""
    note: 固定不同公开入口汇入主园区、退出权被剥夺、技术岗与电销／线上转化岗分工、周博进入基层执行位置及高价值对象转入实验筛选方向；不承接阶段五处置升级和逃离。
    summary: "- 本页从 PL-S-049、PL-M-020、PL-M-021 已经形成招聘筛选、合法出境与首次境外交接之后开始，不重复施工境内招聘、合法手续或首次交接。"
    headings:
