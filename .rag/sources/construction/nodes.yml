          - 多节点共享事件只执行一次；下列分节用于保留各线路必须承接的职责，不代表重复发生同一场景。
      - heading: PL-M-002｜共同精神控制方法显影
        value: |-
          - **正式节点**：[PL-M-002｜共同精神控制方法显影](../../plotlines/主线/组织/反派/共同精神控制方法显影.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 公开接触 | 建立可信身份与后续一对一入口 | 慈善活动只完成公开认识；齐心先针对郑文悦真实存在的经营或职业困境，提供一次真实、合规且有效的资源帮助，取得后续接触机会 | 具体困境、帮助内容与公开活动场景由章节大纲确定；不在公开活动中批量筛选或施术，不把正常帮助本身写成控制 | `PL-S-041` |
          | 多次接触 | 使普通精神连接逐步稳定 | 郑文悦在多次正常接触中主动谈及真实困境、依赖或关键选择，既有信任与普通精神连接逐步形成 | 具体接触次数、地点和对话由章节大纲确定；不写成见面即强种，不让齐心凭空读取目标全部隐私 | 管理局协查线 |
          | 越权扩张 | 形成第一次深层篡心连接 | 齐心越权利用既有信任，把普通连接扩张为控制通道 | 深层连接不倒推此前帮助虚假，也不抹除目标当时仍有的自主行为 | `PL-M-003` |
          | 招聘端调查 | 使郑文悦成为首名完整显影者 | 警方沿失联人员留下的招聘联系、合同与人员记录找到并控制郑文悦；她准确提供名单、岗位、合同、联系人、出境及失联时间，却不断替换境外管理、转岗、离职或主动断联等理由，维持齐心无关的固定结论 | 章节大纲须为另一名招聘负责人、六名真实用工方及招聘服务机构设置最低可辨识身份；不把异常口供直接当作异能证据，先排除串供、逃责与共同利益 | `PL-S-049`、`PL-M-006` |
          | 八人材料交叉 | 排除单人口供与普通共谋解释 | 警方分批交叉八人的口供、合同、资金、通讯、出入境记录及人员结果，确认不同接口出现同构的“事实准确、归因固定”偏差 | 具体批次、记录字段和核验顺序由章节大纲确定；不能省略现实调查，也不能用精神异常直接替代证据 | `PL-S-049`、`PL-M-006` |
          | 管理局复核 | 在现实调查门槛后确认同源精神异常 | 普通调查已排除串供、规避责任与共同利益后，管理局才按权限介入精神异常复核 | 章节大纲须确定介入门槛、现场动作与权限分工；不得让晏林凭一次接触读出八人受控或齐心身份 | `PL-S-006`、`PL-S-007` |
          | 跨案重识别 | 固定共同方法痕迹 | 多个独立对象能够准确复述事实，却持续以近似结构维持同一选择；旧理由被现实推翻后会迅速生成新解释 | 单次偏差不足以指向齐心；只确认共同方法，不确认统一组织或完整幕后名单 | `PL-S-042`、`PL-M-003` |
      - heading: PL-M-006｜陆佳凝合法出境组织与境外交接显影
        value: |-
          - **正式节点**：[PL-M-006｜陆佳凝合法出境组织与境外交接显影](../../plotlines/主线/组织/反派/陆佳凝境外承接网络显影.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 邮轮前 | 固定招聘链异常交接入口 | 郑文悦等招聘／用工材料先显出被标记人员分流，再由车辆和交接材料指向刘秉文的转移执行 | 只能确认调查方向，不能提前证明合法出境组织和境外去向 | `PL-M-002`、`PL-S-049` |
          | 邮轮后 | 交叉合法出境与公开行程中断 | 刘秉文的少数转移记录，与陆佳凝掌握的真实合同、行程变更、付款指令、结算摘要和交接确认发生交叉 | 多数对象进入真实工作或自行合法出境，不统一经过刘秉文；不设置万能服务器或全链名单 | `PL-M-013`、`PL-S-050` |
          | 收网前 | 接通境外接收与实验结果 | 境外接收、园区运营、实验需求、结果回传和收益材料分别指向朱岑郁、裴家及齐心一侧的控制轴 | 各责任轴分别证明；器官贩卖链与人体实验链不得合并定责 | `PL-M-004` |
      - heading: PL-M-008｜异常干预者观察、试探与首次有效反制
        value: |-
          - **正式节点**：[PL-M-008｜异常干预者观察、试探与首次有效反制](../../plotlines/主线/组织/反派/异常干预者观察试探与首次有效反制.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 安若曦订单后 | 形成反派侧第一份错误观察 | 现场执行者确认感知中的命中位置与现实结果不一致，将异常暂按清醒侧感知欺骗或位置替换理解 | 单次结果不能识别截断、暗伴星、双子星或四项权柄 | `PL-M-001` |
          | 多案痕迹聚合 | 把单次误判升级为可供试探的错误模型 | 反派把订单失败、目标脱离与接口受阻归入同一类稳定干预 | 错误模型只改变反派行动，不取得管理局复评结论 | `PL-S-005`、`PL-M-007` |
          | 主动试探 | 定位异常干预与信息泄露范围 | 反派更换中间人、调整订单字段或使用相似目标测试信息来源 | 一次试探不能识破双子星，也不能让反派取得管理局档案 | `PL-S-047` |
          | 切割与现实反制 | 让反派学习产生持续后果 | 裴家切割外围并剪裁甩锅；陆佳凝决策、刘秉文执行周晓莉转移，形成第一次持续现实损失 | 账户停用、证据缺口或短暂失联不能替代周晓莉的长期后果 | `PL-S-047`、`PL-S-050` |
      - heading: PL-M-004｜核心反派责任链清算
        value: |-
          - **正式节点**：[PL-M-004｜核心反派责任链清算](../../plotlines/主线/组织/反派/核心反派责任链清算.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 解印条件形成前 | 由受控者的有限选择打开加固窗口 | 顾清言在清醒间隙故意延迟上报一次与晏林的异常接触，维持正常客户维护反馈；齐心从另一条普通观察线发现接触时间或行程错位后，主动更换观察人员、调取会所记录并安排新的控制加固 | 章节大纲须确定异常接触的日期、地点、表面客户事项、普通观察线载体、加固会面与人员安排；具体对白不进入正式节点。晏林只识别人意、不负责取证；管理局经办识别记录异常并预保全，沈宁只批准方案与承担签责；败局不能来自齐心突然犯错 | `PL-S-068`、`PL-S-008`、`PL-S-007` |
          | 解印前 | 预保全现实证据 | 先保全门禁、车辆、物业、资金、行程、关联企业接口及已定位服务器的原始记录或镜像 | 不等待顾清言完整解印后再启动全部取证 | `PL-M-006`、`PL-S-008` |
          | 隔离与解印后 | 固定第一次清醒陈述 | 经身体状态、现实定向、理解能力和持续授权评估后，只固定顾清言本人经手的人员、场所、时间、车辆、结算、交接与上游接触事实；郑文悦脱离齐心后先经历隔离、现实定向和持续评估，再按自身恢复条件补充本人经手的招聘、材料与接触事实 | 解印或脱离持续控制不自动证明陈述可信；郑文悦的固定归因不会立即消失；任何单人都不提供完整责任链 | `PL-S-008`、`PL-M-002` |
          | 记录复核后 | 完成第二次复核陈述 | 以预保全材料核对第一次陈述，再由顾清言解释已出现记录间的关系并指出继续核验方向；郑文悦的陈述只提供招聘端责任链地图 | 章节大纲须确定日常经办人员、现场分工、预保全手续、记录字段、时间戳和交叉核验顺序；不以精神痕迹、错误反馈或单人口供替代现实证据 | `PL-M-006` |
          | 预设行动窗 | 同步固定多端责任链 | 关键陈述与既有材料达到门槛后，境内抓捕、账户与权限冻结、境外园区控制及裴家实验端证据固定进入同一行动窗 | 顾清言不取得行动指挥权；未能同窗完成的跨境调证和审判继续推进 | `PL-M-006`、`PL-S-008` |
          | 收网后 | 完成分层裁判与长期后果 | 顾清言的主动犯罪、受控行为、退出减害和配合调查分别裁判；章绍衡的主动诱导、非法放贷、债务施压与目标移交单独裁判；其余招聘、转移、场所经营、共同获利和境外承接责任继续逐人核验 | 不让顾清言吸收齐心、章绍衡、陆佳凝、刘秉文、朱岑郁或裴家责任；不把郑文悦统一写成无责受害者、总招聘头目或完整境外去向知情者 | `PL-S-008`、`PL-S-026`、`PL-S-049`、`PL-S-050`、`PL-S-051`、`PL-S-060`、`PL-S-074`、`PL-S-075`、`PL-M-002` |
