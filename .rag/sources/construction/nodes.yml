          - 正式保护接入后可以先停止阿九继续受害，但个人赌债与云顶直接控制解除必须等待关停决定及执行安排形成。
          - 告别性非交易亲密必须同时晚于个人债务和云顶直接控制解除、以及云顶实体关停；与第三晚崩溃中的 C 档索取分别定性。
      - heading: 对应正式节点
        value: |-
          - [PL-I-089、PL-I-090、PL-I-091｜连续三晚付费亲密、创伤吐露与边界拒绝](../../plotlines/亲密线/晏林/阿九第三晚转送吐露与拒绝伤害.md)
          - [PL-S-096｜赌场签贷与云顶控制方向](../../plotlines/副线/人物/秦瑶/赌场签贷与云顶控制方向.md)
          - [PL-S-177｜有限陈述成立](../../plotlines/副线/人物/秦瑶/有限陈述成立.md)、[PL-S-178｜正式保护接入](../../plotlines/副线/人物/秦瑶/正式保护接入.md)、[PL-S-179｜个人赌债与云顶直接控制解除](../../plotlines/副线/人物/秦瑶/个人赌债与云顶直接控制解除.md)
          - [PL-I-062｜云顶关停后的主动告别邀约与共餐](../../plotlines/亲密线/晏林/债务解除后主动告别邀约.md)
          - [PL-I-063｜告别共餐后完成一次非交易亲密并分别](../../plotlines/亲密线/晏林/临行前完成非付费主动亲密.md)
      - heading: 连续三晚衣装接口
        value: |-
          - 第一晚调用 [CON-0012｜灰黑做旧牛仔系带装](../云顶KTV会所线/12_秦瑶.md)，只承接债务未清的最小吐露。
          - 第二晚调用 [CON-0042｜白色解构衬衣与纯黑百褶超短裙](../云顶KTV会所线/13_秦瑶.md)；成年白衬衣夜装与薄黑丝袜直接穿着，不携带额外情趣装；真实停止不要求整晚永久结束，阿九可以在重新作出可辨认选择后继续。
          - 第三晚调用 [CON-0043｜深酒红蕾丝主体与暗红蕾丝袜](../云顶KTV会所线/14_秦瑶.md)；红蕾丝主体和袜组到场前已穿在黑色长西装内，衣装展示与付费亲密先于事后吐露和崩溃，不把职业训练接到崩溃后的 C 档索取上。
      - heading: 执行顺序
        value: |-
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 |
          | --- | --- | --- | --- |
          | 第一晚：发现紧绷 | 建立阿九的脚本状态与晏林的询问方式 | 双方先完成真实包厢消费与另行确认的有限亲密，再单独确认离场及后续付费亲密；结束后晏林发现阿九仍等待命令，只让她知道当晚已经结束；阿九泄露“债还没有清” | 不把酒水写成授权；不问赌场、人名与云顶过程；不让第一晚变成完整交代 |
          | 第二晚：确认询问有效 | 让阿九第一次看见拒绝不会带来惩罚 | 双方先完成真实包厢消费与另行确认的有限亲密，再单独确认离场及后续付费亲密；晏林在她迟疑时真实停下，阿九可以重新说出可辨认的继续范围；事后她说出钱是在地下赌场现场签的、账目没有明显减少 | 不把“可以吗”写成形式口令，也不把真实停止写成整晚永久终止；她仍可停止聊天 |
          | 第三晚：说出顺序 | 拼出个人经历的最低链条 | 双方先完成真实包厢消费与另行确认的有限亲密，再单独确认离场及后续付费亲密；事后阿九以“那个人”称呼施害与转送者，说出赌场签贷、催逼、被送入云顶和于静接收规训的顺序 | 阿九不知道章绍衡姓名；只说本人确定的事实 |
          | 第三晚：崩溃 | 把取证和安抚切开 | 阿九哭泣、伤心、崩溃；晏林停止询问，抱住并安抚她，明确她不需要继续证明什么 | 不趁崩溃补问身份、侵害过程和证据 |
          | 第三晚：C 档索取被拒绝 | 兑现晏林不会伤害她 | 阿九索取被“糟蹋”，会闹、主动、拉扯或使用受训话术；晏林拒绝执行 C 档伤害，但不羞辱、不离开，允许她索取拥抱和陪伴 | 请求出现但不执行；不把主动行为写成崩溃状态下的有效伤害授权 |
          | 有限陈述与保护接入 | 让帮助从关系转入正式程序 | 晏林说明自己不能个人抹债，只能帮助接入正式保护与现实核验；阿九自愿只提供人、地点、顺序和伤害类别 | 晏林不讯问、不替答、不读取真实记忆；现实材料独立核查 |
          | 等待关停安排形成 | 区分保护接入与正式脱离 | `CON-0024` 已形成云顶关停决定及执行安排，但实体场地尚未实际关闭 | 本页不执行 `PL-S-111`，也不把关停安排写成场所已经关闭 |
          | 个人债务与直接控制终止 | 完成阶段四的人物脱离 | 关停安排形成后，阿九确认本人不再承担赌场债务与服务抵扣义务，并退出云顶排班和服务投放 | 阿九不再保留第二次余额清零；悠悠裸贷余额另由 `PL-S-110` 承接；不把债务解除写成痊愈 |
          | 等待云顶实体关停 | 切开个人脱离与告别事件 | 阿九先以自由状态离开云顶排班；在 `PL-S-111` 完成前，她与晏林不发生告别性非交易亲密 | 不把帮助、脱债、离场或身体反应自动写成私人关系 |
          | 关停后主动邀约 | 回应第三晚无法自由表达的欲望 | 云顶实体关停后，阿九主动约晏林并明确说出“想要” | 不由调查方泄露联系资料，不把邀约写成报恩 |
          | 关停后一次非交易告别亲密 | 完成独立的告别事件 | 双方明确不付费、不抵债、不交换帮助后完成当次亲密 | 不自动调用 C 档，不建立持续私人回路 |
          | 清醒分别 | 收束双方阶段性关系并开放阿九未来 | 阿九按本人决定离开当前环境，晏林不安排去向、不要求固定联系，也不约定回归 | 城市、职业、住处、关系与是否重逢均不确认 |
      - heading: 三晚的询问边界
        value: |-
          - 晏林可以询问是否愿意、是否继续、是否停下，以及阿九是否愿意说明债务从哪里开始。
          - 他不主动点出章绍衡、于静或罗东海的姓名，不用答案选项替她补完责任人。
          - 阿九可以只说“赌场”“那个人”“接收我的人”；她不知道的姓名和身份由现实材料核验。
          - 第三晚哭泣后只安抚，不再继续问；后续有限陈述必须在她重新稳定并愿意继续时另行成立。
      - heading: 第三晚与关停后告别性非交易亲密的回声
        value: |-
          - 第三晚，阿九索取的是熟悉的伤害方式，用来覆盖痛苦、证明自己有用或测试晏林是否最终也会变成“那个人”；晏林拒绝的是在她崩溃时利用这一请求。
          - 云顶关停安排形成后，阿九先解除赌场债务与云顶服务义务；实体实际关停后，她才由本人主动约见并说出“想要”。这是她第一次不靠服务脚本表达当下欲望。
          - 关停后的非交易亲密只是一次告别性自由选择，不启动稳定“主人／母狗”私人回路，也不为后续复选保留自动入口。
      - heading: 不得写偏
        value: |-
          - 不把性爱写成取证工具，不把温柔写成审讯技巧。
          - 不把三晚付费、阿九主动或身体回应写成债务控制已经不存在。
          - 不让晏林在阿九崩溃中继续追问或执行 C 档伤害。
          - 不让有限陈述直接证明章绍衡姓名、罗东海能力或顾清言—章绍衡完整往来。
          - 不把帮助、债务解除、云顶关停和非交易告别亲密写成一项交换。
          - 不把关停后的一次非交易告别亲密升级为恋爱、长期伴侣、稳定联系或预设职业终局。
      - heading: 当前结论
        value: 阿九的关系变化按“**阶段三连续三晚付费亲密 → 事后逐层吐露 → 第三晚崩溃 → C 档索取被拒绝并获得安抚 → 有限陈述与正式保护 → 阶段四关停决定及执行安排形成 → 个人赌债和云顶直接控制解除 → 云顶实体实际关停 → 主动告别邀约与共餐 → 一次非交易亲密 → 清醒分别并离开**”执行。此后城市、职业、住处、关系与是否重逢均保持开放，不再设置奶茶店重逢或持续私人回路。
