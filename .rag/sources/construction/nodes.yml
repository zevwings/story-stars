          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 行动前主体说明 | 先确立晏林对本人能力结构的解释位置 | 晏林确认本人完整报备内容，准确说明两星无主次、织梦／绘影与断流／倒卷的分配、现实限制及自己愿意承担的公共风险边界 | 主体解释权不是隐瞒公共风险、否决依法监管或单方面决定所有公开范围；机构和关系者也不得替他解释本人能力与意愿 | `PL-M-025`、`PL-S-007` |
