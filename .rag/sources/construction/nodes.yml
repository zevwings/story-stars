    source_file: story/construction/风归熟客回流线/02_钱韵拒绝停排与有限恢复.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 正文
        value: 本单元位于阶段四后段、七日邮轮结束后。风归回路前三个月只完成集中建立；钱韵的单次接待、拒绝、停排与恢复发生在固定主位转入低频回流之后。
      - heading: 使用边界
        value: |-
          - 不细写职业压迫的可模仿操作，不补合同条款、账号控制技术或规避调查方式。
          - 不把说情、资源恢复与陪侍、身体、感谢或私人关系合并。
          - 本单元只承接钱韵的具名后果，不承担风归完整责任规模或万安艺人压迫全貌。
          - 本施工单元为便于真源检索仍使用真实姓名“钱韵”；晏林在本阶段只知道她的工作称呼“书书”，不知道真实姓名。后续若公开真实姓名，须另由已确认场景承接。
      - heading: 对应正式节点
        value: "-
          [PL-S-122｜钱韵拒绝后的三周职业停排与公开工作恢复](../../plotlines/副线/人物/钱韵/拒绝后的职业停排与有限恢复.\
          md)"
      - heading: 执行顺序
        value: >-
          | 顺序 | 场景功能 | 必须发生 | 执行边界 |

          | --- | --- | --- | --- |

          | 首次单次接受 | 先建立一次同意不等于长期授权 | 钱韵以工作称呼“书书”出现，并逐次同意顾清言安排的、面向晏林的一次非付费接待 |
          不向晏林公开真实姓名；晏林不向钱韵支付费用；同意只对当次成立，不提前写成固定排期、重复调用或后续默认许可 |

          | 再次安排与拒绝 | 建立职业惩罚的触发点 | 顾清言试图把第一次接受转为面向晏林的固定重复接待；钱韵明确拒绝被默认重复调用 |
          不否定第一次的真实同意，不把拒绝扩写为对所有对象或所有事项的概括判断 |

          | 三周停排与缺席 | 把控制落到现实职业后果 | 顾清言停止钱韵的直播、商演、品牌活动与主要公开排期，使她从公开工作和熟客视野同时消失三周
          | 不写成自然休假或本人自愿退出；对外口径留待单章执行 |

          | 无声替补 | 让晏林先看到人员被替换 | 万芳或既有风归人员补位，顾清言不主动解释钱韵去向 | 替补人员仍须独立授权，不把万芳写成工具
          |

          | 熟客询问 | 让顾清言的职业控制局部可见 | 晏林问起钱韵，确认她因拒绝受到职业限制，并为恢复工作资源说情 |
          晏林不索取完整案情，不以熟客地位替钱韵作决定 |

          | 回报测试 | 区分说情与占有 | 顾清言提出把钱韵重新安排给晏林；晏林以钱韵本人不愿意为前提拒绝 |
          不固定具体对白，不把拒绝写成拒绝钱韵本人 |

          | 公开工作恢复 | 留下有效但不完成系统解除的现实结果 | 三周后，顾清言恢复钱韵的直播、商演、品牌活动与主要公开排期 |
          不写成解约、自由转签或风归组织控制体系解除 |

          | 求情来源告知 | 让钱韵知道现实因果，同时阻断私人债务 | 顾清言明确告知钱韵，这次恢复是因为晏林替她求情 |
          可与复工通知同场；不要求钱韵见面、感谢、陪侍、亲近或建立关系 |

          | 非偿还式后续 | 防止资源帮助转化为私人债务 | 钱韵恢复自己的公开工作，不要求立即见到、感谢或亲近晏林 |
          后续任何接触或陪侍须重新建立当次意愿；若仍由顾清言面向晏林安排，继续遵守非付费口径 |
      - heading: 不得写偏
        value: |-
          - 不把晏林写成钱韵的救援者、代理人或职业安排者。
          - 不让顾清言一次让步完成洗白或放弃风归控制。
          - 不让钱韵恢复公开工作自动启动乔宁交叉、公开作证或完整案件显影。
  - id: CON-0036
    truth_level: construction
    name: 万安艺人压迫显影与秘密调查施工
    package: 万安艺人显影线
    status: active
    plotline_owner: 副线 / 组织 / 万安影视文化
    plotline_interfaces: PL-S-190、PL-S-189、PL-S-191、PL-S-188、PL-S-128
    scope: 阶段四乔宁异常记忆入口至万安组织压迫秘密显影
    transition: ""
    note: 固定管理局异常核验、警方现实调查与方法差异核验；不提前控制管理层或托管项目，不以艺人集体递交材料为前提。
    summary: "- 咨询、医疗、管理局核验、司法取证与职业安置分别运行。"
    headings:
      - 使用边界
      - 对应正式节点
      - 执行顺序
