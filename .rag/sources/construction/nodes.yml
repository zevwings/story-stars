    registry_line: 41
    registry_quote: "| CON-0033 | [CON-0033｜乔宁亲密入梦、秘密介入与主动回归施工](../乔宁独立线/CON-0033-乔宁亲密入梦、秘密介入与主动回归.md) | 副线 / 人物 / 乔宁 | PL-I-042、PL-S-112、PL-S-272、PL-S-273、PL-S-274、PL-S-275、PL-I-092、PL-I-043 | 阶段四私宴选择、入梦、秘密调查与首次独立复选，至阶段五主动非身体回归 |  | 固定乔宁主动入场、自愿亲密、破碎梦境、云梦号后管理局与警方秘密调查、阶段四一次独立复选及阶段五第二层责任／恢复回流关系；不承担艺人集体递交材料职责。 |"
    sections:
      - heading: 正文
        value: |-
          阶段四完成药效异常识别、第一次清醒自主亲密、破碎记忆入口、助理共犯链、乔宁秘密保护，并在调查期间完成一次独立复选；阶段五才在长现实间隔后由乔宁主动非身体回归确认第二层责任／恢复回流伴侣关系。案件进度不自动续接身体权限。
          本线以杨柳拒绝与白玥完整倒卷的共享事件为相对时间起点：乔宁的行业私宴约位于其后四个半月，云梦号结束后的系统性秘密介入约位于其后第五个月。该间隔只固定跨线因果尺度，不绑定精确日期或章号；药剂侵害、零散医疗后果与个人记录在介入前已经交织出现，不能把乔宁的入梦写成这些事件第一次发生。
      - heading: 使用边界
        value: |-
          - 本页不记录生命周期状态；当前状态只从 `story/construction/_status/` 读取。
          - 精确章号仍留待分章时确定。
          - 乔宁此前遭受的定向侵害与本线第一次自愿亲密必须明确分开；晏林不是此前接收者，也不属于万安安排。
          - 乔宁在主动靠近前已经知道晏林是心理医生；“听说你是心理医生？”属于场景对白方向，正文可以按语境自然调整。
          - 晏林只能完成有限倾听、即时安全确认和现实风险梳理，不能与已有私人关系的乔宁建立正式心理咨询关系。
      - heading: 对应正式节点
        value: |-
          - [PL-I-042｜行业私宴主动选择与第一次自愿留宿](../../plotlines/亲密线/晏林/乔宁-行业私宴主动选择与第一次自愿留宿.md)
          - [PL-S-112｜乔宁破碎记忆与异常遗失方向被识别](../../plotlines/副线/人物/乔宁/行业私宴亲密入梦与破碎记忆入口.md)
          - [PL-S-272、PL-S-273、PL-S-274、PL-S-275｜助理共犯链、秘密保护与双系统调查启动](../../plotlines/副线/人物/乔宁/双系统秘密调查正式启动.md)
          - [PL-I-092｜乔宁保护期间首次独立复选](../../plotlines/亲密线/晏林/乔宁-保护期间首次独立复选.md)
          - [PL-I-043｜乔宁主动非身体回归与第二层责任／恢复回流伴侣关系成立](../../plotlines/亲密线/晏林/乔宁-多次私人复选与阶段关系回路.md)
      - heading: 执行顺序
        value: |-
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 |
          | --- | --- | --- | --- |
          | 行业私宴入场 | 建立乔宁独立于会员和固定人员的参与身份 | 普通推荐后一至两周，乔宁以万安项目参与者身份进入思语承接的行业品牌私宴或项目庆功宴 | 不由顾清言专门引荐；万安只提供项目入口，不能替她授权私人关系 |
          | 主动观察与选择 | 让乔宁成为关系发起者 | 乔宁观察晏林如何回应工作人员、项目参与者和拒绝信号，随后主动接近，确认他是心理医生并说自己近来“感觉不对” | 不由顾清言、万安或私域点名分配；晏林不知道她的完整前史，也不借职业身份建立信任权限 |
          | 药效异常与先行止损 | 区分药效索取与清醒选择 | 乔宁出现明显欲望高涨并向晏林索取；晏林先发现环境或物品中的药剂异常，停止亲密推进，协助脱离暴露并连接医疗和证据保全 | 不由晏林私自侦查或保管证据；药效影响未排除前不发生亲密 |
          | 清醒复选与第一次留宿 | 完成第一次当次自愿关系 | 影响排除后，乔宁再次主动选择；两人分别确认私人同行、进入空间、留宿与亲密，可以边谈边亲密 | 后一次清醒选择不由此前药效中的索取自动延续 |
          | 亲密后的入梦 | 打开异常记忆入口 | 乔宁睡着或亲密结束后的近距离静息阶段，晏林才入梦，只取得破碎、缺页的部分记忆 | 入梦不构成侦讯、完整证言或现实证据，不要求乔宁随后递交材料 |
          | 助理共犯链 | 打开公司内部供药 | 管理局与警方锁定随行助理；记忆提取显出保护前约八至十次、三类载体、内部领取和汇报方向，现实记录另行补强 | 助理是直接执行者和共犯；不以记忆单独定案，不补具体投放操作 |
          | 乔宁秘密保护 | 阻止再次成功用药 | 乔宁取得必要说明后同意低暴露保护；公司仍不知道调查已启动 | 全部成功暴露发生在保护前，保护后不再安排成功用药 |
          | 云梦号间隔 | 保持事件线独立 | 云梦号按原有公开慈善、人物汇合与跨境重组功能发生 | 不把云梦号改成管理局或警方取证行动 |
          | 双系统秘密调查 | 从单案进入艺人线 | 晏林完成机密上送后，管理局处理异常记忆和精神干预，警方处理助理、公司物资、项目和普通违法事实 | 不公开晏林完整能力档案，不要求乔宁组织其他艺人交证 |
          | 双系统秘密调查 | 让案件脱离私人关系运行 | 管理局负责异常核验，警方负责现实违法调查；晏林继续潜伏 | 不组织艺人集体递材料，不让晏林兼任调查负责人 |
          | 现实间隔 | 验证关系不是即时求助回报 | 乔宁恢复自己的工作、治疗或生活安排；案件继续独立推进 | 不用案件进展催促关系，也不要求她公开或立即解约 |
          | 保护期间首次独立复选 | 证明第一次不是一次性应激或交换附属 | 经过真实间隔后，乔宁在无即时药效、资源、保护、交证或咨询压力下再次联系晏林，并重新确认一次见面、留宿或亲密 | 本项只完成阶段四的一次独立复选，不建立稳定回路 |
          | 阶段五主动非身体回归 | 确认第二层关系 | 阶段四独立复选后经过长现实间隔，由乔宁主动提出一次谈话、普通相处或情绪恢复 | 不从阶段四独立复选推定自动续约，不以身体关系作为回归证明 |
          | 第二层关系成立 | 固定长期可继承边界 | 两人形成可长期持续、非固定频率、可间断回归的第二层责任／恢复回流伴侣关系 | 不进入共同生活、完整内圈、默认危机决策、第一层候补、固定排班、公开绑定或风归归属 |
      - heading: 对白议程
        value: |-
          - 乔宁先确认晏林的职业，再决定是否继续说；“听说你是心理医生？”只承担试探功能。
          - 晏林的回应必须同时表达两点：他愿意听她当下想说的内容；他不能成为她的正式咨询师。
          - 晏林只问“你现在是否清醒、知道自己在哪里、还想不想继续”一类即时安全问题；如乔宁无法选择、冻结或要求停止，亲密立即停止。
          - 后续交证由乔宁主动提出，不用“只有把证据给我，我才能帮你”之类条件句。
          - 再次联系时不复盘她是否“被治好”，只确认当次想见、想留或想离开的真实意愿。
      - heading: 不得写偏
        value: |-
          - 不把第一次亲密写成乔宁用身体换安全，也不把晏林写成借职业身份取得她。
          - 不把有限私人谈话写成正式心理咨询，不让晏林兼任咨询师、讯问者和案件责任判断者。
          - 不在亲密场中完成证据验真、口供整理或调查推演。
          - 不把乔宁偶发的非定向欲望高涨写成不可自制，也不把第一次亲密写成单纯缓解异常；她对晏林的现实吸引与主动判断必须独立成立。
          - 不因乔宁后续多次主动便抹去她对边界、隐私和退出的持续需要。
          - 不把多次关系写成固定服务、公司输送、私域排班、风归收编或等待转正。
      - heading: 当前结论
        value: 乔宁线按“**行业私宴主动接近 → 药效异常中索取但先行止损 → 恢复稳定后第一次清醒亲密 → 亲密后入梦 → 机密上送 → 助理记忆打开保护前八至十次暴露与公司内供 → 现实记录补强 → 乔宁知情保护 → 阶段四一次独立复选 → 阶段五长现实间隔后的主动非身体回归 → 第二层责任／恢复回流伴侣关系**”执行。
