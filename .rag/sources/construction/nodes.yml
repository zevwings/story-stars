    content_indexed: true
    source_file: story/construction/云顶KTV会所线/CON-0031-私域首次游玩留宿与非付费共同兑现.md
    registry_file: story/construction/_status/active.md
    registry_line: 39
    registry_quote: "| CON-0031 | [CON-0031｜私域首次游玩留宿与非付费共同兑现施工](../云顶KTV会所线/CON-0031-私域首次游玩留宿与非付费共同兑现.md) | 亲密线 / 晏林 | PL-I-041、PL-S-099 | 阶段四 |  | 固定只有小鱼儿、悦悦同行的游玩、用餐、留宿、非付费无女女共同兑现与次日离开；悠悠、娜娜、阿九不进入本次行程。 |"
    sections:
      - heading: 场景位置
        value: |-
          - 位于阶段四，发生在 `CON-0029` 完成会员资格以后、阿九独立事件之后。
          - 云顶 KTV 的调查仍在推进，但本次到场不执行调查任务，不安排取证、试探、追问、入梦或异常目标观察。
          - 顾清言本次不与晏林正式见面；私域店级负责人杨钰琪承担正常接待、来宾登记、空间协调与离场记录。
      - heading: 行程顺序
        value: |-
          | 顺序 | 场景功能 | 必须发生 | 执行边界 |
          | --- | --- | --- | --- |
          | 预约与登记 | 区分会员与受邀来宾 | 晏林预约当次空间并登记小鱼儿、悦悦；两人各自确认同行 | 来宾不取得会员身份，闺蜜不能互相代理 |
          | 下午游玩 | 先建立正常会所吸引力 | 三人在内庭、临水步道及外围运动设施中选择一至两项活动 | 不写成公开度假区，不借运动制造身体授权 |
          | 晚间用餐 | 完成私人行程的生活质感 | 三人在三层用餐，再使用二层酒吧、观影、台球等普通娱乐空间 | 不插入案件线索、顾清言试探或白玥信息 |
          | 套房确认 | 分开住宿与身体授权 | 进入已经预约的五至六层短住套间前，分别确认房间安排、留宿和当晚私人范围 | 同一套间不等于共同身体关系；任何人可换房或离开 |
          | 非付费共同兑现 | 使私人转向第一次成立 | 三人分别确认后共同进入；小鱼儿与悦悦各自面向晏林，不发生女女身体互动 | 会费、房费、餐饮和娱乐消费不是服务费用；不设隐性资源交换 |
          | 次日回落 | 证明关系不靠封闭场景维持 | 睡眠后以早餐、散步或短时运动回到普通交流，并按各自安排离开 | 不用醒后状态倒推永久授权，不强留、不直接同居 |
      - heading: 关系执行
        value: |-
          - 本次发生前须明确“不按服务收费”；晏林结清的只是会所行程消费。
          - 小鱼儿保留本人状态与角色状态的切换权；悦悦保留自己组织观看与展示节奏的主动权。两人的既有服务分型可以转化为私人表达，但不能写成无偿履行旧服务义务。
          - 小鱼儿、悦悦均有稳定伴侣，两人的伴侣及家人不知道云顶、本次私域行程与由此延伸的私人关系；该信息只作生活背景，本单元不补伴侣身份，不制造道德审判或家庭冲突。
          - 小鱼儿、悦悦、悠悠互为好闺蜜；本次悠悠不参加。三人共同场只建立小鱼儿—晏林、悦悦—晏林两条同场身体关系，小鱼儿与悦悦本次没有女女身体互动；这一历史事实不封闭三位闺蜜后续共同亲密时的逐次选择。
          - 本次只打开低频、逐次确认的非付费私人入口，不保证复现或形成固定频率；云顶付费关系结束后的关系位置另由 `PL-I-038` 确认。
      - heading: 店级负责人接口
        value: |-
          - 私域店级负责人杨钰琪负责来宾登记、运动与餐饮预约、套房协调、晚间隐私要求和次日离场记录。
          - 杨钰琪30岁，是顾清言直属下属；本场只调用其正常经营职责，不扩写背景、契约状态或私人关系。
          - 负责人不进入三人私人空间，不替任何人授权，也不在本场提供黑产信息。
      - heading: 不得写偏
        value: |-
          - 不把三人第一次非付费共同兑现写成小鱼儿或悦悦“赠送服务”、免单、赊账或为后续资源交换。
          - 不安排小鱼儿与悦悦之间的女女身体互动，也不把无女女写成两人敌对、吃醋或互相回避。
          - 不把顾清言正式初遇、杨柳拒绝、白玥施术或裴怀民出现提前塞入本场。
          - 本场普通会所体验与私域另行存在的涉案经营分别成立，互不替代。
