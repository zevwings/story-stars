    sections:
      - heading: 场次作用
        value: |-
          这是小鱼儿第一次在云顶集中段以非 COS 的“本人造型”出现的衣装基线，不使用假发、彩色瞳片、角色妆、主题头饰或角色化称呼。它先证明小鱼儿脱离完整 COS 以后仍有清楚的个人吸引力，再为后续第一次 COS 制造明显的身份切换。
          本场仍属于普通夜间社交装，不把她写成穿着角色服执行固定项目，也不把裙装改造成云顶制服。
      - heading: 场次接口
        value: |-
          - **场次定位**：本单元对应云顶 KTV 集中段第 01 次亲密消费场，只承接本次到场、衣装与当次执行边界，不覆盖第 02 次或后续场次。
          - **参与者**：晏林、俞予安。
          - **剧情节点接口**：承接 `PL-I-087` 在云顶场景中的有限复现与逐次确认，并承接 `PL-S-091` 的普通消费入口与自由兼职正常样本。
          - **排除接口**：不承接 `PL-I-088` 的单独付费回路降频与阶段结束；该变化不得由本场衣装、亲密发生或离场自动推出。
      - heading: 视觉参考
        value: |-
          参考视频：
          `/Users/zevwings/Library/Mobile Documents/com~apple~CloudDocs/inimate/参考/服装/v2700fgi0000d8s5nlfog65m4eer0000 2.MP4`
          采用范围：
          - 黑色细肩带连衣短裙的完整轮廓。
          - 深 V 蕾丝胸片、密集镂空收腰与多层荷叶短裙摆。
          - 蕾丝、刺绣、轻薄裙层与低光泽主体面料形成的同色层次。
          - 走动时裙摆轻微展开、停下后重新垂落的动态。
          不采用范围：
          - 参考人物的面容、身体比例、发型细节、姿势表演与拍摄环境。
          - 视频水印、账号、品牌或未能从画面确认的商品信息。
          - 画面未展示的背部结构、内衬、扣合方式与鞋履。
      - heading: 主体色与层次
        value: |-
          - **主色**：黑色。不是一整块吞没轮廓的纯黑，而是由低光泽主体面料、半透蕾丝、刺绣边缘和轻薄裙层形成明暗差。
          - **局部暖点**：腰部允许保留极少量暗金或暖铜色珠饰／细链感装饰，用来在云顶暗光中标出腰线；不扩张成黑金礼服。
          - **红色处理**：原“红黑甜辣”方向收缩为深酒红短夹克这一件可脱下的小体量外层。主裙不强行改红，唇色、指甲与手包不再叠加同等强度的暗红，避免破坏参考服装的黑色完整度。
      - heading: 上身结构
        value: |-
          - 使用纤细肩带，肩颈保持干净，不叠加宽项链或大型肩饰。
          - 胸前是深 V 蕾丝拼接，蕾丝沿领口形成清楚的花边轮廓；内部须有现实衬里与承托，不能只写成悬空贴在身体上的装饰。
          - 上身主体贴合但不过度硬挺，重点是黑色蕾丝贴近皮肤后形成的纹理反差，不使用亮片或大面积漆皮抢走本人形象。
      - heading: 腰部结构
        value: |-
          - 胸下至自然腰之间使用较密的蕾丝、刺绣或软束腰式拼接，把上身与裙摆连接成完整一体。
          - 腰部可以有局部镂空，但仍须能够正常站立、坐下、转身和长时间停留；不写成真正收紧呼吸的硬质束腰。
          - 暗金／暖铜细节只集中在腰线附近，远看是一道暖光，近看才辨出小体量装饰。
      - heading: 裙摆结构
        value: |-
          - 裙摆停在大腿上段，采用两至三层轻量荷叶或短褶层次。
          - 每层以窄蕾丝、刺绣或波浪边结束，走动时依次产生细小位移，不形成蓬大的公主裙轮廓。
          - 整体是轻微 A 字而非紧身包臀：上身与腰部负责贴合，裙摆负责年轻、轻快和甜辣感。
      - heading: 云顶 KTV 适配
        value: |-
          参考视频处于明亮户外，直接照搬到暗光包厢容易让黑色结构消失。场景调用时须保留：
          - 领口蕾丝边缘与皮肤之间的清楚反差。
          - 腰部暗金／暖铜细节在近距离灯光下的一次短闪。
          - 多层裙摆在走廊、落座和起身时产生的动态。
          - 暗红强调固定落在深酒红短夹克；夹克脱下后，包厢主体回到黑色短裙与低饱和妆面，不再用手包或指甲补出第二块重色。
          通勤与离场固定增加一件深酒红短款麂皮夹克：衣摆停在高腰附近，使用低光泽软麂皮与隐藏按扣，不叠加机车铆钉、粗拉链和大面积金属。夹克保留完整短裙与腿部轮廓，只负责公共空间移动、温度和衣装完整性；进入包厢后是否脱下由小鱼儿自己决定。
      - heading: 妆发与配饰
        value: |-
          - **头发**：使用小鱼儿本人的自然深黑长发，可顺直披发或保留轻微发尾弧度；不戴假发。
          - **妆面**：眼线和睫毛比日常完整，唇色使用低饱和水红或带少量光泽的浅莓红；不与深酒红夹克争夺主色，也不使用角色眉色、夸张瞳片和高饱和舞台腮红。
          - **首饰**：允许小体量耳饰或一条极细短链；具体是否佩戴、选择哪一种交给命中场景决定，无需预先固定。若腰部已有暗金细节，颈部不再叠加复杂金属。
          - **鞋履**：视频未提供有效参考。允许范围为黑色细带高跟鞋或简洁尖头鞋，具体选择交给命中场景决定，无需预先固定，也不得声称来自视频原款。
          - **手包**：使用黑色小包，容量至少能够放手机、补妆物、房卡与个人物品，不写成纯摆设，也不与深酒红夹克重复主色。
      - heading: 动态调用
        value: |-
          - **进入画面**：先以自然黑发和完整黑裙建立“没有扮成任何人”的本人状态，再由蕾丝领口、收腰和短裙层次补足甜辣感。
          - **走动**：多层裙摆随步幅依次轻晃，腰部结构保持稳定；不靠反复摆拍表现职业感。
          - **落座**：她会先整理最外层裙摆再坐下，确认肩带与腰线位置；动作表现她熟悉展示和衣装管理，不等于紧张或邀请。
          - **起身／离场**：重新拢好裙层、拿回外套与手包，服装保持能够独立离开和返回公共空间的完整性。
      - heading: 正文优先锚点
        value: |-
          每次调用只取一至两个，不在同一段报完整清单：
          1. 自然黑发之下，没有角色假面的本人面容。
          2. 深 V 蕾丝边缘与肩颈皮肤形成的黑白反差。
          3. 密集收腰把上身与层叠短裙连接起来。
          4. 走动时依次晃开的两三层黑色裙边。
          5. 暗红唇色或小配饰为纯黑造型留下一点暖色。
      - heading: 与后续衣装的区分
        value: |-
          - 与“小鱼儿第一次 COS”相比，本场没有角色色、假发、瞳片、道具和角色姿态；辨识度完全来自小鱼儿本人和服装结构。
          - 与悦悦的普通夜装相比，本场更黑、更密、更甜辣，悦悦后续应使用更轻、更冷或更松散的轮廓，避免两人第一次同场时撞型。
          - 与阿九的黑金成熟情趣装相比，本场的裙摆更轻、更短、更年轻，腰部装饰只是小面积暖点，不进入成熟束腰、丝袜和深酒红主色体系。
      - heading: 执行边界
        value: |-
          - 这是普通夜间社交装，不是 COS，也不是私域最高级陪侍服制。
          - 深领、镂空、短裙和主动展示不替代离场、亲密、拍摄或后续关系确认。
          - 不把小鱼儿写成云顶驻场人员；她仍是经外部接口到场的自由 Coser／活动模特。
          - 背部、内衬、扣合和具体鞋履在参考中不可见，保持不锁定，待需要写穿脱或坐姿时再做现实化施工。
      - heading: 当前结论
        value: 云顶第 01 次亲密消费场的衣装采用“**黑色细肩带蕾丝短裙＋镂空软收腰＋多层荷叶短裙摆**”。整体方向由原先粗略的“红黑甜辣”收敛为“**黑色甜辣主体＋暗红妆面／小配饰＋极少量暖金腰部细节**”，既保留参考服装的完整观感，也给后续完整 COS 留出足够的变装落差。
