    sections:
      - heading: 施工作用
        value: 这是俞予安与王诗悦第一次双人主题造型。它以低体量黑白女仆符号建立可识别的共同外壳，但不绑定具体 IP，也不把幻想身份写成现实侍奉义务。
      - heading: 场次接口
        value: |-
          - **定位**：云顶第 04 次亲密消费场，只覆盖当次双人主题展示、消费与逐项确认。
          - **参与者**：晏林、俞予安、王诗悦。
          - **剧情接口**：承接 `PL-I-034` 的双人关系继续显影。
          - **排除项**：不建立现实主从、雇佣关系或后续场次的默认复现。
      - heading: 衣装快照
        value: |-
          - 两人穿同版低光泽黑色短袖 A 字／小伞摆短裙，大白圆领配细黑蝴蝶结。
          - 白色肩部小荷叶、短围裙、四枚黑心形扣和背后软蝴蝶结组成主题层；白色荷叶头箍配小黑蝴蝶结。
          - 白色过膝袜、黑色低跟玛丽珍；裙内为黑色安全短裤。
          - 不使用假发、美瞳、猫耳、项圈和大型道具；两人靠自然妆发区分。
      - heading: 场景执行
        value: |-
          1. 可穿完整造型通过公共区域，不另加破坏轮廓的外层。
          2. 围裙和头箍是可拆主题件；摘下任一配件都不表示同意扩大其他内容。
          3. 两套分别量体、分别整理、分别退出。
      - heading: 执行边界
        value: |-
          - “女仆”只属于当次幻想主题，不代表现实服务身份、服从关系或具体角色。
          - 双人构图不合并穿脱、拍摄、保存传播和亲密决定。
          - 不增加项圈、铭牌、命令道具或真实机构信息。
      - heading: 已确认结论
        value: 本场固定为“**同版黑色短裙＋白圆领＋短围裙＋荷叶头箍＋白色过膝袜＋黑色玛丽珍**”的轻量双人女仆主题装。
