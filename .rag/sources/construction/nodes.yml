          | 2 | 过程权交付 | 林芷兰明确取得当次过程权，晏林在可收回前提下交付 | 同时建立可执行的暂停、降级和解除方式 | 林芷兰亲密线 |
          | 3 | 建立私域标记 | 双方共同建立可佩戴、可解除、可失效的成对标记或等价语言 | 不代表永久占有、治疗权或日常命令权 | 林芷兰亲密线 |
          | 4 | 完成双向争权 | 双方都实际取得、交出并重新赢回主导位 | 不把主导位固化成人格或永久关系位置 | 林芷兰亲密线 |
          | 5 | 真实执行停止 | 至少一次中途停止或降级被真正执行 | 停止不等于关系撤回，也不要求补偿 | 林芷兰亲密线 |
          | 6 | 重建与现实回位 | 完成解除、普通照料、复盘和后续信任重建，并回到日常职业位置 | 不使用净化、修复、医疗或精神连接抹除后果 | PL-M-016 |
