    source_file: story/construction/万安艺人显影线/01_万安艺人压迫显影与材料交叉.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 使用边界
        value: |-
          - 咨询、医疗、管理局核验、司法取证与职业安置分别运行。
          - 会所梦境与私人观察只提供异常方向，不替代当事人材料和现实记录。
          - 乔宁只调用本人独立人物线已经恢复的部分记忆；她不负责提交首批材料，也不组织其他艺人交证。
          - 不把程叙、乔宁、梁予安、何知远或会所外围新人写成相同经历。
          - 杨柳、燕若淇、侯瑞驰等人的既往经历可以在调查介入前交织发生；调查显影顺序不等于历史发生顺序，也不要求预先排出全员经历的完整时间表。
          - 周景尧与燕若淇的合作、关系确认和受控事件可以早于乔宁调查入口；两人不是卧底、诱饵或提前组织交证者，乔宁仍先打开公司内部供药方向。
      - heading: 对应正式节点
        value: |-
          - `PL-S-243`、`PL-S-245`、`PL-S-246`：职业控制、裴兰馨有限敕令核验与组织模式。
          - `PL-S-278`—`PL-S-285`、`PL-S-298`、`PL-S-304`：周景尧—燕若淇关系、强制调度、欲望干预、周景尧一次短效定向药剂暴露、现实与异常控制、药剂切换、事实恢复及自主后续。
          - `PL-S-247`—`PL-S-250`：私域项目导流材料链。
          - `PL-S-251`、`PL-S-252`、`PL-S-260`、`PL-S-261`：个案、交叉验证、责任接口与行动清单。
          - [PL-S-236｜公司内供项目与物资记录交叉](../../plotlines/副线/组织/万安影视文化/公司内供项目与物资记录交叉.md)、[PL-S-237｜公司内供多批次方向成立](../../plotlines/副线/组织/万安影视文化/公司内供多批次方向成立.md)、[PL-S-238｜公司内供逐人责任接口形成](../../plotlines/副线/组织/万安影视文化/公司内供逐人责任接口形成.md)、[PL-S-239｜合法业务进入独立托管](../../plotlines/副线/组织/万安影视文化/合法业务进入独立托管.md)、[PL-S-240｜艺人分别取得自主职业选择](../../plotlines/副线/组织/万安影视文化/艺人分别取得自主职业选择.md)
          - [PL-S-286｜万安涉案接口统一行动启动](../../plotlines/副线/组织/万安影视文化/万安涉案接口统一行动启动.md)、[PL-S-287｜万安原控制体系终止并转入官方后台](../../plotlines/副线/组织/万安影视文化/万安原控制体系终止并转入官方后台.md)：官方行动启动、裴兰馨异常监管、原控制体系终止与晏林退出。
          - [PL-S-114｜外部客户供药、虚假说明与长期风险隐瞒](../../plotlines/副线/组织/裴家/外部客户供药与风险隐瞒.md)、[PL-S-115｜广告代言入口与明知用药责任](../../plotlines/副线/人物/霍临川/广告代言入口与明知用药责任.md)、[PL-S-118｜明知用途后的多次药剂侵害](../../plotlines/副线/人物/蒋曼琳/明知用途后的多次药剂侵害.md)、[PL-S-119｜多次药剂侵害与累积后果](../../plotlines/副线/人物/侯瑞驰/多次药剂侵害与累积后果.md)：裴家经具体独立服务、分销者或中间人向外部客户供药，卖方说明与客户直接侵害分别归责；与裴兰馨公司内供分开闭合。
          - [PL-S-265｜再次侵害被中止并取得紧急医疗](../../plotlines/副线/人物/侯瑞驰/再次侵害被中止并取得紧急医疗.md)、[PL-S-266｜侯瑞驰知情进入低暴露保护](../../plotlines/副线/人物/侯瑞驰/侯瑞驰知情进入低暴露保护.md)、[PL-S-267｜侯瑞驰直接风险解除后自主决定陈述与职业后续](../../plotlines/副线/人物/侯瑞驰/直接风险解除后自主决定陈述与职业后续.md)：现场中止、紧急医疗、低暴露保护与本人直接风险解除后的自主决定。
      - heading: 执行顺序
        value: |-
          | 顺序 | 场景功能 | 必须发生 | 执行边界 |
          | --- | --- | --- | --- |
          | 前置：承接乔宁入口结果 | 以既有个案结果打开裴兰馨公司内供调查 | 承接 `CON-0033` 已形成的机密上送、助理责任方向、乔宁低暴露保护和双系统秘密调查；本单元从相关项目、物资与反馈记录继续扩展 | 不重复施工 `PL-S-272`—`PL-S-275`，不把乔宁变成组织交证入口 |
          | 第二：程叙现实危机 | 验证非药剂职业压迫与有限敕令干预 | 医院先完成自杀未遂后的急性医疗处置；程叙稳定并同意后进入晏林承接的心理支持，逐步显出职业施压及一道求助或发送行为异常中断 | 不描写可模仿方法，不把咨询变成秘密侦讯，现实调查在咨询之外运行 |
          | 第三：侯瑞驰现场突破 | 打开外部客户供药 | 调查系统发现蒋曼琳准备再次实施侵害并及时中止，现场控制蒋曼琳；侯瑞驰在必要说明下自行决定接受紧急医疗，再在了解保护范围、风险与退出方式后自主决定进入低暴露保护；现场事实指向具体卖方、中间人或独立药剂服务 | 医疗、保护与陈述分别授权；侯瑞驰不与万安签约，也不是诱饵；局部控制不等于裴家完整责任已经闭合 |
          | 第四：燕若淇与周景尧显影 | 扩大公司内供链并恢复必要关系事实 | 由乔宁助理的项目、物资和内部记录方向找到燕若淇，再将裴兰馨“实验需求＋私人报复”的选人逻辑、早期欲望订单、杨柳事件后转入驯化型药剂、长期条件化与人员资源化记录，同周景尧的自主关系选择、合同、通讯、一次短效定向药剂暴露和有限敕令异常分别交叉 | 不复制乔宁助理链，不把记忆当录像，不把裴兰馨的“被抢走”写成客观事实，不把周景尧写成长期驯化对象，也不因事实恢复自动恢复恋爱 |
          | 第五：杨柳外部项目 | 闭合霍临川客户责任 | 由霍临川黑市记录、美妆广告项目及杨柳有限记忆逐步锁定；她承接催情型药剂的急性反应与重复用药累积后果，不形成针对霍临川的稳定驯化或条件化服从 | 杨柳不是万安旗下艺人，不并入公司内供，也不承担燕若淇的驯化与资源化功能 |
          | 交织显影 | 让多名当事人的片段逐步形成交叉 | 调查按“当下接触或询问 → 本人可承受的记忆片段或陈述 → 对应现实记录 → 指向下一人物、项目或场所”的方式推进 | 最先进入询问的人不等于最早受害者；记忆不是录像，不用单一片段确定完整历史顺序或司法责任 |
          | 方法差异核验 | 区分不同执行者责任 | 调查分别核验白玥早期欲望放大、杨柳所受外部催情型药剂、燕若淇所受公司内供驯化型药剂、周景尧的一次短效非情欲向暴露与裴兰馨有限敕令限制，并同合同、调度和信息隔离分开 | 不把周景尧的单次暴露扩写成催情、驯化或长期依赖；不写永久封口、群体控心、指定欲望、人格改写或绝对服从 |
          | 职业与场所记录交叉 | 把行业传闻推进为可验证结构 | 万安合同、项目、资源与公关记录同私域预约、项目登记、人员调度、出入和结算记录交叉 | 任何记录都不能单独证明陪伴、拍摄、观看或身体行为授权 |
          | 重复模式成立 | 完成组织层显影 | 管理局异常核验与警方现实调查共同显示短期包装、资源压迫、私人项目与场所输送存在重复方法 | 不把单一梦境或部分恢复记忆直接推广为全体经历 |
          | 万安行动接口 | 保留万安自身行动门槛 | 阶段四只标记涉案管理层、项目、资料与场所接口；待万安自身材料达到门槛后，阶段五即可控制直接施害者、保全资料并启动托管 | 不以齐心、陆佳凝、裴家实验中心或朱岑郁案件闭合为前提；不让任何艺人承担诱饵或集体交证职责 |
          | 官方行动启动 | 使万安涉案接口失去继续运作条件 | 阶段五由管理局与警方按万安自身证据分责行动；裴兰馨进入管理局能力限制、强制复评与监管，现实犯罪责任另由警方和司法处理 | 不展开抓捕、搜查、讯问或查账；本次行动可以形成裴家责任轴的现实材料，但不等于裴家四人责任已经闭合 |
          | 结果收束 | 关闭万安艺人药剂线与外部客户受害后续 | 原涉案管理与人员控制体系终止，合法业务进入独立托管，万安艺人分别获得职业选择；万安行动后，侯瑞驰分别决定是否陈述、提供有限材料、公开范围及职业后续，至少一项保留拒绝、延后或开放选择；晏林收到安全与移交完成通知后退出 | 不以证据贡献、公开、退圈或复工证明恢复；后续裴家责任闭合、监管、审判和重组转入官方后台，不再保留晏林必须完成的任务 |
      - heading: 章级显影与材料释放
        value: |-
          - 采用人物—材料混合推进。每章只设一名主要人物，先让该人物的当下处境、可承受陈述或现实后果成立，再兑现一段能够指向下一人物、项目或渠道的现实材料；不得把多人经历压缩成联合说明会，也不得用材料摘要取代人物体验。
          - 乔宁个案只作为既有调查入口承接，不在本单元重复成为首章主体。本单元首轮新增接触从程叙的急性医疗后心理支持进入；首轮正式询问须等程叙稳定并明确同意后，由现实调查人员在咨询之外进行，晏林不承担秘密询问。
          - 下表各章位至少占据一个独立主显影位置；后续绑定具体章号时可以因场景容量拆分，但不得合并后打乱主要人物、主材料和章尾停点。
          | 章位 | 主要人物 | 人物层兑现 | 本章主材料 | 章尾停点与下一接口 |
          | --- | --- | --- | --- | --- |
          | 一｜职业压迫与异常中断 | 程叙 | 急性医疗稳定后，从职业施压、求助受阻和一道发送或离开行为异常中断进入；心理支持与案件询问保持分离 | 合同、项目与通讯组成的一段现实时间线 | 只确认现实压迫与有限敕令核验方向，不在本章扩写药剂；章尾转入另一项正在发生的直接风险 |
          | 二｜外部客户现场突破 | 侯瑞驰 | 中止蒋曼琳再次侵害，承接紧急医疗、特定权力标记触发的恐惧／冻结及低暴露保护选择；该反应不得写成对女性的性吸引 | 现场药剂、通讯与订单形成的一段即时留痕 | 锁定具体卖方、中间人或独立药剂服务方向，打开外部客户渠道；局部控制不等于上游责任闭合 |
          | 三｜关系事实与选人异常 | 燕若淇 | 从她与周景尧已经自主成立的现实关系、未经真实告知的私人项目调度及早期欲望干预后果进入 | 合同、行程与通讯形成的一段矛盾记录 | 先显出裴兰馨在两人关系确认后针对燕若淇的选人异常，以及施害者主观的“被抢走”叙事；不在本章确认完整动机 |
          | 四｜公司内供切换 | 燕若淇 | 承接早期欲望干预之后出现的方法变化、暴露反复及本人无法解释的状态断裂 | 项目与物资记录形成的一段公司内供材料 | 只确认杨柳事件使外部能力执行端失效后，裴兰馨把燕若淇转入驯化型长期实验路径；不得由少数高强度用药直接宣告稳定驯化 |
          | 五｜催情型后果 | 杨柳 | 由本人有限记忆、急性反应与重复用药后的累积损伤进入，保留她对披露、治疗和职业后续的分别选择 | 医疗发现形成的一段现实记录 | 确认催情型的急性／累积后果，不配置稳定驯化、条件化服从或强迫性返回；章尾指向广告项目与霍临川客户记录 |
          | 六｜外部客户责任 | 杨柳 | 在不扩大本人陈述范围的前提下，把她的个案后果与外部项目对应 | 美妆广告项目、客户取得与黑市订单形成的一段交易记录 | 闭合霍临川明知主要用途后的直接责任，并把杨柳事件固定为燕若淇药剂切换之前的历史锚点；章尾进入跨案件药剂对照 |
          | 七｜驯化后果与跨案对照 | 燕若淇 | 回到长期依赖／戒断、条件化反应、周景尧被利用为唤醒／缓解钥匙及人员资源化后果 | 长期反馈与人员调度记录形成的一段管理材料 | 集中区分杨柳的催情型与燕若淇的驯化型，确认裴兰馨既有实验需求先于具体选人、私人报复叠加到燕若淇的目标选择；随后转入逐人责任登记与万安自身行动接口 |
          - 历史发生顺序只恢复到执行所需的四个锚点：周景尧与燕若淇确认现实感情并遭针对性调度／早期欲望干预 → 杨柳事件使外部能力执行端失效 → 燕若淇转入公司内供驯化型药剂 → 长期暴露形成条件化与人员资源化后果。调查章节仍按乔宁入口、程叙、侯瑞驰、燕若淇、杨柳的首度显影顺序推进；后续回到燕若淇完成长期后果与跨案对照，不代表历史倒序或重新排列受害先后。
          - 药剂差异不由一段药理解释承担：杨柳先由急性／累积身体与医疗后果成立，燕若淇先由长期条件化、依赖／戒断和调度标签成立，最后才在跨案件接口以既有材料集中对照。对照只确认用途、暴露跨度、后果模式和责任接口，不补剂量、商品名、完整配方或操作参数。
          - 裴兰馨的私人报复分两层释放：选人异常章只显出针对性调度与主观占有叙事；跨案对照章才以既有实验需求、项目记录、长期反馈和针对性选择共同确认“实验需求＋私人报复”。不得把嫉妒写成唯一动机，也不得把“燕若淇抢走周景尧”写成客观事实。
          - 阶段五的责任登记、统一行动、托管和个人后续不得回塞进上述调查章。绑定章纲时另设行动与后续章位，并继续遵守一章一名主要人物、陈述／材料／公开／职业分别授权的边界。
      - heading: 国内药剂渠道边界
        value: |-
          - 裴家境外医疗机构在白玥执行端失效以前已经进行药剂研发、试制、小批量生产与境外人体实验，但尚未把药剂投向国内终端客户；白玥失效后，裴家才把既有药剂转入国内使用。
          - 外部渠道由裴家经具体独立服务、分销者或中间人向蒋曼琳、霍临川等客户供药；杨柳的霍临川个案使用催情型。内部渠道由裴兰馨直接进入万安艺人线，其中燕若淇承担驯化型实验。两条渠道分别归责，不用白玥的首次市场任务或长期匿名联系直接指向裴家。
          - 裴兰馨亲自把情欲向药剂用于艺人，并通过随行或项目助理继续执行和反馈；她对燕若淇的选人同时服务既有驯化实验需求与私人报复。该直接行为已经完成艺人线与裴家来源的连接，不另设上游批次或结果回流证明节点。
      - heading: 合同、资产与保护执行
        value: |-
          - 普通经纪和项目合同不写侵害安排；裴兰馨下令、助理执行和反馈是犯罪执行链。
          - 账号、肖像和作品商务权由万安运营及经纪体系控制；私人素材由裴兰馨及执行助理私下掌握，收网后作为涉案材料保全并停止传播。
          - 阶段四可中止正在发生或即将发生的侵害、提供医疗和保护、隔离个别直接施害者并秘密保全材料；阶段五才整体控制涉案接口、停止私人项目并启动合法业务托管。
          - 职业与数字资产由独立托管团队承接；警方只保全涉案材料。安全住所按实际风险和本人意愿安排，不预设全员名单。
      - heading: 材料边界
        value: |-
          | 材料来源 | 可以证明 | 不能单独证明 |
          | --- | --- | --- |
          | 当事人陈述或恢复记忆 | 本人的经历、拒绝、后果与授权范围 | 其他人的经历、整家公司性质或完整责任链 |
          | 万安合同、项目、资源与公关记录 | 职业关系、资源控制与项目流向 | 具体私人行为已经得到同意 |
          | 私域预约、出入、房间、调度与结算 | 人员进入场所及现实调度 | 完整上游责任与每项具体授权 |
          | 医疗、咨询与管理局记录 | 风险、治疗、转介与异常核验过程 | 司法责任与当事人未授权隐私 |
          | 会所梦境与私人观察 | 早期异常方向 | 正式证言、诊断或定罪事实 |
      - heading: 显影排序
        value: |-
          - 先确定当下调查入口，再按该入口能够合法取得的材料回看既往片段；不按作者全知时间线把所有侵害依次播放。
          - 调查显影顺序固定为乔宁、程叙、侯瑞驰、燕若淇、杨柳；该顺序不等于实际受害时间顺序。
          - 五名药剂／项目当事人及周景尧各自只说明本人经历与后果；助理或当事人记忆只提供调查方向，必须经现实记录交叉后形成重复模式。
          - 首轮正式询问从程叙稳定并同意后的现实职业施压与关键行动异常中断进入，且与心理支持分开；首轮代表性显影、后续人物—材料章位及跨案对照按本页“章级显影与材料释放”执行。具体章号、药剂精确次数和全员完整历史时间表留待章节绑定时确定。
      - heading: 不得写偏
        value: |-
          - 不把晏林写成主动调查艺人群体的人，也不让私人关系、咨询和取证合并。
          - 不让乔宁承担首批材料、全部名单、替同行作证或组织集体递交材料的职责。
          - 不把风归人员自动并入万安合同与责任链。
          - 不用托管、解约或复工作为所有当事人的统一恢复答案。
  - id: CON-0037
