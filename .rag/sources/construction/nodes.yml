      - heading: 对应正式节点
        value: |-
          - [PL-I-037｜连续三晚付费亲密、创伤吐露与边界拒绝](../../plotlines/亲密线/晏林/秦瑶-连续三晚付费亲密创伤吐露与边界拒绝.md)
          - [PL-S-177｜有限陈述成立](../../plotlines/副线/人物/秦瑶/有限陈述成立.md)、[PL-S-178｜正式保护接入](../../plotlines/副线/人物/秦瑶/正式保护接入.md)、[PL-S-179｜个人赌债与云顶直接控制解除](../../plotlines/副线/人物/秦瑶/个人赌债与云顶直接控制解除.md)
          - [PL-I-062｜云顶关停后的主动告别邀约与共餐](../../plotlines/亲密线/晏林/债务解除后主动告别邀约.md)
          - [PL-I-063｜告别共餐后完成一次非交易亲密并分别](../../plotlines/亲密线/晏林/临行前完成非付费主动亲密.md)
      - heading: 执行顺序
        value: >-
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 |

          | --- | --- | --- | --- |

          | 第一晚：发现紧绷 | 建立阿九的脚本状态与晏林的询问方式 |
          双方完成分别确认的付费亲密；晏林发现阿九结束后仍等待命令，只让她知道当晚已经结束；阿九泄露“债还没有清” |
          不问赌场、人名与云顶过程；不让第一晚变成完整交代 |

          | 第二晚：确认询问有效 | 让阿九第一次看见拒绝不会带来惩罚 |
          双方再次发生分别确认的付费亲密；晏林在她迟疑时真实停下；事后阿九说出钱是在地下赌场现场签的、账目没有明显减少 |
          不把“可以吗”写成形式口令；她仍可停止聊天 |

          | 第三晚：说出顺序 | 拼出个人经历的最低链条 |
          双方先完成分别确认的付费亲密；事后阿九以“那个人”称呼施害与转送者，说出赌场签贷、催逼、被送入云顶和于静接收规训的顺序 |
          阿九不知道章绍衡姓名；只说本人确定的事实 |

          | 第三晚：崩溃 | 把取证和安抚切开 | 阿九哭泣、伤心、崩溃；晏林停止询问，抱住并安抚她，明确她不需要继续证明什么 |
          不趁崩溃补问身份、侵害过程和证据 |

          | 第三晚：C 档索取被拒绝 | 兑现晏林不会伤害她 | 阿九索取被“糟蹋”，会闹、主动、拉扯或使用受训话术；晏林拒绝执行 C
          档伤害，但不羞辱、不离开，允许她索取拥抱和陪伴 | 请求出现但不执行；不把主动行为写成崩溃状态下的有效伤害授权 |

          | 有限陈述与保护接入 | 让帮助从关系转入正式程序 |
          晏林说明自己不能个人抹债，只能帮助接入正式保护与现实核验；阿九自愿只提供人、地点、顺序和伤害类别 |
          晏林不讯问、不替答、不读取真实记忆；现实材料独立核查 |

          | 个人债务与直接控制终止 | 完成阶段三的人物脱离 | 阿九确认本人不再承担赌场债务与服务抵扣义务，并离开云顶排班和投放 |
          公共余额清零与云顶实体终局仍留 `PL-S-110`、`PL-S-111`；不把债务解除写成痊愈 |

          | 等待云顶实体关停 | 切开个人脱离与关系转向 | 阿九先以自由状态离开云顶排班；在 `PL-S-111`
          完成前，她与晏林不开始非付费关系 | 不把帮助、脱债、离场或身体反应自动写成私人关系 |

          | 关停后主动邀约 | 回应第三晚无法自由表达的欲望 | 云顶实体关停后，阿九主动约晏林并明确说出“想要” |
          不由调查方泄露联系资料，不把邀约写成报恩 |

          | 关停后第一次非付费亲密 | 完成由原付费关系向私人关系的第一次转向 | 双方明确不付费、不抵债、不交换帮助后完成当次亲密 | 不自动调用
          C 档，不自动建立稳定回路 |

          | 清醒分别 | 收束双方阶段性关系并开放阿九未来 | 阿九按本人决定离开当前环境，晏林不安排去向、不要求固定联系，也不约定回归 |
          城市、职业、住处、关系与是否重逢均不确认 |
      - heading: 三晚的询问边界
        value: |-
          - 晏林可以询问是否愿意、是否继续、是否停下，以及阿九是否愿意说明债务从哪里开始。
          - 他不主动点出章绍衡、于静或罗东海的姓名，不用答案选项替她补完责任人。
          - 阿九可以只说“赌场”“那个人”“接收我的人”；她不知道的姓名和身份由现实材料核验。
          - 第三晚哭泣后只安抚，不再继续问；后续有限陈述必须在她重新稳定并愿意继续时另行成立。
      - heading: 第三晚与关停后非付费亲密的回声
        value: |-
          - 第三晚，阿九索取的是熟悉的伤害方式，用来覆盖痛苦、证明自己有用或测试晏林是否最终也会变成“那个人”；晏林拒绝的是在她崩溃时利用这一请求。
          - 云顶关停后，阿九已经没有赌场债务、云顶服务义务和场所持续影响，由本人主动约见并说出“想要”；这是她第一次不靠服务脚本表达当下欲望。
          - 关停后的非交易亲密只是一次告别性自由选择，不启动稳定“主人／母狗”私人回路，也不为后续复选保留自动入口。
      - heading: 不得写偏
        value: |-
          - 不把性爱写成取证工具，不把温柔写成审讯技巧。
          - 不把三晚付费、阿九主动或身体回应写成债务控制已经不存在。
          - 不让晏林在阿九崩溃中继续追问或执行 C 档伤害。
          - 不让有限陈述直接证明章绍衡姓名、罗东海能力或顾清言—章绍衡完整往来。
          - 不把帮助、债务解除、云顶关停和非付费亲密写成一项交换。
          - 不把关停后的第一次非付费亲密直接升级为恋爱、长期伴侣、稳定联系或奶茶店终局。
      - heading: 当前结论
        value: 阿九的关系变化按“**阶段三连续三晚付费亲密 → 事后逐层吐露 → 第三晚崩溃 → C 档索取被拒绝并获得安抚 → 有限陈述与现实核验 →
          个人债务和云顶直接控制先行终止 → 等待云顶实体关停 → 主动告别邀约与共餐 → 一次非交易亲密 →
          清醒分别并离开**”执行。此后城市、职业、住处、关系与是否重逢均保持开放，不再设置奶茶店重逢或持续私人回路。
  - id: CON-0029
    truth_level: construction
    name: 私域递名、缴费与会员资格
    package: 云顶KTV会所线
    status: active
    plotline_owner: 副线 / 组织 / 云顶KTV
    plotline_interfaces: PL-S-097、PL-S-098
    scope: 云顶稳定熟客阶段至私域会员资格取得
    transition: ""
    note: 固定普通递名、本人缴费、正式会员资格与被动安全标记；首次进入由私人欲望触发，不等待白玥交底。
    summary: "- 本场发生在晏林已经多次于云顶真实消费、付款稳定，且于静已经把他视为稳定熟客之后，不得放在第一次或第二次到店。"
    headings:
      - 场景位置
      - 已确认场景顺序
      - 锚点对白
      - 递名、缴费与审核结果
      - 独立巡视与被动标记
      - 动机与后续接口
      - 知情边界
      - 不得写偏
    content_indexed: true
    source_file: story/construction/云顶KTV会所线/私域递名与会员资格.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 场景位置
        value: >-
          - 本场发生在晏林已经多次于云顶真实消费、付款稳定，且于静已经把他视为稳定熟客之后，不得放在第一次或第二次到店。

          - 私域可以核验晏林公开可查的本人身份、职业及野人户外任职信息；本场不以野人户外已经取得特定渠道突破为硬前置，也不要求于静掌握公司经营资料。

          -
          本场位于阶段四开局，晚于阿九独立事件，早于私域首次正常私人行程、杨柳事件与白玥其后一周内的主动入案；晏林第一次实际进入私域只由私人欲望驱动。

          - 不固定具体日期、与第几次衣装同晚或等待审核的天数；这些参数留待分章绑定。
      - heading: 已确认场景顺序
        value: >-
          | 节拍 | 执行内容 | 边界 |

          | --- | --- | --- |

          | 前台等候 | 晏林已经提前订好包厢，在云顶前台确认房间、人数或等待工作人员完成开台 | 不写成由晏林亲自操作店内开台系统 |

          | 客人结账 | 一名刚结完账、带有酒意的客人向同伴转述关于私域的炫耀式传闻 | 只说名称和片面印象，不透露会员身份、内部安排或具体黑产业务
          |

          | 晏林留意 | 晏林听见“私域”及其中女性“极品”的说法，下意识多留意片刻 | 这是私人兴趣和欲望，不提前包装成调查任务 |

          | 于静确认 | 于静送走客人后，注意到晏林的反应，主动问他是否想去 | 她是在确认稳定熟客的准入意愿，不是向普通散客推销 |

          | 晏林肯定 | 晏林不遮掩，直接回答“想” | 不补虚假的纯商务动机，也不当场追问内部服务细节 |

          | 递名边界 | 于静明确他已经达到可以递名的程度，并取得他同意后转交联系方式；最终是否接收及会费由私域决定 |
          推荐只打开审核入口，不等于会员批准或代缴会费 |
      - heading: 锚点对白
        value: 锚点对白固定信息与权力关系，正文可以按当章节奏压缩连接动作，但不得改成晏林主动追问渠道、于静承诺带入，或双方在前台说明私域灰黑业务。
      - heading: 递名、缴费与审核结果
        value: |-
          - 于静依据既有熟客记录，只递交晏林的真实消费、付款稳定性、现场风险判断，并在本人同意后转交联系方式；她不掌握公司内部资料，也不替私域作最终结论。
          - 私域通过联系方式另行接触晏林，由晏林本人提交公开身份：江州野人户外用品有限公司联合创始人、董事兼产品经理，同时是合法执业的私人心理咨询师。
          - 野人户外仍是小型创业公司。晏林的身份足以支持会员审核，不得据此直接升格为权贵或集团高层。
          - 私域独立完成场所侧审核后，由晏林使用个人资金缴纳会费，取得正式会员资格。会员资格不按身份等级或楼层逐项开通区域。
          - 晏林可以正常使用园区会员公共区域、外围运动设施及主楼一至六层的会员空间；具体包厢、套房和设施服从预约、实际占用、容量、时段、隐私与安全规则，闭门会议和当次限定活动按邀请进入。
          - 会员资格不产生任何人员项目、拍摄、观看或身体权限；顾清言七层私属空间仍只认她本人授权。
          - 审核和缴费完成后，晏林可以按正常预约实际进入，不必等待白玥交底。第一次进入仍由他对高端隐秘消费与漂亮女性的真实兴趣驱动，不包装成调查。
      - heading: 独立巡视与被动标记
        value: |-
          - 晏林反复在云顶消费期间，偶发到店的契约者巡视者只在明显精神反应已经出现时记录其精神之海反应异于普通人、疑似契约者。
          - 巡视者不能主动探查、刺激或安排后续精神试探，也不能确认晏林的星、具体权柄、登记状态、真实来意、思想内容或是否涉案。
          - 被动标记直接报顾清言或私域核心后台，不进入于静的熟客记录、递名材料、日常经营汇报或私域会员准入判断；于静不知道巡视者是契约者，也不知道晏林被标记。
          - 普通递名与被动标记是两条独立信息链：前者支持正常会员审核和缴费，后者只用于对应场次的安全留痕，不产生追加排查、观察任务或精神接触。
      - heading: 动机与后续接口
        value: |-
          - **最初想去**：晏林对更高端的社交场所、隐秘消费和漂亮女性存在真实兴趣；“想”必须成立，不能反写成卧底表演。
          - **能够获准**：来自持续真实消费、稳定付款、公开商业与职业身份、本人缴纳会费及私域独立审核，不来自欲望强弱、精神之海反应或与某名服务人员发生关系。
          - **第一次实际进入**：资格开通后由晏林本人私人欲望触发；不是调查，不等待白玥提供线索。
          - **第一次实际行程**：与小鱼儿、悦悦共同游玩、用餐、留宿、非付费兑现并于次日离开，由 `CON-0031` 承接；本单元不承载具体场景。
          - **后来进入调查视野**：白玥在杨柳事件后亲自说明私域存在更多订单、人员、活动和实体记录交叉；这改变私域的调查意义，不改写晏林最初入会和进入的私人动机。
          - 正常准入流程与被动安全标记分别处理；于静不知道契约者巡视、标记、欲望逆流或后台核验安排。
      - heading: 知情边界
        value: |-
          - 结账客人只是在转述圈层传闻，其说法不能定义私域的完整性质。
          - 于静只知道云顶熟客筛选、递名接口和本人提交的现实经营材料；她不知道契约者巡视存在，不掌握私域最终审核细节，也不掌握后台的异常目标判断。
          - 契约者巡视者只知道晏林的精神之海反应异于普通人及该被动标记需要留痕，不知道于静推荐之外的完整审核材料，也不知道晏林真实目的。
          - 顾清言或私域核心后台可以同时看到普通递名与被动标记，但不能据此直接确认晏林身份、能力或动机，也不能据此安排精神试探。
          - 晏林此时只知道私域存在、门槛较高且于静能够递名；他不知道灰黑业务结构、白玥受控状态或顾清言的完整责任链。
          - 私域核验晏林的公开履历，不因此取得野人户外人员、用户、工厂、渠道或心理咨询来访资料。
      - heading: 不得写偏
        value: |-
          - 不把本场提前到晏林尚未形成反复真实消费记录时。
          - 不让于静主动提问变成色情项目推销，也不把她写成私域会员审批人。
          - 不让于静知道或转述契约者巡视结果，也不在她的递名材料中加入“精神异常”“疑似契约者”等判断。
          - 不让客人的一句炫耀把私域客观定义成只提供陪侍和性交易的场所。
          - 不强行压缩递名、审核、缴费和会员资格生效的现实流程；具体间隔由章纲决定，但完成后可按正常预约进入。
          - 不把会员资格写成顾清言七层权限、闭门活动邀请、人员服务或身体授权。
          - 不把会费制写成按次入场、按楼层重复收费或以临时补款解锁楼层；具体房间、套间和设施仍服从预约、占用及现场规则。
          - 不把被动标记写成读心、能力鉴定、准入资格、追加排查或白玥精神试探，也不让它取代公开身份与场所侧审核。
          - 不让晏林以野人户外名义报销私人消费，也不把公司资源转为私人调查资源。
          - 不以“后来用于调查”抹掉晏林最初真实存在的私人欲望。
