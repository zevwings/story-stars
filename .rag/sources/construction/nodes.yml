    scope: 未分章施工
    transition: ""
    note: 固定晚会初见、杨柳明确拒绝、完整倒卷、裴怀民感知错位、晏林立即追白玥与私域现场压事。
    summary: "- 本页不记录生命周期状态；当前状态只从 story/construction/status/ 读取。"
    headings:
      - 使用边界
      - PL-S-145、PL-S-146｜白玥多笔订单与行为责任形成
