          | 终局现场复核 | 固定有限可见结果 | 外部只能确认反派连接失效、调度错误及普通梦境任务摘要不足以解释全部结果 | 现场结果不能唯一证明断流、倒卷、双子星结构或四权柄分配；管理局只向任务人员调用最低必要机密信息 | `PL-M-028、PL-M-029`、`PL-S-007` |
          | 终局后授权复核 | 留下可追踪、可复核的主体异议 | 晏林在机密任务授权复核中提交本人书面异议，并绑定材料访问审计编号 | 异议不否认完整报备与公共安全责任，只反对无证据推定、非必要扩权和持续征用；本行只复核既有边界，不倒置前述告知和授权顺序 | `PL-M-025、PL-M-027`、`PL-S-007` |
