      - heading: PL-S-111｜于静收监与云顶关停
        value: |-
          - **正式节点**：[PL-S-111｜于静收监与云顶实体关停](../../plotlines/副线/组织/云顶KTV/于静收监与云顶实体关停.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
