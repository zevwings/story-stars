    source_file: story/construction/云顶KTV会所线/04_梦露月月.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 场次作用
        value: |-
          这是梦露与月月第一次共同 COS。它承接上一场同款异色普通夜装：上一场只用版型和黑白色块说明两人熟悉，本场再把这种成组感推进为一个共同主题。
          双人 COS ①不承担复杂角色转换，也不建立具体作品或人物对应关系。两人共同采用轻量黑白女仆造型，重点是“看一眼便认出主题、坐下来仍能正常社交”，不与梦露此前貂蝉造型的高冠、重袖和完整角色妆竞争。
      - heading: 视觉参考
        value: |-
          参考视频：
          `/Users/zevwings/Library/Mobile Documents/com~apple~CloudDocs/inimate/参考/服装/v0300fg10000d9jdoinog65vkchc8f60.MP4`
          视频参数为 720×1280、30 帧／秒、总长约 12.37 秒，共 371 帧。画面依次提供背面、正面全身至膝部、腰身与围裙近景以及上半身动态；约 9.4 秒后进入平台尾卡。
          采用范围：
          - 黑色短袖连衣短裙、白色大翻领和白色肩部荷叶边组成的基础黑白关系。
          - 高腰白色短围裙、双排黑色心形扣、花边围裙沿与背后白色蝴蝶结。
          - 黑色伞形短裙摆与白色过膝袜形成的腿部比例。
          - 白色褶边发箍配小型黑蝴蝶结的轻量头部识别。
          不采用范围：
          - 参考人物的面容、身体比例、长发长度、姿势表演、滤镜和拍摄环境。
          - 平台水印、账号与搜索文字。
          - 画面没有出现的鞋履、裙内安全层和具体闭合方式。
      - heading: 双人简化原则
        value: |-
          1. **同一主题**：两人都穿黑白女仆装，不拆成女仆与主人、黑女仆与白女仆或两个作品角色。
          2. **同一基础版型**：连衣裙、围裙、发箍和过膝袜保持同款，只按各自身形调整尺寸。
          3. **不使用假发与瞳片**：保留梦露和月月本人的自然深色头发与眼睛，降低准备量，也让上一场建立的本人辨识继续存在。
          4. **不增加第二套符号**：不叠猫耳、兽尾、项圈、铃铛、袖箍、手铐、翅膀或大型胸针。
          5. **不依赖道具**：不要求托盘、茶具、扫帚或食物才能认出主题。发箍、翻领和围裙已经足够完成女仆识别。
      - heading: 黑色连衣短裙
        value: |-
          - 主体为低光泽黑色连衣短裙，上身合体，腰线略高，腰下迅速放开成轻量 A 字／小伞摆。
          - 裙摆停在大腿上段，走动时可以离开腿部形成小幅展开，落座时必须主动整理。
          - 短袖贴近上臂，袖山有小体量白色荷叶边，袖口再收一圈窄白边；不扩大成泡泡公主袖。
          - 肩部白色褶边与黑色袖身之间界线清楚，在云顶暗光中仍能看见肩线。
      - heading: 白色翻领
        value: |-
          - 领口采用宽大的白色圆角翻领，左右领片在锁骨前方相接，领下垂一小段白色软褶。
          - 正中只系一枚细黑蝴蝶结或窄黑领结，不使用宝石、铃铛或蕾丝颈圈。
          - 翻领是坐下以后仍然可见的第一主题锚点，不能缩成普通白衬衫领。
      - heading: 白色短围裙
        value: |-
          - 围裙从高腰开始，使用两条窄白肩带连接前片，不另加覆盖整个上身的白色围裙胸兜。
          - 前片长度明显短于黑色裙摆，外沿围一圈细白褶边或窄蕾丝。
          - 腰头保留两排小型黑色心形扣，每排两枚即可；这是整套唯一允许的图形化小装饰，不继续增加心形配件。
          - 围裙带在背后系成一个中等大小的白色蝴蝶结，两条尾带垂至黑色裙摆中段。蝴蝶结使用软布，不做成撞椅背的硬挺大结。
      - heading: 发箍与袜装
        value: |-
          - 两人统一使用白色短褶边女仆发箍，左右各有一个小型黑蝴蝶结或黑色细带固定。
          - 发箍只占据发顶一小段，不使用高耸蕾丝冠、猫耳底座或垂至脸侧的复杂带饰。
          - 两人都穿白色半透或低光泽过膝袜，袜口平整，停在膝上少量位置；不叠吊带袜夹、腿环或蝴蝶结。
          - 视频没有展示鞋。云顶版本补一双黑色圆头低跟玛丽珍鞋或简洁短跟鞋，鞋跟以能够正常走廊行走为准，不使用厚底舞台鞋。
      - heading: 梦露
        value: |-
          - 保留自然深黑发，扎成半高马尾或将上半部分束起，再把女仆发箍固定在发束前方。
          - 夜间妆面比月月略清楚：眼线更利落，唇色偏水红／莓红。
          - 她的动作可以更准确、稍有展示感，但不持续表演夸张的鞠躬、托盘或动漫式手势。
      - heading: 月月
        value: >-
          - 保留中分或轻偏分深色长发，自然披下，只把发箍后的头发拢顺，不复制梦露的束发方式。

          - 妆面使用灰粉或浅棕眼影、柔和下睫毛与低饱和水红唇，维持本人更轻、更柔的面部重心。

          - 她的高挑身量会自然拉长相同裙装和过膝袜之间的腿部比例，不通过缩短裙摆制造额外差异。

          两人的衣装差异只停在发型、妆面和身形落点，不改裙色、围裙色或袜色。第一套双人 COS 越像同一个组合，后续双人 COS
          ②才越有空间通过角色配对、颜色和轮廓升级。
      - heading: 云顶 KTV 适配
        value: |-
          - 裙内增加与黑裙同色的贴身安全短裤，解决短裙落座、起身和走动问题；安全层不作为外露造型重点。
          - 围裙前片和背结使用按扣或暗扣连接，弄皱、沾湿或妨碍靠坐时可以由本人拆下，黑色连衣裙仍保持完整。
          - 发箍、领结和围裙是完整主题的三个必要件；若需要减装，先去掉背后蝴蝶结体量和围裙，再摘发箍，不在一开始就堆满配件。
          - 袜装和鞋履必须允许两人各自独立离场。不得把女仆装处理成离开包厢便无法正常穿着的舞台壳。
      - heading: 双人进入与活动方式
        value: |-
          1. **共同出现**：先由两块相同的白色翻领和围裙进入暗光，让主题在两人开口前成立。
          2. **并肩区分**：梦露的束发与更利落妆面在较低一侧，月月的披发和高挑轮廓在另一侧；不靠不同角色名区分。
          3. **轻量回应**：允许一次简短的共同问候或各自整理围裙，不设计整套女仆台词、服务流程和主从称谓。
          4. **正常社交**：落座后两人可以自然聊天、取杯和调整裙摆，不要求始终把双手叠在腹前维持拍摄姿态。
          5. **退出主题**：先解下围裙或摘掉发箍，黑色短裙便回到普通夜装轮廓，角色退出清楚且不复杂。
      - heading: 正文优先锚点
        value: |-
          每次调用只取一至两个：
          1. 两个相同的白色褶边发箍在深色头发上并排出现。
          2. 宽白翻领和细黑领结把女仆主题留在两张不同的脸下。
          3. 高腰短围裙上的四枚黑色心形扣。
          4. 两只白色背结落在黑色小伞裙上，走动时轻微错开。
          5. 同款白色过膝袜停在不同高度的腿线上。
          6. 落座前两人分别整理自己的短裙与围裙，没有镜像摆拍。
      - heading: 与相邻衣装的区分
        value: |-
          - 与上一场黑白抹胸和黑色短裤相比，本场继续使用黑白配色，但由翻领、围裙、发箍和伞裙建立明确主题；露腰结构完全消失。
          - 与梦露单人貂蝉 COS 相比，本场没有假发、瞳片、高冠、面饰、重袖和主题道具，准备量与角色负担明显降低。
          - 双人 COS ②不得再次采用黑白短裙、白围裙或女仆发箍，应从颜色和主轮廓上整体换轨，而不是给本套继续添加猫耳或复杂道具。
      - heading: 执行边界
        value: |-
          - 女仆只是当次共同 COS 主题，不构成现实雇佣、主从身份或对任何人的服从义务。
          - 同款衣装、共同问候和一起到场不构成共同报价、共同离场或共同身体授权。
          - 梦露与月月分别决定是否继续佩戴发箍、围裙和袜装，也分别决定自己的拍摄、保存与传播边界。
          - 本场不使用具体作品名、角色名或品牌，不把通用女仆元素写成梦露、月月永久拥有的固定制服。
      - heading: 当前结论
        value: |-
          第四次衣装锁定为“**梦露＋月月同款轻量黑白女仆 COS**”：低光泽黑色短袖伞摆连衣裙、白色大翻领、细黑领结、白色肩部褶边、高腰短围裙、四枚黑色心形扣、背后软蝴蝶结、白色褶边发箍、白色过膝袜与黑色低跟鞋。
          两人不使用假发、瞳片、猫耳、项圈和大型道具。双人完成度来自同款并排，而不是配件数量。
