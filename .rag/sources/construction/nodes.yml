    source_file: story/construction/白玥订单与倒卷线/02_白玥欲望余波缓冲与一周后管理局入案.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 使用边界
        value: |-
          - 本页从 `CON-0017` 的“白玥离开、晏林不参与杨柳现场处置并立即跟上”开始。
          - 第零天完成车内第一次并转入酒店；次日在真实休息和离开间隔后，由白玥再次主动；其后保留约五至七天缓冲，约第六至第七天再进入管理局。
          - 车内第一次、次日第二次、缓冲互动、本人入案和管理局程序各自承担不同职责，不用一个场景替代另一个。
          - 本页不承担后续证据交叉核验、上游定位、责任认定、监管解除或长期关系确认。
      - heading: 连续顺序
        value: |-
          | 顺序 | 时间 / 场景 | 必须发生 | 执行边界 |
          | --- | --- | --- | --- |
          | 1 | 第零天·私域外跟车 | 晏林因认出白玥与安若曦事件的联系而跟上，原本准备追问；白玥能够自行离开 | 晏林不是执法者，不实施拘留、正式讯问或持续战术控制 |
          | 2 | 第零天·车边选择 | 白玥没有驾车离开，而是主动留在车内并打开让晏林接近的现实入口 | 留下只证明继续靠近，后续仍须保留拒绝、停止与离开能力 |
          | 3 | 第零天·原始欲望爆发 | 返还欲望仍强烈，晏林自身高欲求也真实在场；两人不靠解释性对白，直接由相互靠近推进第一次身体关系 | 白玥必须仍能理解、拒绝、停止和离开；身体反应、完整倒卷或危险感都不能单独构成同意 |
          | 4 | 第零天·车内第一次 | 两人在车辆这一封闭但可退出的空间完成第一次身体关系 | 不完成爱情、长期主从、完整交付、阵营转换、证言可信或责任减免 |
          | 5 | 第零天·转入酒店 | 两人离开车辆，进入安静、可控制出入口的酒店落脚，并完成休息、进食与现实安顿 | 酒店不是拘留点；白玥保有房门、通讯、交通与独自离开的现实条件 |
          | 6 | 次日·第二次主动 | 睡眠、进食和可离开间隔成立后，欲望余波仍未完全稳定；白玥在能够判断和停止的状态下再次主动靠近，晏林回应，两人完成第二次身体关系 | 第二次是新的当次选择，不是第一次授权的延续；欲望余波只构成压力背景，不构成同意 |
          | 7 | 次日至约第六天·低压力相处 | 两人保留若干次短时、可中断的相处：共同进餐、短途同行、安静休息或有限谈话；至少一次由白玥独自离开，之后再由她主动恢复联系 | 不提前定义恋爱、同居、长期主从或排他关系；晏林不追踪、不催回，也不以连续亲密替代对白玥状态与边界的判断 |
          | 8 | 次日至约第六天·记录整理 | 白玥独立整理自己本来持有的线上任务、支付、反馈、拒单、中止与异常结果等记录，并逐步决定是否进入正式程序 | 不继续接单，不进行高风险私查、诱导上游露面、入侵平台或隐匿、篡改证据；晏林不替她筛选供词 |
          | 9 | 约第六至第七天·主动进入程序 | 白玥自行决定本人到管理局说明，晏林可以同行，但不代报、不代交、不替她组织说法 | 同行不构成担保、作保、包庇、证据交换或亲密关系回报 |
          | 10 | 入案当日·分开问询 | 白玥与晏林分别陈述；晏林披露两人在入案前一周内已经发生私人身体关系，只说明本人直接经历 | 晏林退出白玥证言筛查、解释、保护方案决定和责任判断 |
          | 11 | 入案当日·线上痕迹与私域方向入案 | 白玥移交任务标识、时间、支付、反馈、目标代号、拒单、中止和异常结果等现有记录，并说明私域可核查记录方向 | “当前无法定位具体上游”不写成客观永久不可追查；一份陈述或记录不能证明完整责任链 |
          | 12 | 入案当日·个人担保提出 | 各自问询完成后，晏林在必要的保护方案讨论中提出可以为白玥担保 | 只表达晏林愿意承担的私人态度；不恢复他对供词、保护和责任判断的参与权 |
          | 13 | 入案当日·风险责任追问 | 沈宁追问担保依据与后续风险由谁承担，否决以个人承诺替代正式方案 | 不把反问写成羞辱或吃醋；她是在确认制度责任不能悬空 |
          | 14 | 入案当日·管理局提出方案 | 管理局正式提出不依赖种印的普通保护与监管路径，以及自愿有限监管印；沈宁说明两者的范围、风险、复核和解除路径 | 星辰之印由管理局提出，不由晏林要求；拒绝种印不取消保护、不加重责任、不影响正常陈述资格 |
          | 15 | 入案当日·本人选择与晏林种印 | 白玥在足以理解并拒绝的状态下，自愿选择有限监管印，并接受由晏林建立；沈宁代表管理局承担制度风险并指定晏林按记录条款执行 | 若能力影响仍妨碍判断，必须继续等待；晏林只取得有限安全提示，不恢复供词、保护和责任判断权限 |
          | 16 | 入案当日·程序收束 | 完成初步问询、保护接入、程序记录与监管印建立 | 不完成证据核验、上游定位、责任认定、调查或结案 |
      - heading: 管理局议程锚点
        value: |-
          - 这组三句只负责把晏林的私人态度与管理局的制度责任分开，并由沈宁顺势引出正式保护方案和星辰之印。
          - 沈宁不接受个人担保，但给出兼顾制度与白玥安全感的答案：管理局负责审批、监管响应、复核与解除程序；白玥若明确同意，由她已经信任且受过训练的晏林建立印记。
          - 这段不讨论或解释车内第一次、次日第二次，也不把两人的私人关系当成担保依据。
      - heading: 车内第一次的表达门禁
        value: |-
          - 不安排关于“是否认出”“为什么跟上”“刚才算什么”或把追问与欲望并列解释的对白，也不以近义句改写。
          - 不在车内、酒店或后续关系中重新讨论这次性爱为何发生、由谁控制、意味着什么。
          - 白玥第一次承受自己过去习惯施加给他人的高压欲望，只能作为动作、体感和停顿下的潜台词；不得由她总结“已经理解受害者”，也不能等同于杨柳、安若曦等人的完整处境。
          - 晏林不被写成无欲圣人。他跟上有追问意图，同时也确实想要白玥；文本不需要让他把两者说出口。
      - heading: 欲望余波与次日第二次门禁
        value: |-
          - 第二次之前必须出现睡眠、进食、清醒观察和真实离开机会，不能把两个场次写成一段没有退出间隔的连续消耗。
          - 白玥必须以可见行动主动开启第二次，且当时仍能理解、拒绝、停止和离开；晏林的回应也必须来自自身欲望与当次选择。
          - 欲望余波可以解释白玥仍然很想要，却不能替她作答；第二次授权不从第一次继承，也不向以后自动延续。
          - 第二次只让白玥进一步尝到“欲望压在自己身上却仍由自己选择”的反向体验，不自动完成悔悟、爱情、忠诚、完整交付或长期关系确认。
          - 两人仍不解释车内第一次为何发生，也不把第二次写成对第一次的关系复盘。
          - 第二次不得与晏林陪同入案、保护、担保、种印、证据处理或责任减免交换。
      - heading: 缓冲互动与谈话议程
        value: |-
          - 可安排的低压力互动：
          - 酒店早餐、普通进餐、短途同行或短暂休息；
          - 白玥独自离开处理生活事务，过一段时间再由她主动恢复联系；
          - 与案件无关的普通偏好和近期生活安排，只建立“可以相处”的经验，不讨论关系名称；
          - 在有明确结束时间的前提下整理各自经历过的事件顺序；
          - 白玥独立整理已有记录时，晏林只回答与本人直接经历有关的问题；
          - 中间保留分开行动、不联系和白玥独处判断的时间。
          - 可谈：
          - 白玥大学时期未登记觉醒与进入匿名任务链的事实；
          - 她早期相信的任务包装、后来发现的拒绝与现实后果；
          - 所有合作均经线上匿名渠道完成；
          - 她目前不能定位具体上游人员；
          - 她能够移交的线上记录类型；
          - 私域存在更多订单、人员、活动、房间、车辆、排班与结算交叉。
          - 不谈：
          - 两次身体关系的动机、性质、关系定义与未来承诺；
          - 以身体关系换取保护、免责、种印、担保或相信；
          - 未经核验的具体上游身份和完整责任链。
          - 缓冲期不是同居试运行、恋爱确认或私人审讯；除已经固定的次日第二次外，不继续预设更多身体关系场次。
      - heading: 监管印条款
        value: |-
          - 方案由管理局提出、审批并记录；白玥明确选择后，由管理局指定晏林建立。
          - 只承载以下明确提示：
          - 离开约定保护范围；
          - 接触指定黑市联络链；
          - 接触、转移或处置已经移交的证据；
          - 监管状态异常。
          - 不读取记忆，不控制欲望，不命令身体，不施加私刑惩罚。
          - 不证明忠诚、爱情、清白、证言真实或免责。
          - 晏林只接收条款预设的有限安全提示，并须转报管理局；他不复核印记，不取得案件监管、证据判断或责任裁定权限。
          - 私人关系继续、暂停或结束都不自动扩大、缩减或解除印记。
      - heading: 视角与知情边界
        value: |-
          - 车内第一次固定使用单一贴身视角，不跨人物读取内心；另一人的意愿只能通过可见动作、回应、停止与继续判断。
          - 缓冲期谈话只能写当场说出的事实，不替白玥确认未说出口的赎罪、受害认同或长久感情。
          - 管理局场景中，晏林不知道白玥分开问询的完整内容；白玥也不知道晏林如何评价她的证言。
          - 沈宁只掌握程序需要的既有私人关系披露、风险与印记范围，不取得两人全部私人细节。
      - heading: 不得写偏
        value: |-
          - 不把约一周缓冲写成两人持续绑定或由晏林监管白玥；每次接触都须有明确开始、结束与离开条件。
          - 不把恢复判断能力写成欲望完全消失；关键是白玥能够理解、拒绝、停止和离开。
          - 不让晏林代理汇报、筛选供词或凭私人关系成为唯一承办人。
          - 不让晏林的个人担保被正式接受；他可以成为种印者和有限安全提示接收者，但不能成为复核人、案件监管人或风险责任主体。
          - 白玥主动入案和种印后，责任处置、退出与长期关系确认仍分别推进。
  - id: CON-0031
    truth_level: construction
    name: 私域首次游玩留宿与非付费共同兑现
    package: 云顶KTV会所线
    status: active
    plotline_owner: 亲密线 / 晏林
    plotline_interfaces: PL-I-041、PL-S-099
    scope: 阶段四开局
    transition: ""
    note: 固定只有小鱼儿、悦悦同行的游玩、用餐、留宿、非付费无女女共同兑现与次日离开；悠悠、娜娜、阿九不进入本次行程。
    summary: "- 位于阶段四开局，发生在 CON-0029 完成会员资格以后、阿九独立事件之后。"
    headings:
      - 场景位置
      - 行程顺序
      - 关系执行
      - 店级负责人接口
      - 不得写偏
    content_indexed: true
    source_file: story/construction/云顶KTV会所线/私域首次游玩留宿与非付费共同兑现.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 场景位置
        value: |-
          - 位于阶段四开局，发生在 `CON-0029` 完成会员资格以后、阿九独立事件之后。
          - 云顶 KTV 的调查仍在推进，但本次到场不执行调查任务，不安排取证、试探、追问、入梦或异常目标观察。
          - 顾清言本次不与晏林正式见面；私域店级负责人杨钰琪承担正常接待、来宾登记、空间协调与离场记录。
      - heading: 行程顺序
        value: |-
          | 顺序 | 场景功能 | 必须发生 | 执行边界 |
          | --- | --- | --- | --- |
          | 预约与登记 | 区分会员与受邀来宾 | 晏林预约当次空间并登记小鱼儿、悦悦；两人各自确认同行 | 来宾不取得会员身份，闺蜜不能互相代理 |
          | 下午游玩 | 先建立正常会所吸引力 | 三人在内庭、临水步道及外围运动设施中选择一至两项活动 | 不写成公开度假区，不借运动制造身体授权 |
          | 晚间用餐 | 完成私人行程的生活质感 | 三人在三层用餐，再使用二层酒吧、观影、台球等普通娱乐空间 | 不插入案件线索、顾清言试探或白玥信息 |
          | 套房确认 | 分开住宿与身体授权 | 进入已经预约的五至六层短住套间前，分别确认房间安排、留宿和当晚私人范围 | 同一套间不等于共同身体关系；任何人可换房或离开 |
          | 非付费共同兑现 | 使私人转向第一次成立 | 三人分别确认后共同进入；小鱼儿与悦悦各自面向晏林，不发生女女身体互动 | 会费、房费、餐饮和娱乐消费不是服务费用；不设隐性资源交换 |
          | 次日回落 | 证明关系不靠封闭场景维持 | 睡眠后以早餐、散步或短时运动回到普通交流，并按各自安排离开 | 不用醒后状态倒推永久授权，不强留、不直接同居 |
      - heading: 关系执行
        value: |-
          - 本次发生前须明确“不按服务收费”；晏林结清的只是会所行程消费。
          - 小鱼儿保留本人状态与角色状态的切换权；悦悦保留自己组织观看与展示节奏的主动权。两人的既有服务分型可以转化为私人表达，但不能写成无偿履行旧服务义务。
          - 小鱼儿、悦悦均有稳定伴侣，两人的伴侣及家人不知道云顶、本次私域行程与由此延伸的私人关系；该信息只作生活背景，本单元不补伴侣身份，不制造道德审判或家庭冲突。
          - 小鱼儿、悦悦、悠悠互为好闺蜜；本次悠悠不参加。三人共同场只建立小鱼儿—晏林、悦悦—晏林两条同场身体关系，小鱼儿与悦悦本次没有女女身体互动；这一历史事实不封闭三位闺蜜后续共同亲密时的逐次选择。
          - 本次只打开低频、逐次确认的非付费私人入口，不保证复现或形成固定频率；云顶付费关系结束后的关系位置另由 `PL-I-038` 确认。
      - heading: 店级负责人接口
        value: |-
          - 私域店级负责人杨钰琪负责来宾登记、运动与餐饮预约、套房协调、晚间隐私要求和次日离场记录。
          - 杨钰琪30岁，是顾清言直属下属；本场只调用其正常经营职责，不扩写背景、契约状态或私人关系。
          - 负责人不进入三人私人空间，不替任何人授权，也不在本场提供黑产信息。
      - heading: 不得写偏
        value: |-
          - 不把三人第一次非付费共同兑现写成小鱼儿或悦悦“赠送服务”、免单、赊账或为后续资源交换。
          - 不安排小鱼儿与悦悦之间的女女身体互动，也不把无女女写成两人敌对、吃醋或互相回避。
          - 不把顾清言正式初遇、杨柳拒绝、白玥施术或裴怀民出现提前塞入本场。
          - 本场普通会所体验与私域另行存在的涉案经营分别成立，互不替代。
