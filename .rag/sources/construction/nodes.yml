        value: |-
          本场不再承担双人 COS ③，而是让梦露与月月以完全现实的夜场火辣装重新组成黑白镜像。两人只使用同版短抹胸与斜向堆褶超短裙，不穿造型外套，不使用假发、兽耳、角色瞳片、翅膀或主题道具。
          颜色分配反转第 05 场黑白天使：梦露改穿全白，月月改穿全黑。反转既避免梦露连续固定在暗色一侧，也让月月调用她衣装体系中的冷色暗面方向，但本场只保留现实夜装，不进入幻想角色。
      - heading: 视觉参考
        value: |-
          参考视频：
          `/Users/zevwings/Library/Mobile Documents/com~apple~CloudDocs/inimate/参考/小玥玥/v0d00fg10000d842j37og65g5r73kd00.MP4`
          视频参数为 720×1280、约 12.17 秒。画面主体是黑色短抹胸、低腰斜向堆褶超短裙、廓形黑西装、单侧腿环、浅色假发与耳饰；抹胸胸前另有银色放射纹装饰。视频没有展示脱下外套后的背面结构，也没有提供白色版本。
          采用范围：
          - 短抹胸与超短裙之间保留完整腰腹的上下分体轮廓。
          - 超短裙由斜向包裹、侧边堆褶和不对称裙口形成的贴身结构。
          - 同一纯色通过哑光抹胸与带轻垂坠的裙料形成层次。
          - 尖头鞋、裸腿与极短裙摆共同拉长腿部线条的夜场构图。
          调整范围：
          - 删除视频中的廓形西装，不把它作为入场揭示或主要造型的一层。
          - 删除抹胸正面的银色放射纹、单侧腿环、浅色假发、兽耳感发饰和角色化妆造。
          - 不照搬参考人物的面容、身体比例、发色、动作表演、拍摄地点、账号与平台界面。
          - 视频只提供黑色单人版本；梦露的白色套装属于本场按同版反色原则重新施工。
      - heading: 双人镜像规则
        value: |-
          | 人物 | 抹胸 | 超短裙 | 鞋履 | 妆发方向 |
          | --- | --- | --- | --- | --- |
          | 梦露 | 纯白 | 纯白 | 白色／银白尖头鞋 | 深黑束发、利落水红妆 |
          | 月月 | 纯黑 | 纯黑 | 黑色尖头鞋 | 深色披发、冷灰粉妆 |
          - 两套保持同版、同长度和同一斜向堆褶方向，只做黑白反色；不能把梦露改成白色甜美裙、月月改成黑色皮裙两套不同系统。
          - 每个人的上装与下装必须同色，形成一整块白与一整块黑；不再使用第 03 场“上衣反色、下身统一为黑”的分配方式。
          - 纯色不等于没有材质层次。抹胸以低光泽弹力面料保持轮廓，超短裙以轻垂坠弹力布产生褶影；不增加印花、亮片、蕾丝、金属链或撞色包边。
      - heading: 短抹胸
        value: |-
          - 两人使用同版无肩带短抹胸，上沿接近平直，只在胸线中央保留极浅弧度；下缘停在上腹，完整露出腰线。
          - 取消视频胸前的银色放射纹，正面保持纯色，只靠两道不明显的纵向省线和面料张力建立结构。
          - 内部使用软杯、防滑条和短侧骨，避免抬臂、落座和起身时上沿持续下滑；不使用透明肩带冒充无肩带结构。
          - 闭合优先放在背部短拉链或侧面隐形拉链。视频未展示背面，本场不声称沿用参考原款的扣合方式。
          - 梦露的白色版本增加白色与接近肤色的双层内衬，确保云顶侧光下仍然完整；月月的黑色版本用浅褶和露腰区切开暗光中的上下轮廓。
      - heading: 斜向堆褶超短裙
        value: |-
          - 两人使用同版低至中腰贴身超短裙，裙腰在肚脐下方，与抹胸之间形成清楚的裸露腰腹。
          - 前片以斜向包裹方式覆盖，从一侧腰头向对侧下摆拉出斜线；靠侧缝收出两至三道软堆褶，使纯色裙面不会变成普通直筒布片。
          - 裙口左右不完全等高，但最低侧仍停在大腿上段；不增加长垂片、流苏或拖尾。
          - 内部固定同色安全短裤，裤脚藏在裙摆以内，站立时不露边；安全裤属于现实内层，不把超短裙写成能够在所有动作中自动保持遮挡。
          - 白色版本使用双层不透结构，黑色版本通过堆褶阴影与腰腹反差保留可读性；两套都不使用漆皮、亮片和大面积反光缎。
      - heading: 无外套原则
        value: >-
          - 本场主要画面从进入包厢起就是抹胸与超短裙，不设置脱下西装的揭示动作，也不让任何造型外套搭在肩头。

          -
          梦露与月月到达云顶公共区域时仍可各自穿普通通勤衣物，并在独立换装空间完成更换；通勤衣物不进入本场造型清单，也不在包厢内作为第三层反复穿脱。

          - 包厢温度不足或本人感到不适时，可以结束主要展示、穿回自己的通勤衣物。无外套是造型选择，不是不得保暖或不得退出。
      - heading: 腿部、鞋履与配饰
        value: |-
          - 两人默认裸腿，不使用白色长袜、黑色丝袜、吊袜带和视频中的单侧腿环。
          - 鞋履使用同类尖头浅口鞋或简洁后空鞋：梦露为白色或银白，月月为黑色；鞋跟控制在能够经过云顶走廊和独立离场的高度。
          - 首饰各留一对小型耳饰即可。梦露可用冷银或珍珠白耳钉，月月可用枪灰或细银耳坠；不叠加项圈、腰链、手套和腿部饰品。
          - 两人都使用本人自然深色头发，不戴视频中的浅色假发和耳部造型件。
      - heading: 梦露｜全白
        value: |-
          - 自然深黑发做高马尾或利落半束，使深色头发与纯白抹胸形成清楚边界。
          - 眼线较清楚，唇色使用低饱和莓红或水红；不使用白色睫毛、浅色瞳片和角色妆。
          - 全白衣装落在梦露身上不是圣洁角色，而是由利落妆发压住甜度的现实夜场装。
      - heading: 月月｜全黑
        value: |-
          - 深色长发保持中分或轻偏分披下，脸侧留少量碎发；头发与黑色抹胸之间由裸露肩颈和锁骨切开。
          - 眼妆使用冷灰粉、细眼线与少量眼头提亮，唇色为低饱和水红；不使用黑色瞳片、裂纹妆和暗黑角色符号。
          - 黑色衣装调用她的冷色暗面审美，但不增加半透长层或主题头饰，保持纯粹的现实夜场构图。
      - heading: 云顶 KTV 适配
        value: |-
          - 梦露的白色套装会成为暗光中的第一亮面，必须依靠厚实内衬与低光泽面料避免过曝和透色。
          - 月月的黑色套装容易与深色沙发合并，需让裸露肩颈、腰腹和斜向裙褶分别切开上装、下装与背景。
          - 两人落座前分别确认抹胸上沿与裙摆位置；起身后可以自然整理侧边堆褶。衣装管理是现实动作，不编成同步表演。
          - 同版反色已经承担全部组合感，不再增加强光、发光配件或站位固定来制造黑白舞台效果。
      - heading: 双人进入画面的顺序
        value: |-
          1. **先看见完整反色**：梦露从抹胸到短裙都是白色，月月从抹胸到短裙都是黑色。
          2. **再看见相同剪裁**：两套抹胸的平直上沿、裸露腰腹与斜向裙口完全呼应，把一白一黑重新连成一组。
          3. **最后分清本人**：梦露的束发和偏红唇色更利落，月月的披发与冷灰粉妆更安静；不靠角色名和主题道具区分。
          4. **落回现实夜场**：两人分别整理自己的抹胸与裙褶，没有变装揭示、角色语言或持续扮演。
      - heading: 正文优先锚点
        value: |-
          每次调用只取一至两个：
          1. 梦露一身纯白，月月一身纯黑，两段裸露腰腹同时切开上下色块。
          2. 两条超短裙都从腰侧斜压过去，只在相反颜色中显出同样的堆褶。
          3. 月月的黑色裙褶靠近沙发时几乎沉下去，又被腿侧皮肤重新切开。
          4. 梦露抬手确认白色抹胸上沿，月月则把黑裙一侧的软褶重新拨顺。
          5. 没有外套、假发和道具，两人只靠同版剪裁与黑白反色成为一组。
      - heading: 与前面衣装的区分
        value: |-
          - 与第 03 场普通黑白夜装相比，本场不再使用两条统一黑色短裤，而改为每个人上下同色；梦露由黑转白、月月由白转黑，下装使用斜向堆褶超短裙。
          - 与第 05 场黑白天使相比，本场完全删除翅膀、羽片、背架与幻想妆造，并反转颜色分配；黑白只是一组现实夜场配色。
          - 与第 07 场淼淼黑色夜装相比，本场没有细吊带、牛仔毛边和烟灰罩衫，而是梦露、月月同版反色的抹胸与裙装。
          - 与第 08 场成年学院风双子造型相比，本场删除白衬衣、蝴蝶结、格纹和百褶结构，视觉从学院风直接切换到纯色贴身夜场装。
          - 第 11 场黑色情趣回归场不得继续使用抹胸、黑白镜像或极简现实夜装，而以风衣遮覆、半透蕾丝束腰、荷叶短裙与吊带丝袜建立新的内外层次。
      - heading: 执行边界
        value: |-
          - 本场是梦露与月月共同选择的现实夜场火辣装，不是 COS、云顶制服或场所固定项目。
          - 纯色、抹胸、超短裙、裸腿和两人共同到场都不构成共同报价、共同离场、拍摄、保存、传播或任何身体授权。
          - 两人分别决定抹胸上沿、裙摆、安全裤、鞋履与换装时间；其中一人的调整或退出不要求另一人同步。
          - 视频中的外套、腿环、假发和角色化配件已明确删除，不在正文中以临时追加方式重新出现。
      - heading: 当前结论
        value: |-
          第九次衣装锁定为“**梦露全白＋月月全黑的同版镜像夜场火辣装**”：两人只穿同版无肩带短抹胸与同版斜向堆褶超短裙，梦露上下纯白，月月上下纯黑；裙内保留同色安全短裤，画面中不出现造型外套。
          本场不是 COS。它删除参考视频中的银色胸饰、廓形西装、单侧腿环、浅色假发与耳部造型，只保留抹胸、裸露腰腹和不对称堆褶短裙的现实剪裁；第 11 场则改为梦露、月月的双人黑色情趣回归场，不再补建第三套双人 COS。
