    content_indexed: true
    source_file: story/construction/万安艺人显影线/01_万安艺人压迫显影与材料交叉.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 使用边界
        value: |-
          - 咨询、医疗、管理局核验、司法取证与职业安置分别运行。
          - 会所梦境与私人观察只提供异常方向，不替代当事人材料和现实记录。
          - 乔宁只调用本人独立人物线已经恢复的部分记忆；她不负责提交首批材料，也不组织其他艺人交证。
          - 不把程叙、乔宁、梁予安、何知远或会所外围新人写成相同经历。
          - 杨柳、燕若淇、侯瑞驰等人的既往经历可以在调查介入前交织发生；调查显影顺序不等于历史发生顺序，也不要求预先排出全员经历的完整时间表。
      - heading: 对应正式节点
        value: "-
          [PL-S-188｜组织性艺人压迫模式](../../plotlines/副线/组织/万安影视文化/组织性艺人压迫模式.md)、[PL-S-\
          189｜私域项目导流](../../plotlines/副线/组织/万安影视文化/私域项目导流.md)、[PL-S-190｜多人案件交叉验\
          证](../../plotlines/副线/组织/万安影视文化/多人案件交叉验证.md)、[PL-S-191｜合法业务托管与艺人自主职业选\
          择](../../plotlines/副线/组织/万安影视文化/合法业务托管与艺人自主职业选择.md)"
      - heading: 执行顺序
        value: >-
          | 顺序 | 场景功能 | 必须发生 | 执行边界 |

          | --- | --- | --- | --- |

          | 程叙现实危机 | 建立首个具名入口 | 医院先完成急性医疗处置；程叙稳定并同意后进入咨询支持 |
          不描写可模仿方法，不由一次咨询直接诊断能力伤害 |

          | 分阶段陈述 | 让当事人保有选择 | 程叙分次说明本人经历，并只提交本人愿意进入程序的材料 | 不强迫完整披露，不把咨询变成侦讯 |

          | 秘密调查进入 | 防止单一个案概括组织全貌 | 管理局从乔宁异常记忆缺失方向介入，警方沿现实系统秘密调查 |
          不要求艺人集体递交材料；每项信息保留来源、权限和证明范围 |

          | 交织显影 | 让多名当事人的片段逐步形成交叉 | 调查按“当下接触或询问 → 本人可承受的记忆片段或陈述 → 对应现实记录 →
          指向下一人物、项目或场所”的方式推进 | 最先进入询问的人不等于最早受害者；记忆不是录像，不用单一片段确定完整历史顺序或司法责任 |

          | 方法差异核验 | 区分不同执行者责任 | 调查分别核验裴兰馨压低警觉与求助紧迫感、任群限制少数具体行为的不同方法 |
          不写永久封口、群体控心或绝对服从 |

          | 职业与场所记录交叉 | 把行业传闻推进为可验证结构 | 万安合同、项目、资源与公关记录同私域预约、项目登记、人员调度、出入和结算记录交叉
          | 任何记录都不能单独证明陪伴、拍摄、观看或身体行为授权 |

          | 重复模式成立 | 完成组织层显影 | 管理局异常核验与警方现实调查共同显示短期包装、资源压迫、私人项目与场所输送存在重复方法 |
          不把单一梦境或部分恢复记忆直接推广为全体经历 |

          | 统一收网接口 | 保留后续行动门槛 | 阶段四只标记涉案管理层、项目、资料与场所接口；控制人员、资料保全和项目托管等待阶段五统一收网 |
          不提前惊动管理层，不让任何艺人承担诱饵或集体交证职责 |
      - heading: 材料边界
        value: |-
          | 材料来源 | 可以证明 | 不能单独证明 |
          | --- | --- | --- |
          | 当事人陈述或恢复记忆 | 本人的经历、拒绝、后果与授权范围 | 其他人的经历、整家公司性质或完整责任链 |
          | 万安合同、项目、资源与公关记录 | 职业关系、资源控制与项目流向 | 具体私人行为已经得到同意 |
          | 私域预约、出入、房间、调度与结算 | 人员进入场所及现实调度 | 完整上游责任与每项具体授权 |
          | 医疗、咨询与管理局记录 | 风险、治疗、转介与异常核验过程 | 司法责任与当事人未授权隐私 |
          | 会所梦境与私人观察 | 早期异常方向 | 正式证言、诊断或定罪事实 |
      - heading: 显影排序
        value: |-
          - 先确定当下调查入口，再按该入口能够合法取得的材料回看既往片段；不按作者全知时间线把所有侵害依次播放。
          - 可以先询问燕若淇，再由她的多次药效漂移指向项目、客户、医疗或场所记录；这只决定她先进入调查叙事，不决定她是最早受害者。
          - 杨柳、燕若淇、侯瑞驰各自只说明本人经历与后果；不同人物的片段经现实记录交叉后才形成重复模式。
          - 具体由谁首先接受正式询问、首轮显影哪些代表性片段，在对应章纲启动前确定；不预先固定全部章号、精确次数和严格总排序。
      - heading: 不得写偏
        value: |-
          - 不把晏林写成主动调查艺人群体的人，也不让私人关系、咨询和取证合并。
          - 不让乔宁承担首批材料、全部名单、替同行作证或组织集体递交材料的职责。
          - 不把风归人员自动并入万安合同与责任链。
          - 不用托管、解约或复工作为所有当事人的统一恢复答案。
