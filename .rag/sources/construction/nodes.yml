    content_indexed: true
    source_file: story/construction/风归熟客回流线/01_风归熟客回流与逐次授权.md
    registry_file: story/construction/_status/active.md
    sections:
      - heading: 使用边界
        value: |-
          - 阶段四共十个月；其中回路集中建立期约三个月，前段约一至两周一次，稳定后约每月三至四次。有限同盟形成后降为偶尔调用，固定主位与真实职业缺席替补在阶段四其余时间低频继续。
          - 不固定精确章号、日期、完整场景、衣装与身体流程。
          - 不把七人写成相同经历，不为承担一次证据功能的人物自动扩建独立线路。
          - 顾清言安排给晏林的全部接待均为非付费安排；其他客人的有偿陪侍可以存在，但不得倒推出晏林与当事人之间存在费用、购买或偿还关系。
          - 本施工单元为便于真源检索仍使用真实姓名；晏林在阶段四风归回流期间只知道猫猫、甜甜、梦露、盈盈、海棠、书书、慢慢七个代称，不知道其与舒歆、田恬、言溪、孔蔓盈、周语棠、钱韵、万芳的对应关系。后续若公开真实姓名，须另由已确认场景承接。
          - 顾清言精神止损与有限交底由 `CON-0018` 承接；钱韵职业后果在七日邮轮后的阶段四后段由 `CON-0035` 承接。
      - heading: 对应正式节点
        value: |-
          - [PL-S-121｜风归熟客回流与逐次授权回路](../../plotlines/副线/组织/风归/熟客回流与逐次授权回路.md)
          - [PL-S-127｜私密拍摄试探与保密判断成立](../../plotlines/副线/人物/顾清言/私密拍摄试探与保密判断成立.md)
          - [PL-I-044｜舒歆固定主位与会所阶段长期关系](../../plotlines/亲密线/晏林/舒歆-固定主位与会所阶段长期关系.md)
          - [PL-I-045｜言溪固定主位与会所阶段长期关系](../../plotlines/亲密线/晏林/言溪-固定主位与会所阶段长期关系.md)
          - [PL-I-050｜成人视频模仿与主动服侍偏好校准](../../plotlines/亲密线/晏林/田恬-成人视频模仿与主动服侍偏好校准.md)
      - heading: 执行顺序
        value: >-
          | 顺序 | 场景功能 | 必须发生 | 执行边界 |

          | --- | --- | --- | --- |

          | 第一次止损后 | 建立继续回到私域的现实掩护 |
          顾清言以正常客户维护、项目或场地协调继续邀请晏林；风归具名成年从业者首次成为明确人员来源 |
          面向晏林的安排不收费；不把客户维护写成报恩、调查合作或完整信任 |

          | 猫猫首位接待 | 建立风归回流的第一份会所体验基线 |
          舒歆（猫猫）是第一名实际接待晏林的人，以自然陪伴、专业协作与本人授权完成第一次接触 |
          首位不等于提前取得固定主位或永久权限；具体活动仍逐项确认 |

          | 甜甜随后进入 | 校准主动服侍与视频模仿 | 田恬（甜甜）在猫猫之后进入前期轮换，主动准备
          Cos、称呼与从成人视频学习的服务脚本；实际体验出现差异后，至少由本人修改、取消或暂停一项照搬安排，再继续本人确实喜欢的部分 |
          首次出场已满 18 岁；不情色化年龄；不把观看量写成经验，不把主动推出疼痛、束缚、羞辱、拍摄或 C 档，也不进入固定双主位 |

          | 其他前期轮换 | 让晏林看见人员接口与边界差异 | 言溪（梦露）及其他具名人员分别出现，各自确认当次范围 |
          对晏林只使用代称；不把不同人物写成互换模板，不由既往接受推出后续权限 |

          | 不再换人 | 从轮换转入固定主位 | 前几次之后，晏林明确不想继续换人；顾清言此后优先安排猫猫与梦露 |
          这不是复选、购买或排他承诺，也不取消两人的正常职业安排 |

          | 固定主位形成 | 建立会所阶段长期回路 | 舒歆与言溪分别持续复现，成为固定的两名主要长期伴侣 |
          两人的每次具体活动仍独立授权；本状态不进入全书 5＋5，也不取得共同秩序位置 |

          | 私密拍摄试探 | 让顾清言取得有限保密判断 |
          顾清言分别提出由舒歆、言溪接受私密照片或视频拍摄；当事人与晏林逐场确认拍摄、保存及范围，顾清言观察后续是否发生外流 |
          两人的授权互不通用；顾清言不得观看成片，也不能以安排者身份取得副本 |

          | 无泄露后的延续 | 将第一次测试转为可重复但非永久的影像边界 | 经一段现实间隔未出现泄露后，舒歆、言溪可以在后续场次继续同意私密短视频
          | 只形成有限影像保密判断，不等于完整行动信任；每条短视频仍须逐场确认 |

          | 职业缺席与临时替补 | 把固定主位与真实工作并置 |
          舒歆因商拍、商演，或言溪因漫展、角色拍摄、商演真实缺席时，孔蔓盈、周语棠、万芳等可临时补位；钱韵的缺席另由 `CON-0035` 承接 |
          替补须独立授权，不继承主位、B／C 档或拍摄权限；不得把职业缺席写成顾清言故意轮换 |

          | 主位回归 | 固定两人不因一次缺席被替换 | 舒歆或言溪结束外出工作后自然恢复原有主位，替补退出当次功能 |
          不安排主动复选，也不把临时替补发展成第三固定主位 |

          | 回路稳定后 | 把集中接触转成可持续背景 |
          舒歆、言溪继续低频复现，其他人物只按真实缺席与独立场景功能少量调用；回路可与顾清言止损接触交叉但不合并 |
          后续频率低于前期集中段；不固定人数、次数或日期 |
      - heading: 场景密度
        value: |-
          - 约四至五个完整场景优先承接猫猫首位接待、甜甜现实校准、不再换人、首次私密拍摄及一次职业缺席替补与主位回归；甜甜占用原前期轮换完整场景额度，不额外抬高总场景数。钱韵缺席、说情由 `CON-0035` 另行安排交叉。
          - 其余回流采用压缩交代或背景回声，不把每次接待都扩成同构完整场景。
          - 同一人物再次出现时，至少推进熟悉、边界、缺席、替补或材料显影中的一项。
      - heading: 授权检查
        value: |-
          - 公开活动、演出展示、社交陪同、面向其他客人的有偿陪侍、面向晏林的非付费接待、拍摄保存、第三方观看与具体身体行为分别确认。
          - 顾清言只负责提出、介绍和协调，不能代替当事人授权。
          - 费用、合同、固定主位、熟客偏好、曾经接受与再次出现均不产生默认许可。
      - heading: 不得写偏
        value: |-
          - 不把风归全部业务与人员写成黑产。
          - 不把风归、万安、云顶债务对象与独立从业者并成一个人员池。
          - 不让甜甜引导、训练或陪同楚辞入场；她只须早于楚辞出现，两人之间不建立因果依赖。
          - 不在本施工单元完成钱韵职业恢复、乔宁交叉、艺人显影或顾清言完整交底。
