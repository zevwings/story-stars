      - heading: 视觉参考
        value: |-
          参考视频：
          `/Users/zevwings/Library/Mobile Documents/com~apple~CloudDocs/inimate/参考/服装/v2800fgi0000d8vmosvog65niobjk20g.MP4`
          视频参数为 720×1280、约 11.47 秒。画面展示白色细吊带贴身连衣超短裙、浅弧领口、腰臀连续收束、侧边抽褶与垂落系带；腿部另配白色长袜，颈部叠加黑色细颈圈。镜头主要为正面和轻侧面，没有清楚展示后背、闭合方式与鞋履。
          采用范围：
          - 极细肩带与浅弧领口留下完整肩颈，并由贴身白色面料承接丰满胸型。
          - 上身、自然腰线、柔软臀线与超短裙摆连成一体的修身轮廓。
          - 侧缝抽褶略微改变裙摆高度，使纯白裙面不成为没有结构的直筒布片。
          - 裙摆停在大腿上段，与裸腿形成连续的白色短裙／肤色腿部对比。
          调整范围：
          - 删除视频中的白色长袜，童颜全程裸腿。
          - 删除黑色颈圈，不用颈圈制造情色身份或角色归属。
          - 不照搬参考人物的面容、身体比例、发型、动作表演、滤镜、拍摄地点、账号与平台界面。
          - 视频没有展示的后背、内衬、承托、拉链和鞋履按云顶 KTV 的现实使用重新施工，不声称来自参考原款。
      - heading: 核心视觉顺序
        value: |-
          1. **先到脸**：深色长发围住清甜显小的鹅蛋脸，圆亮杏眼仍先确认门口、距离与周围人。
          2. **再到胸腰曲线**：极细肩带下的白色贴身上身完整承接丰满胸型，衣料随后顺着身体自然贴回腰腹，不把腰身压成骤然内折的极窄线条。
          3. **最后到裸腿**：腰臀线继续落入极短裙摆，裙下不接长袜，双腿从大腿上段一直完整延伸到鞋面。
          正文不集中报胸围、罩杯、腰围或其他数值。视觉重点是衣料怎样在丰满胸型处被撑出体量、怎样在腰侧重新贴紧，以及极短白裙怎样把腿部从裙口完整放出来。
      - heading: 细吊带与领口
        value: |-
          - 使用两根极细白色肩带，位置落在肩峰内侧，不增加荷叶边、蝴蝶结、水钻或透明肩带。
          - 领口采用浅 U 形或很柔和的方圆领，不使用深 V。胸部体量由合身剪裁直接呈现，不依赖把领口继续向下挖来制造视觉重点。
          - 肩带只负责稳定上沿，不能承担丰满胸型的全部重量。内部须有软杯、胸下承托带、侧面软骨与防滑结构，避免肩带勒痕和上身整体下坠。
          - 前片使用适配丰满胸型的立体胸省或弧形分割线，胸下顺着腰身自然回收；不能用错误的小尺码把胸部硬挤出领口，也不能让面料从胸口直接垂成宽筒。
          - 肩带长度可在内侧微调，但调节扣不放大为可见金属装饰。
      - heading: 胸腰与一体式轮廓
        value: |-
          - 主体使用有回弹、低光泽的白色弹力面料，外层负责平整轮廓，内层负责遮挡与承托；不使用薄到依靠滤镜维持不透的单层白布。
          - 胸下至自然腰顺势贴合，腰部不增加镂空、腰链、束腰带、强收省道或撞色拼接。丰满胸型、自然腰线与柔软臀线之间的连续曲线才是本场主结构，不用纸片腰制造夸张尺寸落差。
          - 腰线以下顺着柔软臀部贴合，不额外增加裙撑、蓬度和分层荷叶边。身体曲线须来自童颜本人和真实合体剪裁，不写成衣服凭空改变身材，也不让贴身面料抹掉腰腹与臀腿的自然软组织感。
          - 侧拉链或背部隐形拉链承担穿脱；闭合位置以不压迫肩胛、能够本人处理为准。视频未展示后背，本场不固定露背、交叉带或后腰镂空。
      - heading: 侧抽褶包臀超短裙
        value: |-
          - 裙身与上装连为一体，不另加腰头；从腰部向下贴合臀线，裙摆停在大腿上段。
          - 一侧或两侧侧缝使用短距离抽褶，形成两至三道横向软褶；抽褶只负责调整贴合度和裙口弧度，不延伸成大面积褶皱。
          - 抽绳尾控制在手掌至小臂之间的长度，收在腿侧，不拖地、不缠绕鞋履，也不作为可被他人牵拉的道具。
          - 裙摆保持包臀而非蓬开。侧边可以略短，但正面和背面仍须有现实裙长，不能写成只在站立定格时成立的拍摄衣片。
          - 裙内使用白色或接近肤色的无痕安全短层，长度完全藏在裙摆内；落座、起身和走动仍需要童颜自己整理裙边，不把内层写成自动消除所有衣装位移。
      - heading: 裸腿与鞋履
        value: |-
          - 删除参考视频中的白色过膝袜或长袜，腿部从超短裙口到脚背保持完整裸露。
          - 不增加吊袜带、腿环、膝上绑带、脚踝长系带和带学生感的短袜。裸腿本身承担裙摆以下的全部视觉延伸。
          - 鞋履使用白色、银白或接近肤色的简洁细带中跟鞋，鞋面保持低体量，让脚背继续延长腿线。
          - 鞋跟控制在能够通过云顶走廊、正常落座并独立离场的高度；鞋底需要现实防滑，不照搬未在视频中出现的舞台鞋。
          - 若腿部存在与既有处境相关的现实伤痕，只按身体事实处理，不将伤痕美化、遮成情趣图案或作为视线引导点。
      - heading: 妆发与配饰
        value: |-
          - **头发**：使用童颜本人的深色长发，自然披下或轻偏分，使深发、白裙和裸露肩颈形成最清楚的三段颜色；不使用双马尾、齐刘海假发和角色发饰。
          - **妆面**：使用干净底妆、细眼线、自然睫毛和低饱和水红唇色。成年夜场完成度来自持妆和清醒眼神，不靠浓重修容把她改造成另一种成熟浓颜。
          - **颈部**：删除视频黑色颈圈。需要近景亮点时只使用一条极细银色短链或直接留空，不叠项圈与锁形吊坠。
          - **耳饰**：小型银白耳钉即可；不同时增加手链、腰链、臂环和腿饰。
          - **手包**：若场景需要，只保留能够放手机、证件与个人物品的小包，不让纯装饰手包代替她对随身物品和出口的控制。
      - heading: 云顶 KTV 适配
        value: |-
          - 纯白裙在暗光中容易先于面容进入视线，面料须压低反光并保留胸省、腰侧和抽褶阴影；不能把身体照成一块没有结构的白色轮廓。
          - 丰满胸型会对细肩带和上身面料产生真实牵拉。童颜可以在落座前确认肩带、胸下承托与裙边位置，不让衣装永远维持视频定格状态。
          - 落座后包臀裙会向上收，童颜先拢住裙摆再坐下，膝腿保持她当时真正选择的距离；整理衣装不写成邀请、羞怯表演或职业镜头动作。
          - 起身时先确认侧边抽绳没有被沙发压住，再将裙摆向下理平。动作既显示裙装极短，也保留她对衣服和身体的实际控制。
          - 通勤与离场须有独立的普通衣物或覆盖外层，但它们不进入白裙的主要造型画面。她可以因温度、身体不适或个人判断换回完整衣物。
      - heading: 正文优先锚点
        value: |-
          每次调用只取一至两个：
          1. 极细白肩带落在窄肩上，裙身却在胸前被撑出明显而饱满的弧度。
          2. 白色衣料离开胸下后顺着腰腹自然贴回，腰侧保留柔和弧线，不骤然折成纸片般的窄线。
          3. 裙摆停在大腿上段，没有白袜承接，裸腿从短短的白色裙口一直延伸到鞋面。
          4. 她先看了一眼门，再低头确认肩带与侧边抽褶的位置。
          5. 坐下前她把白裙下缘向下理平，起身后又重新顺过腿侧短系带。
          6. 清甜显小的脸与白裙的干净颜色先让人误判，紧贴胸腰的成年曲线随后打破第一眼印象。
      - heading: 与前后衣装的区分
        value: >-
          - 与第 08 场成年学院风双子造型相比，本场没有白衬衣、深色蝴蝶结、百褶裙、乐福鞋和袜装；白色只用于一件贴身连衣超短裙。

          - 与第 09
          场小鱼儿、悦悦黑白镜像夜装相比，本场不是抹胸与短裙的上下分体，也不承担双人反色；一体式吊带裙让胸、腰、臀和裙摆连续完成单人轮廓。

          - 与小鱼儿第 01 场黑色蕾丝短裙相比，本场没有蕾丝、深 V、多层荷叶边和暗红点缀；童颜的视觉重点来自纯白贴身面料与身体体量差。

          - 与第 11 场双人黑色情趣回归场相比，本场没有风衣遮覆、半透束腰、荷叶蕾丝、吊袜带和黑色长袜，只是一件连续贴身的白色现实夜场短裙。
      - heading: 执行边界
        value: |-
          - 童颜首次登场及本场涉及的所有交易与亲密行为均发生在她年满十八岁以后；“童颜”是姓名，不能被当成未成年设定或角色主题。
          - 不把清甜显小的脸、学生经历、辍学、家暴、伤痕和父爱缺失写成情色来源。衣装反差只建立在成年面容观感与成年身体比例之间。
          - 白裙由场所或他人临时安排，只说明她当时穿着什么，不证明她自由选择了整个交易体系，也不证明场所拥有她、衣服或后续安排。
          - 丰满胸型、自然腰线、超短裙、裸腿、付费到场和局部选择都不自动构成离场、拍摄、保存、传播、持续关系或其他身体授权。
          - 这套白裙不进入童颜的稳定个人衣柜。后续她能够自己挑选衣物时，可以保留、修改或拒绝类似轮廓，不以“越来越敢暴露”作为成长刻度。
      - heading: 当前结论
        value: >-
          第十次衣装锁定为“**童颜白色细吊带侧抽褶包臀超短裙＋完整裸腿**”：浅 U
          形细吊带上身以真实胸省、软杯和胸下承托适配丰满胸型，衣料从胸下顺着自然腰线贴回，再沿柔软臀线结束于大腿上段；裙摆以少量侧抽褶形成结构。

          本场删除参考视频中的白色长袜和黑色颈圈，不使用校服、学生配件、假发或角色道具。视觉顺序固定为“清甜显小的脸 → 丰满胸型与柔软腰臀曲线 →
          超短白裙与完整裸腿”，身体层次只服务童颜已经成年的形象辨识，不将她的学生经历和受控处境情色化。
