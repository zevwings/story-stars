      - heading: PL-I-087、PL-I-088｜松散兼职付费亲密与阶段性结束
        value: |-
          - **正式节点**：[PL-I-087｜小鱼儿与晏林建立松散付费关系](../../plotlines/亲密线/晏林/小鱼儿与晏林建立松散付费关系.md)、[PL-I-088｜小鱼儿单独付费回路阶段结束](../../plotlines/亲密线/晏林/小鱼儿单独付费回路阶段结束.md)
          | 阶段 / 顺序 | 场景功能 | 必须发生 | 执行边界 | 关联线路 |
          | --- | --- | --- | --- | --- |
          | 初次进入圈层 | 建立晏林作为真实消费者的松散入口 | 野人取得云间渠道突破后，方成越、曲修远与晏林参加代理经销商提前安排的商务 KTV 局；小鱼儿与其他成年陪局者经外部接口提前联系，晏林只确认自己与小鱼儿离场后的酒店、价格、范围和离场条件 | 小鱼儿不属于 KTV 或会所；不说明其他人的后续去向或交易；亲密不交换案件信息 | `PL-S-077` |
          | 有限数次往来 | 建立独立兼职交易的普通样本 | 晏林第一次到云顶消费时刚好遇见当晚在场的小鱼儿，由 `CON-0001` 执行；此后才通过已有联系方式主动预约，云顶第 02 次由 `CON-0002` 执行。每次重新确认，至少一次由小鱼儿修改范围、拒绝追加或按约离开；一次入梦只有生活碎片 | 偶遇不写成小鱼儿带他入场，也不把重复关系写成永久身体授权、恋爱转正或调查入口；明确拒绝后不得强制入梦；本页不重复衣装和当次场内执行 | `PL-S-091`、`CON-0001`、`CON-0002` |
          | 阶段结束 | 完成松散入口功能并结束单独付费回路 | 云顶第 02 次结束后，两人的单独付费回路降频并阶段性结束；小鱼儿后续可分别进入与悦悦、悠悠的共同付费关系，但各关系须由对应节点独立成立 | 不把共同关系写成稳定双人关系重启，不以任何一次共同邀请覆盖另一关系或其他参与者的确认；不补伴侣身份、伴侣关系细节或具体家庭冲突 | `PL-I-034`、`PL-I-036` |
          | 终局转接 | 切开旧交易与后续私人选择 | 云顶关停后，小鱼儿与晏林的付费关系不再重启；低频、非付费的私人性关系另由 `PL-I-038` 确认 | 不统一决定小鱼儿是否继续其他商业接单；不把前期交易回写成恋爱前史，不以既往付款、熟悉或帮助生成后续权限 | `PL-I-038`、`CON-0026` |
