          | 小鱼儿 | 纯白 | 纯白 | 白色／银白尖头鞋 | 深黑束发、利落水红妆 |
          | 悦悦 | 纯黑 | 纯黑 | 黑色尖头鞋 | 深色披发、冷灰粉妆 |
          - 两套保持同版、同长度和同一斜向堆褶方向，只做黑白反色；不能把小鱼儿改成白色甜美裙、悦悦改成黑色皮裙两套不同系统。
          - 每个人的上装与下装必须同色，形成一整块白与一整块黑；不再使用第 03 场“上衣反色、下身统一为黑”的分配方式。
          - 纯色不等于没有材质层次。抹胸以低光泽弹力面料保持轮廓，超短裙以轻垂坠弹力布产生褶影；不增加印花、亮片、蕾丝、金属链或撞色包边。
      - heading: 短抹胸
        value: |-
          - 两人使用同版无肩带短抹胸，上沿接近平直，只在胸线中央保留极浅弧度；下缘停在上腹，完整露出腰线。
          - 取消视频胸前的银色放射纹，正面保持纯色，只靠两道不明显的纵向省线和面料张力建立结构。
          - 内部使用软杯、防滑条和短侧骨，避免抬臂、落座和起身时上沿持续下滑；不使用透明肩带冒充无肩带结构。
          - 闭合优先放在背部短拉链或侧面隐形拉链。视频未展示背面，本场不声称沿用参考原款的扣合方式。
          - 小鱼儿的白色版本增加白色与接近肤色的双层内衬，确保云顶侧光下仍然完整；悦悦的黑色版本用浅褶和露腰区切开暗光中的上下轮廓。
      - heading: 斜向堆褶超短裙
        value: |-
          - 两人使用同版低至中腰贴身超短裙，裙腰在肚脐下方，与抹胸之间形成清楚的裸露腰腹。
          - 前片以斜向包裹方式覆盖，从一侧腰头向对侧下摆拉出斜线；靠侧缝收出两至三道软堆褶，使纯色裙面不会变成普通直筒布片。
          - 裙口左右不完全等高，但最低侧仍停在大腿上段；不增加长垂片、流苏或拖尾。
          - 内部固定同色安全短裤，裤脚藏在裙摆以内，站立时不露边；安全裤属于现实内层，不把超短裙写成能够在所有动作中自动保持遮挡。
          - 白色版本使用双层不透结构，黑色版本通过堆褶阴影与腰腹反差保留可读性；两套都不使用漆皮、亮片和大面积反光缎。
      - heading: 直接外出与无外套原则
        value: |-
          - 两套抹胸均有稳定承托，超短裙内固定同色安全短裤，鞋跟允许正常通过走廊和独立离场；小鱼儿与悦悦可以直接穿着完整黑白镜像夜装通过车辆、前厅与走廊，不另穿普通通勤衣物，也不在云顶安排换装。
          - 本场从公共到场到进入包厢都不设置脱下西装或其他外层的揭示动作，也不让任何造型外套搭在肩头；黑白镜像从两人出现时便完整成立。
          - 包厢温度不足或本人感到不适时，可以结束主要展示并调整当晚安排。无外套是造型选择，不是不得保暖、不得退出或必须维持暴露状态。
      - heading: 腿部、鞋履与配饰
        value: |-
          - 两人默认裸腿，不使用白色长袜、黑色丝袜、吊袜带和视频中的单侧腿环。
          - 鞋履使用同类尖头浅口鞋或简洁后空鞋：小鱼儿为白色或银白，悦悦为黑色；鞋跟控制在能够经过云顶走廊和独立离场的高度。
          - 首饰各留一对小型耳饰即可。小鱼儿可用冷银或珍珠白耳钉，悦悦可用枪灰或细银耳坠；不叠加项圈、腰链、手套和腿部饰品。
          - 两人都使用本人自然深色头发，不戴视频中的浅色假发和耳部造型件。
      - heading: 小鱼儿｜全白
        value: |-
          - 自然深黑发做高马尾或利落半束，使深色头发与纯白抹胸形成清楚边界。
          - 眼线较清楚，唇色使用低饱和莓红或水红；不使用白色睫毛、浅色瞳片和角色妆。
          - 全白衣装落在小鱼儿身上不是圣洁角色，而是由利落妆发压住甜度的现实夜场装。
      - heading: 悦悦｜全黑
        value: |-
          - 深色长发保持中分或轻偏分披下，脸侧留少量碎发；头发与黑色抹胸之间由裸露肩颈和锁骨切开。
          - 眼妆使用冷灰粉、细眼线与少量眼头提亮，唇色为低饱和水红；不使用黑色瞳片、裂纹妆和暗黑角色符号。
          - 黑色衣装调用她的冷色暗面审美，但不增加半透长层或主题头饰，保持纯粹的现实夜场构图。
      - heading: 云顶 KTV 适配
        value: |-
          - 小鱼儿的白色套装会成为暗光中的第一亮面，必须依靠厚实内衬与低光泽面料避免过曝和透色。
          - 悦悦的黑色套装容易与深色沙发合并，需让裸露肩颈、腰腹和斜向裙褶分别切开上装、下装与背景。
          - 两人落座前分别确认抹胸上沿与裙摆位置；起身后可以自然整理侧边堆褶。衣装管理是现实动作，不编成同步表演。
          - 同版反色已经承担全部组合感，不再增加强光、发光配件或站位固定来制造黑白舞台效果。
      - heading: 双人进入画面的顺序
        value: |-
          1. **先看见完整反色**：小鱼儿从抹胸到短裙都是白色，悦悦从抹胸到短裙都是黑色。
          2. **再看见相同剪裁**：两套抹胸的平直上沿、裸露腰腹与斜向裙口完全呼应，把一白一黑重新连成一组。
          3. **最后分清本人**：小鱼儿的束发和偏红唇色更利落，悦悦的披发与冷灰粉妆更安静；不靠角色名和主题道具区分。
          4. **落回现实夜场**：两人分别整理自己的抹胸与裙褶，没有变装揭示、角色语言或持续扮演。
      - heading: 正文优先锚点
        value: |-
          每次调用只取一至两个：
          1. 小鱼儿一身纯白，悦悦一身纯黑，两段裸露腰腹同时切开上下色块。
          2. 两条超短裙都从腰侧斜压过去，只在相反颜色中显出同样的堆褶。
          3. 悦悦的黑色裙褶靠近沙发时几乎沉下去，又被腿侧皮肤重新切开。
          4. 小鱼儿抬手确认白色抹胸上沿，悦悦则把黑裙一侧的软褶重新拨顺。
          5. 没有外套、假发和道具，两人只靠同版剪裁与黑白反色成为一组。
      - heading: 与前面衣装的区分
        value: |-
          - 与第 03 场普通黑白夜装相比，本场不再使用两条统一黑色短裤，而改为每个人上下同色；小鱼儿由黑转白、悦悦由白转黑，下装使用斜向堆褶超短裙。
          - 与第 05 场黑白天使相比，本场完全删除翅膀、羽片、背架与幻想妆造，并反转颜色分配；黑白只是一组现实夜场配色。
          - 与第 07 场娜娜黑色夜装相比，本场没有细吊带、牛仔毛边和烟灰罩衫，而是小鱼儿、悦悦同版反色的抹胸与裙装。
          - 与第 08 场成年学院风双子造型相比，本场删除白衬衣、蝴蝶结、格纹和百褶结构，视觉从学院风直接切换到纯色贴身夜场装。
          - 第 13 场黑色情趣回归场不得继续使用抹胸、黑白镜像或极简现实夜装，而以风衣遮覆、半透蕾丝束腰、荷叶短裙与吊带丝袜建立新的内外层次。
      - heading: 执行边界
        value: |-
          - 本场是小鱼儿与悦悦共同选择的现实夜场火辣装，不是 COS、云顶制服或场所固定项目。
          - 纯色、抹胸、超短裙、裸腿和两人共同到场都不构成共同报价、共同离场、拍摄、保存、传播或任何身体授权。
          - 两人分别决定抹胸上沿、裙摆、安全裤、鞋履、衣装调整与离场安排；其中一人的调整或退出不要求另一人同步。
          - 视频中的外套、腿环、假发和角色化配件已明确删除，不在正文中以临时追加方式重新出现。
      - heading: 当前结论
        value: |-
          云顶第 09 次共同亲密消费场的衣装锁定为“**小鱼儿全白＋悦悦全黑的同版镜像夜场火辣装**”：两人只穿同版无肩带短抹胸与同版斜向堆褶超短裙，小鱼儿上下纯白，悦悦上下纯黑；裙内保留同色安全短裤，画面中不出现造型外套。
          本场不是 COS。它删除参考视频中的银色胸饰、廓形西装、单侧腿环、浅色假发与耳部造型，只保留抹胸、裸露腰腹和不对称堆褶短裙的现实剪裁；第 13 场则改为小鱼儿、悦悦的双人黑色情趣回归场，不再补建第三套双人 COS。
