          | 第五日 | 完成知情观看、有限加入与范围停止 | 楚辞知道可以离开后自愿留下，逐项确认有限加入；已有会所前史不替代多人场授权 | 不形成女女关系、稳定三人关系或未来权限 | `PL-I-029` |
          | 第六日 | 让关系线与主线在同一航程错层推进 | 赵梦娜与晏林继续航程关系；楚辞与顾清言只能观察公开活动和调度异常 | 不让亲密自动产出闭门会谈情报 | `PL-M-013`、`PL-I-026` |
          | 第七日 | 完成靠岸分流 | 赵梦娜确认对晏林满意、主动提出以后常联系，并承诺帮助楚辞核查旧约；楚辞先回到自己的生活再分别决定职业与私人后续 | 不建立排他关系；人情因果可承认，身体参与不是签约价格 | `PL-S-073`、`PL-I-029` |
      - heading: PL-S-073｜旧约解除、梦娜工作室承接与职业复位
        value: |-
