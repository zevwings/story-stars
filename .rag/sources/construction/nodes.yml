      - heading: 场次作用
        value: |-
          这是小鱼儿第一次带悦悦进入同一场云顶 KTV 社交，也是两位闺蜜第一次共同出现在晏林面前。衣装需要先建立她们是一起来的、彼此熟悉的视觉关系，再让晏林从身高、发型、妆面和上衣颜色中迅速分清两个人。
          本场不是 COS。两人只借用同款异色的普通夜装形成组合感，不使用假发、瞳片、主题头饰、角色道具或角色称呼。小鱼儿只负责普通介绍，不因两人穿着成套就替悦悦报价、决定离场或确认后续关系。
      - heading: 场次接口
        value: |-
          - 本单元只承接云顶第 03 次亲密消费场；参与者为晏林、小鱼儿与悦悦。
          - 这是小鱼儿引入悦悦后的第一次双人共同场：小鱼儿与悦悦都参与当次亲密，不是小鱼儿只负责介绍或陪同、悦悦单独完成服务。
          - 两人虽然以共同造型进入同一场，但费用、离场、身体范围、停止点与影像边界仍由各自分别确认；任一人的同意不能替代另一人。
          - 本场承接 `PL-I-034` 的共同付费关系入口，并为 `PL-S-092` 提供悦悦进入云顶关系网的普通职业样本；不提前写成悦悦脱离小鱼儿后的独立场。
      - heading: 商 K 消费承接（简写）
        value: |-
          - 三人先完成真实开包、至少一轮酒水或无酒精饮品、点歌／交谈与包厢停留；正文只需选一至两个锚点，例如小鱼儿介绍悦悦时酒水刚送入或三人轮流点歌，不必逐项展开经营流程。
          - 两人的共同夜装与包厢内有限亲密可以进入消费段；是否结束包厢、由谁离场及后续场外亲密分别决定，不能因一起来、一起消费便合并两人的选择。
          - 当晚开台、酒水账单、付款、人员反馈和正常离场进入云顶经营记录，继续累计于静对晏林稳定消费与现场风险的判断；单场记录不等于递名资格。
      - heading: 视觉参考
        value: |-
          参考图片：
          `/Users/zevwings/Library/Mobile Documents/com~apple~CloudDocs/inimate/参考/服装/IMG_7438.PNG`
          采用范围：
          - 平直无肩带短上衣的贴身轮廓。
          - 上衣下缘停在胸下至上腹之间、完整露出腰腹的比例。
          - 贴身黑色超短裤与长腿形成的简洁下身轮廓。
          - 上身极简、下身利落，没有外套和复杂配件遮断身体线条的整体方向。
          不采用范围：
          - 参考图的玫红色、胸前英文印字、粉色腰带与垂挂小包。
          - 舞蹈教室、编舞动作、账号信息与画面人物的面容和身体数据。
          - 白色中筒厚底靴不直接登记为两人的固定鞋履；本场鞋履另按包厢、走廊和独立离场需要处理。
      - heading: 同款短上衣
        value: |-
          - 两人的上衣使用完全相同的版型：无肩带、平直上沿、贴身短筒形，下缘平收，不做尖角、抽绳或不对称垂片。
          - 面料采用低光泽弹力针织或双层弹力布。外观保持纯色，不使用文字、数字、品牌标志、亮片、蕾丝、撞色滚边或金属链。
          - 上衣长度短，但不能只是拍摄用布条；内部需要有防滑条、侧骨或软杯承托，确保正常抬手、落座和行走时不会持续下滑。
          - 两件上衣只改变颜色，不改变领口高度、长度和松紧程度，保证同款感真实成立。
      - heading: 同款黑色短裤
        value: |-
          - 两人统一穿纯黑贴身超短裤，腰头落在肚脐下方，保留从上衣下缘到裤腰之间的一整段腰腹。
          - 版型参考图中的黑色短裤：前片简洁、裤腿短、贴近臀胯，侧边略向上收，让腿部线条连续。
          - 材质优先低光泽弹力牛仔或有一定厚度的弹力斜纹，不使用高亮漆皮，也不写成缺少裤腰、口袋或固定结构的舞台底裤。
          - 裤脚可以有一圈很窄的同色反折，但内外都保持黑色；不采用参考图的灰色卷边效果。
          - 不系粉色腰带，不挂腿包、腰包或垂坠饰物。若现实版型需要腰带，只允许使用不抢眼的窄黑腰带，并在正文中省略。
      - heading: 小鱼儿：黑色上衣
        value: |-
          - 小鱼儿穿纯黑抹胸短上衣，与黑色短裤连成上下近似一体的黑色区块，中间由裸露腰腹切开。
          - 黑色符合她本人衣装中更利落、更甜辣的一侧，但本场不复用第一次黑色蕾丝裙的蕾丝、荷叶边和暗红外层。
          - 使用自然深黑发，可以扎高马尾或利落半束；妆面保持清楚的夜间眼线与偏红唇色，但不残留上一场阿尔杰塔的粉紫角色眼妆、冷色长耳坠和完整角色妆。
          - 配饰只留一对小型暖金耳饰，负责给全黑上身一个近距离亮点。
      - heading: 悦悦：白色上衣
        value: |-
          - 悦悦穿纯白抹胸短上衣，下身与小鱼儿保持同款黑色短裤。白色上衣把她从小鱼儿的全黑轮廓中直接分离出来，也承接她稳定衣装中的白、乳白和清冷色域。
          - 白色面料必须有足够厚度与内衬，云顶的侧光和近距离灯光下不能依靠不现实的自动遮挡。
          - 保留深色长发，中分或轻偏分自然披下，脸侧有少量碎发；不为了与小鱼儿成套而把两人的发型也做成完全一样。
          - 妆面使用灰粉／浅棕眼妆和低饱和水红唇，首饰优先一对小型银色耳饰。她的区分来自白色、长发和更柔和的妆面，不增加水晶或轻纱把普通夜装提前做成主题造型。
      - heading: 双人比例与同框效果
        value: |-
          - 小鱼儿约 181 cm，悦悦约 177 cm；两人都高挑，小鱼儿略高、骨架观感更轻，悦悦的曲线量感更柔和。正文不报数值，只通过肩位、腰线和站姿写出细微高度差。
          - 上衣必须同版同长，不能为了让两个人看起来一样而按绝对位置强行对齐；相同版型落在不同身形上，自然会显出小鱼儿更锐利的长线与悦悦更柔和的曲线。
          - 两人的黑色短裤保持同色同材质，使视线先读成一组；上半身一黑一白，再把组合拆成两个独立的人。
          - 她们可以一起进入、一起落座，也可以有熟人之间自然的对视和整理提醒，但不安排镜像舞蹈动作或持续同步摆拍。
      - heading: 鞋履与外层
        value: |-
          参考图的白色中筒厚底靴带有明确的练舞／镜头造型感，本场不直接照搬。当前只固定上衣与短裤，鞋履保留以下现实范围：
          - 小鱼儿可用黑色简洁短靴或低跟鞋，维持全黑下半身的连续性。
          - 悦悦可用白色、浅灰或黑色简洁短靴，以能在走廊行走和独立离场为准。
          - 两人不必穿同款鞋；若后续参考提供明确鞋履，再替换本段范围。
          通勤和离场各自携带一件短夹克：小鱼儿使用低光泽哑黑短夹克，衣摆停在腰线附近；悦悦使用雾灰白短夹克，轮廓略软但同样可以独立闭合。两件外层都保留黑色短裤与腿部轮廓，只解决公共空间移动和温度，不进入两人初次同框的主要视觉锚点。
      - heading: 云顶 KTV 适配
        value: |-
          - 抹胸上衣在包厢沙发上容易因抬臂、靠坐和起身发生位移，因此两件都必须有现实承托；人物可以自然检查或轻提上沿，不能让衣装永远保持拍摄定格状态。
          - 短裤落座后裤脚会向上收，坐下前可以各自整理一次裤腿与裤腰。这个动作只是衣装管理，不写成表演或邀请。
          - 黑色上衣与黑色短裤在暗光里容易连成一片；小鱼儿的露腰区和小型暖金耳饰负责切开轮廓。悦悦的白色上衣则成为两人同框中最先被看见的亮色块。
          - 不使用荧光色、发光饰品或大面积反光面料。两人的统一感来自剪裁，不靠云顶灯光制造舞台效果。
      - heading: 进入画面的顺序
        value: |-
          1. **先看见一组**：两条相同的黑色短裤、相近的露腰比例和相同的平直领口，使两人首先像一起商量过衣服。
          2. **再分颜色**：小鱼儿上身是黑色，悦悦上身是白色，黑白色块把两个人干净拆开。
          3. **再分本人**：小鱼儿的高马尾／半束发和清楚红唇更利落；悦悦的深色披发、碎发与柔和水红妆更安静。
          4. **完成介绍**：小鱼儿以闺蜜身份自然介绍悦悦，随后让出对话位置；衣装上的成套关系与闺蜜关系都不延伸为替悦悦作决定。
      - heading: 正文优先锚点
        value: |-
          每次调用只取一至两个：
          1. 两件完全同版的平直抹胸，一黑一白。
          2. 两条纯黑短裤把两人的下半身先连成一组。
          3. 相同露腰比例落在两具高挑但高度与曲线量感不同的身体上，形成自然错层。
          4. 小鱼儿的黑色上衣在暗处几乎接住短裤，只由腰腹切开。
          5. 悦悦的白色上衣成为包厢暗光中最干净的一块亮色。
          6. 两人落座前各自整理裤脚，没有镜像表演，也不互相替对方处理衣装。
      - heading: 与前后衣装的区分
        value: |-
          - 与小鱼儿上一场阿尔杰塔 COS 相比，本场彻底移除假发、头冠、角色妆、硬质胸饰、脱肩袖和长纱主题件，从繁复角色外壳回到两块纯色与现实身体比例。
          - 与小鱼儿第一次黑色蕾丝裙相比，本场不使用蕾丝、荷叶裙摆和暗红点缀；甜辣感来自抹胸、露腰和短裤的直接结构。
          - 与后续双人 COS ①相比，本场的“成套”只由同款版型和黑白配色成立，不出现角色对应关系。双人 COS ①必须新增清楚的主题、角色分工和不同于黑白便装的主轮廓。
      - heading: 执行边界
        value: |-
          - 这是小鱼儿与悦悦共同选择的普通夜装，不是云顶 KTV 制服，也不证明两人由场所统一管理。
          - 同款、露肤、一起到场和小鱼儿介绍悦悦都不构成共同报价、共同离场或共同亲密授权。
          - 小鱼儿与悦悦各自决定外层、鞋履、落座位置和离场安排；小鱼儿不替悦悦确认任何后续范围。
          - 图片只提供衣装比例参考，不把舞蹈动作、拍摄用途或社交平台语境写入云顶场景。
      - heading: 当前结论
        value: |-
          云顶第 03 次亲密消费场的衣装锁定为“**小鱼儿、悦悦同款异色纯色抹胸＋同款纯黑贴身超短裤**”：小鱼儿穿黑色上衣，悦悦穿白色上衣；两件上衣完全同版、无文字无装饰，两条短裤同色同材质。
          本场的双人辨识逻辑是“**下身统一，黑白分人**”。鞋履尚未由作者指定，当前只保留现实适配范围，不把参考图的白色中筒厚底靴固定下来。
