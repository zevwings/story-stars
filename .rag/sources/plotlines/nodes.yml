  - id: PL-M-008
    type: 主线
    name: 异常干预者观察、试探与首次有效反制
    status: pending
    locator: 反派从记录异常订单失败，推进到识别持续干预模式、主动试探并完成一次造成持续损失的有效反制。
    shape: progression
    progression_kind: chain
    criteria:
      - 正文或定稿摘要明确反派将至少两次异常结果聚合为持续干预模式。
      - 正文或定稿摘要明确出现一次针对干预者或信息来源的主动试探。
      - 正文或定稿摘要明确陆佳凝决策、刘秉文执行的周晓莉转移部分成功，并由周晓莉的长期后果落实首次持续现实损失。
