      岁、原从事销售工作的阿九被云顶规训成会主动使用“主人／母狗”话术的脚本化服务人员后，与晏林连续三晚发生分别确认的付费亲密。晏林持续询问她是否愿意、是否继续和是否需要停止，不以命令代替确认；阿九在事后温柔与非盘问式聊天中从“债还没有清”逐步说到赌场签贷、“那个人”催逼和被送入云顶。第三晚她哭泣崩溃并索取被“糟蹋”的
      C 档伤害，晏林拒绝执行却继续抱住、安抚并陪伴她，使她第一次确认拒绝伤害不等于拒绝她本人。
