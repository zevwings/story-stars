  - id: PL-S-008
    type: 副线
    name: 顾清言的隔离、解印与责任分层
    status: pending
    locator: 私域与云顶 KTV
      的最终负责人顾清言作为第一环责任人、主动涉黑经营者与成年受印者，进入隔离、评估、授权解印和责任分层流程；两店各有店级负责人，但不削弱她的最终经营责任。
    shape: progression
    progression_kind: single
    criteria:
      - 正文或定稿摘要明确隔离、评估与解印不是单一能力瞬间完成。
      - 正文或定稿摘要明确顾清言授权解印且保留撤回边界。
      - 正文或定稿摘要明确截断、闭海、外围净化、核心剥离与损伤修复的职责不同，任一能力都不能无条件完成全部流程。
      - 正文或定稿摘要明确她是会所第一环责任人，上游决策者不能因记录首先指向她而被切断追查。
      - 正文或定稿摘要明确种印前主动犯罪、退出阶段、种印后自主行为、直接受控行为和受害后果分层处理。
      - 正文或定稿摘要明确顾清言承担实刑及相应现实后果，解印、减害与配合调查不自动免罪。
      - 正文或定稿摘要明确拒绝晏林不影响顾清言的保护、治疗、解印、证据评价与责任处理，且双方未在程序影响关系切开前兑现私人关系。
