  - id: PL-M-015
    type: 主线
    name: 多线分波知情与最低危机责任
    status: pending
    locator: 阶段四；管理局或黑暗线危机使
      苏璃—唐雨薇、苏晚乔、安若曦—江岚三组关系线的真实关系与安全风险无法继续分开处理，已确认关系者分波获得影响自身选择的必要事实，并形成只对当前危机有效的最低责任规则。
    shape: progression
    progression_kind: single
    criteria:
      - 正文或定稿摘要明确 苏璃—唐雨薇、苏晚乔、安若曦—江岚三组关系线 按安全、选择和责任分波获得必要事实，没有一次性公开全部秘密。
      - 正文或定稿摘要明确五人分别保有参与、拒绝、退出、暂停与独处权，不由其他关系者代答。
      - 正文或定稿摘要明确风险影响本人时必须告知，且至少一项危机安排实际执行了该边界。
      - 正文或定稿摘要明确本节点未完成全员协商成阵、统一关系制度或默认多人亲密授权。
