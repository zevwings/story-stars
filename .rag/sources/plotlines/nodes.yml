    progression_kind: single
    criteria:
      - 正文或定稿摘要明确唐雨霖通过黑市一次性雇佣欲望方向契约者。
      - 正文或定稿摘要明确欲望干扰只放大既有欲望/冲动，不制造同意、爱慕或指定对象。
      - 正文或定稿摘要明确晏林截断的是正在输入的外来精神连接，并承担相应精神负担或暴露风险。
      - 正文或定稿摘要明确偷拍未成功，且本案不进入警方、管理局、黑市追踪链或唐家整体冲突。
      - 正文或定稿摘要保留苏璃的职业场边界：苏璃不参与异常识别、截断或离场处置。
