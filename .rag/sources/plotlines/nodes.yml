  - id: PL-M-002
    type: 主线
    name: 共同精神控制方法显影
    status: pending
    locator: 多个独立案件首次呈现同源的精神侵蚀、关系控制与自我解释替换方法。
    shape: progression
    progression_kind: chain
    criteria:
      - 正文或定稿摘要明确至少两类案件呈现可验证共同方法。
      - 正文或定稿摘要以郑文悦及其余七名招聘／用工接口的独立材料，明确“事实准确、归因固定”的共同异常不是单人口供或简单串供。
      - 正文或定稿摘要明确身份与组织归属仍未揭穿。
      - 正文或定稿摘要明确受控者的行为责任按具体事实分层处理。
    upstream: "`PL-M-001`、`PL-S-006`。"
