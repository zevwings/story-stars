  - id: PL-M-014
    type: 主线
    name: 多线首次可见与分别继续
    status: pending
    locator: 阶段三；苏璃与谢晚乔第一次确认对方也是从阶段一开始成立并持续兑现的现实伴侣，晏林必须承担长期隐瞒、限定性真话、时间切割与补偿性安排造成的后果。
    shape: progression
    progression_kind: single
    criteria:
      - 正文或定稿摘要明确苏璃与谢晚乔首次确认彼此的关系从阶段一已持续成立，两人都不是后来者。
      - 正文或定稿摘要明确晏林承认隐瞒、限定性真话、时间切割和补偿安排造成的后果，没有把两人互相审批。
      - 正文或定稿摘要明确苏璃与谢晚乔分别表达继续意愿、介意与可停边界，两段关系分别继续。
      - 正文或定稿摘要明确继续选择不自动完成原谅、稳定三人关系或当天共同身体兑现。
    upstream: "`PL-I-003`、`PL-S-003`、`PL-I-004`、`PL-I-016`、`PL-I-013`、`PL-I-005`。"
    downstream: "[PL-I-018｜苏璃、谢晚乔与晏林首次共同亲密边界](../../../亲密线/晏林/苏璃×谢晚乔-首次共同亲密边界.md)、[\
      PL-M-015｜多线分波知情与最低危机责任](./多线分波知情与最低危机责任.md)；阶段五协商成阵。"
    related: ""
    chapter_interface: 阶段三的第一次跨线可见、正面说明与继续选择。
    construction_interface: ""
    sources:
