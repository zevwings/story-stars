  - id: PL-M-016
    type: 主线
    name: 长期关系共同秩序与协商成阵
    status: pending
    locator: 阶段五；在各段关系分别成立、阶段四最低危机责任已经实际运行后，长期关系者把临时危机协作推进为可在生活、公开、职业、亲密与后续危机中持续执行的共同秩序。
    shape: loop
    progression_kind: ""
    criteria:
      - 正文或定稿摘要明确长期关系者分别获得影响自身选择的必要事实，并能独立表达接受、反对、暂停或退出。
      - 正文或定稿摘要明确最低共同规则已在至少一项生活、公开、职业、亲密或危机安排中实际执行，而非只停在口头会议。
      - 正文或定稿摘要能验证陪伴、公开、居住或危机责任并非固定席位；相关人的职业、生活或风险条件变化后，至少一项既有安排被重新确认、调整或拒绝。
      - 正文或定稿摘要明确各条独立关系线、各段双人关系及非核心长期伴侣位置继续独立，不形成主母、审批或统一席位制度。
      - 正文或定稿摘要至少一次出现许知秋以“老板娘”称呼其他关系女性，并让对方拥有接受、反问、纠正或要求换称呼的位置；称呼没有被用作关系等级或公开证明。
      - 正文或定稿摘要明确多人亲密、共同居住、共同工作与共同危机行动均不构成默认义务，拒绝和不参与不会导致关系自动降级。
    upstream: "[PL-M-015｜多线分波知情与最低危机责任](./多线分波知情与最低危机责任.md)，以及各长期关系的独立确认节点。"
    downstream: 尾声中的共同生活、持续协商、职业分权与公开边界复验。
    related: ""
    chapter_interface: 阶段五分波告知、新关系进入后的分别回应、生活排期、职业分权、公开选择与危机后复盘。
    construction_interface: ""
    sources:
      - "`BIBLE.md`"
      - "`story/arcs/阶段五.md`"
      - "`story/plotlines/主线/人物/内圈/多线分波知情与最低危机责任.md`"
      - "`characters/major/晏林/主卡.md`"
    source_file: story/plotlines/主线/人物/内圈/长期关系共同秩序与协商成阵.md
  - id: PL-M-007
    type: 主线
    name: 双子星主体解释权与分层公开边界
    status: pending
    locator: 三年间由多案能力痕迹、反派错误模型、管理局有限复评和内圈分层知情持续累积，阶段五至终局建立兼顾主体权、他人安全与制度责任的分层解释边界。
    shape: progression
    progression_kind: single
    criteria:
      - 正文或定稿摘要明确晏林承担必要说明与公共安全责任，同时保有对自身结构、风险、使用边界和处置方式的参与解释权。
      - 正文或定稿摘要明确五位核心女主完整知情、管理局只备案梦境与幻境，且两层知情没有互相扩张。
      - 正文或定稿摘要明确至少一种家族、黑市或反派的资源化／工具化解释被否定，未取得双子星处置权。
      - 正文或定稿摘要明确终局边界来自三年持续累积，而非一次公开或一次备案突然完成。
      - 正文或定稿摘要以一次双星参与的对敌或公共风险结果，验证主体权、他人真实授权与制度责任可以同时成立。
      - 正文或定稿摘要明确登记外能力材料的访问与权限扩张可追踪、可复核，且晏林能够对越权推定留下有效异议记录。
      - 正文或定稿摘要明确普通社会仍不知道星辰契约及双子星真相。
    upstream: "`PL-S-005`、`PL-S-007`、`PL-S-036`、`PL-M-003`、[PL-M-008｜异常干预者观察、试探与首次有\
      效反制](../../组织/反派/异常干预者观察试探与首次有效反制.md)。"
    downstream: 全书结局的新秩序与尾声分层运行。
    related: ""
    chapter_interface: 终局双星调用、外部错误解释冲突、内圈风险选择、管理局有限备案边界检验与尾声运行结果。
    construction_interface: "[CON-0013｜晏林初案截断与双子星边界施工](../../../../construction/晏林双\
      子星与管理局线/01_晏林初案截断与双子星边界.md)。"
    sources:
      - "`BIBLE.md`"
      - "`characters/major/晏林/主卡.md`"
      - "`characters/major/晏林/契约.md`"
      - "`worldbuilding/systems/星辰契约.md`"
      - "`worldbuilding/factions/星辰管理局.md`"
