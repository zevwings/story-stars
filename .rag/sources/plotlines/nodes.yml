  - id: PL-S-076
    type: 副线
    name: 多场所亲密入口、入梦与线索拼合
    status: pending
    locator: 晏林以真实消费者身份在云顶 KTV
      接触自由交易者、合同受限者、场所从业者及其他成年对象，并逐步进入私域；关系后的普通聊天与入梦，使多人的主观梦境碎片逐步形成云顶—私域、万安项目与债务入口的调查方向，同时引发场所反制。
    shape: progression
    progression_kind: chain
    criteria:
      - 正文或定稿摘要明确至少一名自由交易者与一名处于结构性限制中的成年人不能使用同一授权口径。
      - 正文或定稿摘要保持梦露、月月、淼淼、小娜、童颜与阿九六人的入口、自由程度和信息功能分轴，没有互相借用身份或线索。
