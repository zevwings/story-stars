  - id: PL-M-004
    type: 主线
    name: 核心反派责任链清算
    status: pending
    locator: 通过有效证言、现实记录与跨案件证据完成齐心、陆佳凝及分层共犯责任链的追查、审判与后果落地。
    shape: progression
    progression_kind: chain
    criteria:
      - 正文或定稿摘要明确核心反派被找到并进入正式审判流程。
      - 正文或定稿摘要明确顾清言以有限自主选择、留证或反向误导参与打开追查窗口，清算不依赖齐心突然犯错。
      - 正文或定稿摘要以可复核证据确认陆佳凝并非事后包庇者，而是合法出境组织与境外交接链的共同设计者和直接负责人。
      - 正文或定稿摘要明确齐心、陆佳凝及其他共犯的责任按具体参与行为分层。
      - 正文或定稿摘要以分别可复核的记录证明章绍衡的债务入口、顾清言的场所经营，以及齐心与裴家的共同收益关系。
      - 正文或定稿摘要区分万安影视文化的正常经纪业务与以短期包装、条款压迫和输送变现为目的的涉案项目。
      - 正文或定稿摘要没有让刘秉文承担境内赌场、非法放贷或场所经营责任。
      - 正文或定稿摘要明确郑文悦等受控招聘／用工接口没有被统一免责或统一定罪，其陈述也没有替代现实证据。
      - 正文或定稿摘要未把境外资产转名和运营权让渡误认成齐、裴真实退出，能够以人员、技术、收益和重大决策证据恢复实质控制关系。
      - 正文或定稿摘要明确裴家核心责任人按购买、拘禁、实验、记录伪造或再分流等具体行为承担后果，合法业务与未涉案人员不被整体定罪。
      - 正文或定稿摘要落实裴崇礼被判处死刑、裴怀山逃亡途中武力反抗并被击毙、裴兰馨被判处终身监禁的分层结局。
      - 正文或定稿摘要明确任群作为独立外部合作者对自身执行行为承担责任，并被判处终身监禁。
      - 正文或定稿摘要明确受害者后果与残余链条仍被处理。
      - 正文或定稿摘要完成涉案节点与合法产业切割；裴家境内可合法存续产业全部由江州城市投资集团接收并按业务重组为全资子公司，裴家不保留股权或控制权。
    upstream: "[PL-M-006｜陆佳凝合法出境组织与境外交接显影](陆佳凝境外承接网络显影.md)；其上游为
      [PL-M-003｜解释权争夺与非法种印链](解释权争夺与非法种印链.md)。"
    downstream: 终局共同秩序与解释权新规则。
    related: ""
    sources:
