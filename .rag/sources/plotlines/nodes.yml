  - id: PL-M-013
    type: 主线
    name: 云梦号六人会谈与跨境运营重组
    status: pending
    locator: 第四阶段七日慈善邮轮期间，齐心、陆佳凝、裴崇礼、裴怀山、裴兰馨与朱岑郁完成六人闭门会谈，以最少合作条款确认金洲园区和实验中心的跨境运营重组。
    shape: progression
    progression_kind: chain
    criteria:
      - 正文或定稿摘要明确核心会谈固定为六人，且六人分别拥有不可替代的决策权限。
      - 正文或定稿摘要明确金洲与兰纳是两个国家，朱岑郁以跨境合作承担金洲现场责任。
      - 正文或定稿摘要只确认维持重组运行所需的最少条款，没有让三方共享全部业务。
      - 正文或定稿摘要明确齐、裴向朱岑郁让出名义经营、日常运营和现场风险后，仍分别保留人员与实验控制。
      - 正文或定稿摘要区分基金会公开公益、邮轮费用、闭门会谈与私人亲密活动，不以其中任何一层替代另一层。
    upstream: "[PL-M-003｜解释权争夺与非法种印链](./解释权争夺与非法种印链.md)及三方既往少量执行合作。"
    downstream: "[PL-M-006｜陆佳凝合法出境组织与境外交接显影](./陆佳凝境外承接网络显影.md)、[PL-M-004｜核心反派责任链清算]\
