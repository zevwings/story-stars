  - id: PL-S-026
    type: 副线
    name: 万安影视文化艺人压迫与咨询显影
    status: pending
    locator: 由程叙的现实危机与咨询入口显影万安影视文化把正常培养与灰黑新人包装并置、利用合同资源压迫艺人并向私人项目和娱乐场所定向提供的模式，再与乔宁、梁予安及何知远的独立案件交叉验证。
    shape: progression
    progression_kind: chain
    criteria:
      - 正文或定稿摘要确认程叙经医疗处置后自愿进入工作室，并完成现实风险管理与必要转介。
      - 正文或定稿摘要以程叙、梁予安、何知远和乔宁中至少三人的独立材料验证重复压迫方法。
      - 正文或定稿摘要拆分裴兰馨、任群及乔宁案具体接收者的行为与责任，不用单一反派概括整条链。
      - 正文或定稿摘要保留至少一名存活受害者对陈述、公开、治疗与职业路径的自主选择。
      - 正文或定稿摘要没有把抑郁、自伤、自杀风险或死亡单一归因于星辰能力。
      - 正文或定稿摘要区分真实长期培养、灰黑短期包装及进入顾清言场所的少数私人项目。
      - 正文或定稿摘要明确会所外围梦境只提供异常方向，正式显影仍由独立当事人材料和现实记录完成。
