  - id: PL-M-006
    type: 主线
    name: 陆佳凝合法出境组织与境外交接显影
    status: pending
    locator: 阶段四后段至阶段五清算前；境内精神控制、合法旅游／务工等出境记录、境外失联去向与资产运营权转移发生可验证交叉，陆佳凝的合法出境组织、首次交接、风险重组与责任链切割由隐藏事实转为可追责对象。
    shape: progression
    progression_kind: chain
    criteria:
      - 正文或定稿摘要明确至少一组真实出入境记录、公开行程中断与境外接收记录完成交叉验证。
      - 正文或定稿摘要明确陆佳凝对合法出境组织、境外交接和失联后的真实去向具有事前知情与持续协调责任，不是事后包庇者。
      - 正文或定稿摘要明确陆佳凝、境外黑暗接收方与裴家之间存在持续但非排他的交接和实验接口，且三方责任没有相互替代。
      - 正文或定稿摘要同时证明齐、裴已向朱岑郁让渡部分境外利益和日常运营，又以人员来源、实验技术、结果与重大决策保留实质控制。
      - 正文或定稿摘要明确朱岑郁以兰纳安吉旅游集团为公开表层、拥有当地黑色势力与器官贩卖链，并把器官贩卖和裴家人体实验的责任分别定性。
      - 正文或定稿摘要明确邮轮并非由朱岑郁或兰纳安吉旅游集团赞助，主要费用来自齐心一侧，且没有用基金会善款直接承担高价包船费用。
      - 正文或定稿摘要明确齐心、陆佳凝、具体执行者、合法机构及未涉案人员的责任没有被合并处理。
      - 正文或定稿摘要形成可以进入 `PL-M-004` 正式清算的身份、行为与主观知情证据入口。
    upstream: "[PL-M-003｜解释权争夺与非法种印链](解释权争夺与非法种印链.md)、[PL-M-013｜云梦号六人会谈与跨境运营重组](云梦号\
