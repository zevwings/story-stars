schema_version: 1
domain: characters
templates:
  - id: characters.profile
    summary: 建立人物静态身份、行为逻辑与写作边界
    target: characters/{tier}/{character}/主卡.md
    output_schema: character.profile@1
    primary:
      path: library/profile.md
    supplements: []
  - id: characters.appearance
    summary: 建立人物静态形象档案
    target: characters/{tier}/{character}/形象.md
    primary:
      path: library/appearance.md
    supplements: []
  - id: characters.outfit-grammar
    summary: 建立人物稳定衣装语法
    target: characters/{tier}/{character}/衣装/衣装语法.md
    primary:
      path: library/outfit-grammar.md
    supplements: []
  - id: characters.outfit-index
    summary: 建立人物衣装入口
    target: characters/{tier}/{character}/衣装/_index.md
    output_schema: character.outfit-index@1
    primary:
      path: library/outfit-index.md
    supplements: []
  - id: characters.outfit
    summary: 建立一套可跨场复用的具体衣装
    target: characters/{tier}/{character}/衣装/{outfit}
    primary:
      path: library/outfit.md
    supplements: []
  - id: characters.relationship-index
    summary: 建立人物关系摘要入口
    target: characters/{tier}/{character}/关系/_index.md
    primary:
      path: library/relationship-index.md
    supplements: []
  - id: characters.relationship
    summary: 建立重要配对的静态关系档
    target: characters/{tier}/{character}/关系/{other}
    output_schema: character.relationship@1
    primary:
      path: library/relationship.md
    supplements: []
bundles:
  - id: characters.create
    required: [characters.profile]
    optional: [characters.appearance, characters.outfit-grammar, characters.outfit-index, characters.relationship-index]
