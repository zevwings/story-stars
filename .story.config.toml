type = "character.static"
static_cards = ["主卡.md", "形象.md", "衣装/衣装语法.md", "契约.md"]

[[context.roots]]
path = "context/characters"
type = "character_dynamic"

[timeline.entity_names]
state = []

[dependencies.specialties.clothes]
version = "0.0.3"
enabled = true

[dependencies.specialties.intimacy]
